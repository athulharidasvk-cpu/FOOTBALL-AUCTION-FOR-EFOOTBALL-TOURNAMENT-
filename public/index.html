function exportCareerJsonBackup() {
  if (!S) return alert('No career currently active to export.');
  const backup = {
    club: S.selectedClub,
    season: S.season,
    matchday: S.matchday,
    exportedAt: new Date().toISOString(),
    state: S
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `career_${(S.selectedClub || 'save').toLowerCase().replace(/\s+/g, '_')}_s${S.season}_m${S.matchday}.json`;
  a.click();
  URL.revokeObjectURL(url);
  autoSaveManager.showToast('Backup Exported', 'Downloaded career JSON backup');
}

function restoreFromLocalBackup() {
  if (!S?.selectedClub) return alert('No active club to restore.');
  try {
    const raw = localStorage.getItem('fw4_backup_' + S.selectedClub);
    if (!raw) return alert('No local snapshot found for ' + S.selectedClub + ' yet. Play or save once to create a snapshot.');
    const parsed = JSON.parse(raw);
    if (confirm(`Restore snapshot for ${parsed.club} from ${parsed.time} (Season ${parsed.season}, Matchday ${parsed.matchday})?`)) {
      if (parsed.data) {
        S = parsed.data;
        renderGame();
        autoSaveManager.showToast('Backup Restored', `Restored ${parsed.club} from ${parsed.time}`);
        document.getElementById('autoSaveSettingsModal')?.remove();
      }
    }
  } catch(e) {
    alert('Error restoring backup: ' + e.message);
  }
}

function saveGame(showAlert = true) {
  if (window.autoSaveManager) return autoSaveManager.performSave("manual", { silent: !showAlert });

  const saveBtn = document.getElementById('hudSaveBtn');
  if (saveBtn) {
    saveBtn.innerHTML = `<span>⏳ SAVING...</span>`;
    saveBtn.style.opacity = '0.7';
  }

  post('/api/world4/save', ref({ club: S?.selectedClub }))
    .then(data => {
      if (data.state) S = data.state;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      session = {
        ...session,
        savedClub: S?.selectedClub || session?.savedClub,
        savedTime: now
      };
      save();
      playSfx('stamp');

      if (saveBtn) {
        saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVED!</span>`;
        saveBtn.style.opacity = '1';
        saveBtn.style.borderColor = 'var(--accent-neon)';
        saveBtn.style.color = 'var(--accent-neon)';
        setTimeout(() => {
          if (saveBtn) {
            saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVE GAME</span>`;
            saveBtn.style.borderColor = 'var(--accent-gold)';
            saveBtn.style.color = 'var(--accent-gold)';
          }
        }, 2200);
      }

      if (showAlert) {
        openSaveConfirmationModal(now);
      }
    })
    .catch(err => {
      if (saveBtn) {
        saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVE GAME</span>`;
        saveBtn.style.opacity = '1';
      }
      alert('Save failed: ' + err.message);
    });
}

function simulateMatch(fastMode = false) {
  if (matchSimulationInProgress) return;
  matchSimulationInProgress = true;

  const btn = document.getElementById('kickoffBtn') || document.getElementById('hudKickoffBtn');
  if (btn) {
    btn.classList.add('btn-loading');
    btn.disabled = true;
  }

  playSfx('kickoff');

  post('/api/world4/match/simulate', ref({ club: S.selectedClub, mentality: clientSelectedMentality }))
    .then(data => {
      matchSimulationInProgress = false;
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
      if (data.state) S = data.state;
      if (data.nextFixture) cachedNextFixture = data.nextFixture;
      triggerLiveBudgetUpdate(`${svgIcon('ball', 14)}  Matchday Revenue: +₹${money(data.revenue || data.match?.revenue)}M Gate Receipts`, 'revenue');

      if (fastMode) {
        activeLiveMatch = null;
        openMatchModal(data.match || data);
        renderGame();
        if (window.autoSaveManager) window.autoSaveManager.triggerEventSave('match', 'Fast Matchday');
      } else {
        startInteractiveLiveMatch(data.match || data);
      }
    })
    .catch(err => {
      matchSimulationInProgress = false;
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
      alert(err.message || 'Match simulation error');
    });
}

let activeAwardsCountry = null;
let activeAwardsDivision = 1;
let activeAwardsSeasonIndex = 0;

function renderAwardsGala(container) {
  const myClub = S.clubs.find(x => x.name === S.selectedClub) || {};
  const country = activeAwardsCountry || myClub.country || 'England';
  const division = activeAwardsDivision || 1;

  // Retrieve awards record from S.awardsHistory
  let awardsRecord = S.awardsHistory && S.awardsHistory[activeAwardsSeasonIndex];

  // If no awards exist yet, synthesize a real-time preview of projected awards based on current stats!
  if (!awardsRecord) {
    const contractedPlayers = [];
    S.clubs.forEach(c => {
      (c.players || []).forEach(pid => {
        const p = S.market.find(m => m.id === pid);
        if (p) contractedPlayers.push({ p, club: c });
      });
    });

    const getScore = (item) => {
      const { p, club: c } = item;

function launchGlobalTournamentNow() {
  post('/api/world4/tournament', ref({})).then(data => {
    if (data.tournament) S.globalTournament = data.tournament;
    renderGame();
    switchTab('tournament');
  }).catch(err => {
    // Call GET fallback
    get('/api/world4/tournament').then(d => {
      if (d.tournament) S.globalTournament = d.tournament;
      renderGame();
      switchTab('tournament');
    }).catch(e => alert(e.message));
  });
}

function simulateTournamentRoundUI() {
  post('/api/world4/tournament/simulate', ref({})).then(data => {
    if (data.error) return alert(data.error);
    if (data.tournament) S.globalTournament = data.tournament;
    playSfx('deal');
    renderGame();
    switchTab('tournament');
  }).catch(err => alert(err.message));
}

function respondToIncomingOfferUI(offerId, decision, currentFee = 10) {
  let counterFee = null;
  if (decision === 'counter') {
    const suggested = Math.round(currentFee * 1.25 * 10) / 10;
    const input = prompt(`Enter your counter-offer price in ₹ Millions (Current offer is ₹${currentFee}M):`, String(suggested));
    if (!input) return;
    counterFee = Number(input);
    if (isNaN(counterFee) || counterFee <= 0) return alert('Invalid counter price.');
  }

  post('/api/world4/offers/respond', ref({ offerId, decision, counterFee })).then(res => {
    if (res.error) return alert(res.error);

    if (res.status === 'accepted') {
      playSfx('deal');
      playSfx('applause');
      triggerLiveBudgetUpdate(`${svgIcon('handshake', 14)}  Transfer Complete: Sold player for ₹${money(res.cashGained)}M!`, 'revenue');
      alert(`${svgIcon('handshake', 14)}  DEAL RATIFIED!\n\n${res.message}`);
      document.getElementById('incomingOffersModal')?.remove();
      renderGame();
      return;
    } else if (res.status === 'rejected') {
      playSfx('kick');
      alert(res.message);
      document.getElementById('incomingOffersModal')?.remove();
      renderGame();
      return;
    } else if (res.status === 'counter_compromise') {
      playSfx('deal');
      const acceptComp = confirm(`${res.message}\n\nDo you want to accept this revised compromise fee of ₹${res.revisedFee}M now?`);
      if (acceptComp) {
        return respondToIncomingOfferUI(offerId, 'accept');
      }
      openIncomingOffersModal();
      return;
    }

    alert(res.message);
    document.getElementById('incomingOffersModal')?.remove();
    renderGame();
  }).catch(err => alert(err.message));
}

function solicitMarketInterest() {
  post('/api/world4/offers/generate', ref({ count: 2 })).then(res => {
    playSfx('deal');
    alert(`${svgIcon('megaphone', 14)}  Scouts from ${res.offers?.length || 2} rival clubs responded to your inquiry! Review incoming transfer bids in your inbox.`);
    renderGame();
    openIncomingOffersModal();
  }).catch(err => alert(err.message));
}

function calculateClientBudget(c) {
  if (!c) return null;
  const myPlayers = (S?.market || []).filter(p => p.ownerClub === c.name);
  const totalSquadSalary = myPlayers.reduce((sum, p) => sum + (p.contract?.salary || 0.45), 0);
  const managerSalary = c.manager?.salary || 0.4;
  const wageBillAnnual = Math.round((totalSquadSalary + managerSalary) * 10) / 10;
  const wageBillPerMatch = Math.round((wageBillAnnual / 24) * 100) / 100;

  const stadiumCap = c.stadium?.capacity || 20000;
  const projectedAttendance = c.lastProjectedAttendance || Math.round(stadiumCap * ((c.popularity || 60) / 100));
  const ticketPrice = c.ticketPrice || 350;
  const ticketRevPerMatch = Math.round(((projectedAttendance * ticketPrice) / 1000000) * 100) / 100;

  const merchUnit = c.merchandise || 60;
  const merchRevPerMatch = Math.round(((projectedAttendance * merchUnit * 0.35) / 1000000) * 100) / 100;

  const sponsorAnnual = c.sponsor ? (c.sponsor.value || 2.5) : 1.5;
  const sponsorPerMatch = Math.round((sponsorAnnual / 24) * 100) / 100;

  const projectedRevPerMatch = Math.round((ticketRevPerMatch + merchRevPerMatch + sponsorPerMatch) * 100) / 100;
  const netCashflowPerMatch = Math.round((projectedRevPerMatch - wageBillPerMatch) * 100) / 100;
  const projectedTurnoverAnnual = Math.round((projectedRevPerMatch * 24) * 10) / 10;
  const ffpRatio = projectedTurnoverAnnual > 0 ? Math.round((wageBillAnnual / projectedTurnoverAnnual) * 100) : 65;

  let ffpGrade = 'A';
  let ffpStatus = 'EXCELLENT';
  let ffpColor = '#00e599'; // Emerald
  if (ffpRatio > 85 || (c.cash || 0) < 1.0) {
    ffpGrade = 'D';
    ffpStatus = 'FFP RISK';
    ffpColor = '#ef4444'; // Red
  } else if (ffpRatio > 70) {
    ffpGrade = 'C';
    ffpStatus = 'MONITORED';
    ffpColor = '#eab308'; // Amber
  } else if (ffpRatio > 52) {
    ffpGrade = 'B';
    ffpStatus = 'HEALTHY';
    ffpColor = '#00f0ff'; // Cyan
  }

  const transferWarChest = Math.max(0, Math.round(((c.cash || 0) * 0.6) * 10) / 10);
  const wageReserve = Math.max(0, Math.round(((c.cash || 0) * 0.3) * 10) / 10);
  const emergencyReserve = Math.max(0, Math.round(((c.cash || 0) * 0.1) * 10) / 10);

  const budgetObj = {
    cash: Math.round((c.cash || 0) * 10) / 10,
    wageBillAnnual,
    wageBillPerMatch,
    projectedRevPerMatch,
    ticketRevPerMatch,
    merchRevPerMatch,
    sponsorPerMatch,
    sponsorAnnual,
    netCashflowPerMatch,
    projectedTurnoverAnnual,
    ffpRatio,
    ffpGrade,
    ffpStatus,
    ffpColor,
    transferWarChest,
    wageReserve,
    emergencyReserve
  };

  c.budget = budgetObj;
  return budgetObj;
}

function triggerLiveBudgetUpdate(feedbackText = null, feedbackType = 'info') {
  if (!S) return;
  const c = S.clubs?.find(x => x.name === S.selectedClub);
  if (!c) return;

  const b = calculateClientBudget(c);
  const container = document.getElementById('headerLiveBudgetTracker');
  if (container) {
    container.outerHTML = renderHeaderBudgetTrackerHtml(c, b);
  }

  const pulseTag = document.getElementById('budgetTrackerPulseTag');
  if (pulseTag && feedbackText) {
    pulseTag.textContent = feedbackText;
    pulseTag.style.display = 'inline-block';
    pulseTag.style.background = feedbackType === 'error' ? '#ef4444' : feedbackType === 'salary' ? '#06b6d4' : feedbackType === 'transfer' ? '#10b981' : feedbackType === 'revenue' ? '#f59e0b' : '#0284c7';
    clearTimeout(window._budgetPulseTimeout);
    window._budgetPulseTimeout = setTimeout(() => {
      const t = document.getElementById('budgetTrackerPulseTag');
      if (t) t.style.display = 'none';
    }, 4000);
  }

  // Save session state to ensure full persistence
  save();
}

let currentPressConference = null;
let currentPressAnswers = [];
let currentCustomPressStatements = {};

function updatePressImpactPreview() {
  const previewEl = document.getElementById('pressImpactPreview');
  if (!previewEl || !currentPressConference) return;

  let totalRep = 0;
  let totalMorale = 0;
  let totalBoard = 0;
  let totalFans = 0;

  (currentPressConference.questions || []).forEach((q, idx) => {
    const custom = currentCustomPressStatements[idx];
    if (custom && custom.trim().length > 3) {
      totalRep += 3;
      totalMorale += 6;
      totalBoard += 5;
      totalFans += 7;
    } else {
      const ans = currentPressAnswers[idx] || q.options[0];
      if (ans && ans.effects) {
        totalRep += Number(ans.effects.reputation) || 0;
        totalMorale += Number(ans.effects.morale) || 0;
        totalBoard += Number(ans.effects.boardConfidence) || 0;
        totalFans += Number(ans.effects.fanApproval) || 0;
      }
    }
  });

  previewEl.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:800;">
      <span style="color:var(--text-muted);display:flex;align-items:center;gap:6px;">
        <span>${svgIcon('stats', 14)}  PROJECTED IMPACT ON SQUAD &amp; CAREER:</span>
      </span>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <span class="pill" style="background:rgba(253,224,71,0.18);color:#fde047;border:1px solid rgba(253,224,71,0.4);">
          ⭐ Rep ${totalRep >= 0 ? '+' : ''}${totalRep}
        </span>
        <span class="pill" style="background:${totalMorale >= 0 ? 'rgba(34,197,94,0.18)' : 'rgba(239,68,68,0.18)'};color:${totalMorale >= 0 ? '#86efac' : '#fca5a5'};border:1px solid ${totalMorale >= 0 ? 'rgba(34,197,94,0.4)' : 'rgba(239,68,68,0.4)'};">
          ${svgIcon('flame', 14)}  Morale ${totalMorale >= 0 ? '+' : ''}${totalMorale}%
        </span>
        <span class="pill" style="background:rgba(56,189,248,0.18);color:#7dd3fc;border:1px solid rgba(56,189,248,0.4);">
          ${svgIcon('dot-green', 14)}  Board ${totalBoard >= 0 ? '+' : ''}${totalBoard}%
        </span>
        <span class="pill" style="background:rgba(244,114,182,0.18);color:#f472b6;border:1px solid rgba(244,114,182,0.4);">
          ${svgIcon('heart', 14)} ️ Fans ${totalFans >= 0 ? '+' : ''}${totalFans}%
        </span>
      </div>
    </div>
  `;
}

function updateCustomPressStatement(qIdx, text) {
  currentCustomPressStatements[qIdx] = text;
  updatePressImpactPreview();
}

const openPressMeetingModal = openPressConferenceModal;

function selectPressOption(qIdx, oIdx) {
  if (!currentPressConference) return;
  const q = currentPressConference.questions[qIdx];
  currentPressAnswers[qIdx] = { ...q.options[oIdx], questionId: q.id || `q_${qIdx}` };
  updatePressImpactPreview();
}

function submitPressConferenceAction() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;

  post('/api/world4/press/submit', ref({
    club: c.name,
    answers: currentPressAnswers,
    customStatements: currentCustomPressStatements
  })).then(res => {
    document.getElementById('pressConferenceModal')?.remove();
    playSfx('flash');
    playSfx('applause');
    S = res.state || res;
    showPressDebriefModal(res.result || res);
    renderGame();
  }).catch(err => alert(err.message || 'Error submitting press briefing'));
}

      ` : ''}

  `;

function playShootoutStepAction() {
  const s = shootoutState;
  if (!s) return;

  post('/api/world4/shootout/round', ref({
    club: S.selectedClub,
    opponent: s.opponent,
    userShot: s.selectedShot,
    userDive: s.selectedDive
  })).then(res => {
    if (res.userScored) {
      s.userGoals++;
      s.userRounds.push(true);
      playSfx('goal');
    } else {
      s.userRounds.push(false);
      playSfx('whistle');
    }

    if (res.oppScored) {
      s.oppGoals++;
      s.oppRounds.push(true);
    } else {
      s.oppRounds.push(false);
      playSfx('applause');
    }

    s.logs.unshift(`Round ${s.round}: ${res.commentaryUser} | ${res.commentaryOpp}`);
    s.round++;

    if (s.round > 5) {
      s.finished = true;
      if (s.userGoals > s.oppGoals) playSfx('applause');
    }

    renderShootoutModalHtml();
  }).catch(err => alert(err.message));
}

function hireBackroomStaffAction(role, staffId) {
  if (!staffId) return;
  post('/api/world4/staff/hire', ref({ club: S.selectedClub, role, staffId })).then(res => {
    playSfx('deal');
    playSfx('applause');
    alert(`${svgIcon('tie', 14)}  APPOINTMENT CONFIRMED!\n\n${res.result?.hired?.name} has officially joined as ${res.result?.hired?.role}!`);
    refresh();
  }).catch(err => alert(err.message));
}

function dispatchWorldScoutingMissionAction(region) {
  post('/api/world4/scout/mission', ref({ club: S.selectedClub, region })).then(res => {
    playSfx('deal');

    alert(`${svgIcon('telescope', 14)}  SCOUTING DOSSIERS RETURNED FROM ${region.toUpperCase()}!\n\nDiscovered ${results.length} high-potential targets.`);
    refresh();
  }).catch(err => alert(err.message));
}

let activeTacticalPreset = 'gegenpress';
function selectPresetUI(presetId, p, d, t, w) {
  activeTacticalPreset = presetId;
  const pInput = document.getElementById('tacPressing');
  const dInput = document.getElementById('tacDefLine');
  const tInput = document.getElementById('tacTempo');
  const wInput = document.getElementById('tacWidth');
  if (pInput) { pInput.value = p; document.getElementById('valPressing').innerText = p + '%'; }
  if (dInput) { dInput.value = d; document.getElementById('valDefLine').innerText = d + '%'; }
  if (tInput) { tInput.value = t; document.getElementById('valTempo').innerText = t + '%'; }
  if (wInput) { wInput.value = w; document.getElementById('valWidth').innerText = w + '%'; }
  playSfx('click');
}

function saveTacticalPlaybookUI() {
  const tactics = {
    preset: activeTacticalPreset,
    pressing: Number(document.getElementById('tacPressing')?.value || 85),
    defensiveLine: Number(document.getElementById('tacDefLine')?.value || 75),
    tempo: Number(document.getElementById('tacTempo')?.value || 80),
    width: Number(document.getElementById('tacWidth')?.value || 65)
  };
  post('/api/world4/tactics/update', ref({ club: S.selectedClub, tactics })).then(res => {
    if (res.error) return alert(res.error);
    playSfx('stamp');
    alert(`${svgIcon('clipboard', 14)}  TACTICAL PHILOSOPHY DEPLOYED!\n\nYour squad has drilled the system. Tactical identity updated for upcoming fixtures.`);
    renderSquadSection(document.getElementById('gameContent'));
    if (window.autoSaveManager) window.autoSaveManager.triggerEventSave('tactics', 'Tactical Playbook');
  }).catch(err => alert(err.message));
}

              <span style="font-size:11px;color:var(--text-muted);">${esc(bid.origin)}</span>
            </div>
            <h3 style="font-family:var(--font-display);font-size:22px;color:#fff;margin:10px 0 4px 0;">${esc(bid.consortium)}</h3>
            <div style="font-size:13px;color:var(--accent-gold);font-weight:700;">Proposed Cash Injection War Chest: ₹${bid.cashPurse}M</div>
            <div style="font-size:12px;color:var(--text-muted);margin:8px 0;">Ambition: <b>${esc(bid.ambition)}</b> · Fan Stance: ${esc(bid.fanStance)}</div>
            <div style="display:flex;gap:10px;margin-top:14px;">
              <button class="btn btn-success" onclick="executeTakeoverUI('accept_bid')" style="font-weight:900;padding:10px 20px;">
                ${svgIcon('check', 14)}  ACCEPT TAKEOVER (+₹${bid.cashPurse}M CASH)
              </button>
              <button class="btn btn-danger" onclick="executeTakeoverUI('reject_bid')" style="font-weight:900;padding:10px 20px;">
                ${svgIcon('x', 14)}  REJECT &amp; PROTECT TRADITION
              </button>
            </div>
          </div>
        ` : ''}

        <!-- Multi-Club Satellite Network -->
        <div>
          <div style="font-size:11px;font-weight:800;color:#ef4444;text-transform:uppercase;margin-bottom:10px;">MULTI-CLUB NETWORK (FEEDER SATELLITES)</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:12px;margin-bottom:20px;">
            ${satellites.map(s => `
              <div style="background:rgba(0,0,0,0.3);border:1px solid #22c55e;border-radius:12px;padding:14px;">
                <span class="pill" style="background:#22c55e25;color:#4ade80;font-size:9.5px;font-weight:800;">ACTIVE AFFILIATE</span>
                <h4 style="font-family:var(--font-display);font-size:15px;color:#fff;margin:6px 0 2px 0;">${esc(s.name)} (${esc(s.country)})</h4>
                <div style="font-size:11.5px;color:var(--text-muted);">${esc(s.talentOutput || s.perk || 'Feeder outpost')}</div>
              </div>
            `).join('')}
          </div>

          <div style="font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;">AVAILABLE AFFILIATE CLUBS TO ACQUIRE</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:12px;">
            ${available.map(a => `
              <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;">
                <div>
                  <h4 style="font-family:var(--font-display);font-size:15px;color:#fff;margin:0 0 2px 0;">${esc(a.name)} (${esc(a.country)})</h4>
                  <div style="font-size:11.5px;color:var(--text-muted);">${esc(a.perk)}</div>
                </div>
                <button class="btn btn-primary btn-xs" onclick="buySatelliteClubUI('${a.id}', '${esc(a.name)}', '${esc(a.country)}', ${a.cost}, '${esc(a.perk)}')" style="margin-top:12px;font-weight:800;">
                  ACQUIRE AFFILIATE (₹${a.cost}M)
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  });
}

function executeTakeoverUI(action) {
  post('/api/world4/takeovers/action', ref({ club: S.selectedClub, action })).then(res => {
    if (res.error) return alert(res.error);
    playSfx('stamp');
    playSfx('applause');
    alert(action === 'accept_bid' ? `${svgIcon('alert', 14)}  TAKEOVER COMPLETED!\n\nNew ownership has assumed control with massive treasury injection.` : `${svgIcon('shield', 14)} ️ TAKEOVER REBUFFED!\n\nSupporters celebrate the preservation of club sovereignty.`);
    renderClubFinanceSection(document.getElementById('gameContent'));
  }).catch(err => alert(err.message));
}

function buySatelliteClubUI(satelliteId, name, country, cost, perk) {
  post('/api/world4/takeovers/action', ref({ club: S.selectedClub, action: 'buy_satellite', satelliteId, name, country, cost, perk })).then(res => {
    if (res.error) return alert(res.error);
    playSfx('deal');
    alert(`${svgIcon('globe', 14)}  AFFILIATE ACQUIRED!\n\n${name} joins your multi-club global network.`);
    renderClubFinanceSection(document.getElementById('gameContent'));
  }).catch(err => alert(err.message));
}

// =============================================================
// UI MODULE 8: LIVE IN-MATCH VAR DRAMA & CONTROVERSIAL DECISIONS
// =============================================================
function triggerLiveVarIncident() {
  if (!activeLiveMatch) return;
  clearInterval(activeLiveMatch.timer);
  playSfx('whistle');

  const varIncidents = [
    { title: 'MARGINAL OFFSIDE CHECK', narrative: 'VAR reviewing millimeter shoulder blade line on the goal...', overturned: true, text: 'DECISION: OFFSIDE! Goal disallowed by 0.04m.' },
    { title: 'POSSIBLE PENALTY INCIDENT', narrative: 'Checking trailing leg contact inside the 18-yard box...', overturned: false, text: 'DECISION: PENALTY CONFIRMED! Spot kick awarded.' },
    { title: 'RED CARD SERIOUS FOUL PLAY', narrative: 'Reviewing studs-up lunge near the touchline...', overturned: true, text: 'DECISION: UPGRADED TO STRAIGHT RED CARD!' }
  ];
  const incident = varIncidents[Math.floor(Math.random() * varIncidents.length)];

  const modal = document.createElement('div');
  modal.id = 'varReviewModal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box" style="width:min(520px, 94vw);background:#050a12;border:2px solid #ef4444;box-shadow:0 0 40px rgba(239,68,68,0.4);text-align:center;">
      <div style="font-size:11px;font-weight:900;letter-spacing:2px;color:#ef4444;text-transform:uppercase;">${svgIcon('tv', 14)}  VIDEO ASSISTANT REFEREE (VAR)</div>
      <h2 style="font-family:var(--font-display);font-size:24px;font-weight:900;color:#fff;margin:6px 0 14px 0;">${incident.title}</h2>
      
      <!-- Screen animation -->
      <div style="background:#000;border:2px solid #38bdf8;border-radius:10px;padding:24px;margin-bottom:16px;">
        <div style="font-family:monospace;font-size:14px;color:#38bdf8;margin-bottom:8px;">[PITCHSIDE MONITOR FEED]</div>
        <div style="font-size:13px;color:#fff;margin-bottom:12px;">${incident.narrative}</div>
        <div id="varPendingStatus" style="font-size:18px;font-weight:900;color:var(--accent-gold);animation:pulse 1s infinite;">
          ⏳ REFEREE REVIEWING INCIDENT...
        </div>
      </div>

      <button id="btnVarProceed" class="btn btn-danger" style="display:none;width:100%;font-weight:900;padding:12px;" onclick="closeVarModalUI()">
        CONTINUE MATCH &rarr;
      </button>
    </div>
  `;
  document.body.appendChild(modal);

  setTimeout(() => {
    const statusEl = document.getElementById('varPendingStatus');
    const btnEl = document.getElementById('btnVarProceed');
    if (statusEl) {
      statusEl.innerHTML = `<span style="color:#ef4444;">${incident.text}</span>`;
      statusEl.style.animation = 'none';
      playSfx('whistle');
    }
    if (btnEl) btnEl.style.display = 'block';

    if (activeLiveMatch) {
      activeLiveMatch.events.unshift({
        min: activeLiveMatch.minute || 75,
        icon: `${svgIcon('tv', 14)} `,
        text: `VAR DECISION: ${incident.text}`
      });
    }
  }, 2200);
}

function closeVarModalUI() {
  document.getElementById('varReviewModal')?.remove();
  resumeInteractiveMatch();
}

function resumeInteractiveMatch() {
  if (activeLiveMatch && !activeLiveMatch.finished && !activeLiveMatch.isHalftime) {
    activeLiveMatch.timer = setInterval(() => {
      // Advance tick
      const minutes = [10, 25, 40, 45, 60, 75, 90];
      if (!activeLiveMatch || activeLiveMatch.finished) {
        clearInterval(activeLiveMatch?.timer);
        return;
      }
      activeLiveMatch.step++;
      if (activeLiveMatch.step >= minutes.length) {
        clearInterval(activeLiveMatch.timer);
        activeLiveMatch.finished = true;
        playSfx('whistle');
      } else {
        activeLiveMatch.minute = minutes[activeLiveMatch.step];
      }
      renderGame();
    }, 450);
  }
}


// Initial Boot
if (session?.soloId || session?.roomCode) {
  resumeSession();
} else {
  modeScreen();
}
</script>
