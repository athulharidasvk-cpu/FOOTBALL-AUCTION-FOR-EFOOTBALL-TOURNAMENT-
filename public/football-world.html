<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Football World - Ultimate Club Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d18;
      --bg-card: #0d1728;
      --bg-card-hover: #122038;
      --bg-card-subtle: #0a1322;
      --border-subtle: #1a2c47;
      --border-accent: #2c4a75;
      --pitch-grass: #164024;
      --pitch-stripe: #12361e;
      --pitch-lines: rgba(255, 255, 255, 0.45);
      --accent-neon: #00e599;
      --accent-blue: #2a8bf2;
      --accent-gold: #ffb830;
      --text-main: #f0f6fc;
      --text-muted: #8b9eb5;
      --text-dim: #5c708a;
      --danger: #ff4757;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; outline: none; }
    button { cursor: pointer; border: 0; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    button:active { transform: scale(0.98); }
    
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -10%, #152744 0%, #080f1e 50%, #040810 100%);
    }

    /* Top HUD Navigation */
    .hud-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 17, 31, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .club-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .crest-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.25);
      flex-shrink: 0;
    }
    .club-title {
      display: flex;
      flex-direction: column;
    }
    .club-title h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.15;
    }
    .club-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-div { background: rgba(42, 139, 242, 0.2); color: #6db4ff; border: 1px solid rgba(42, 139, 242, 0.4); }
    .pill-season { background: rgba(0, 229, 153, 0.15); color: var(--accent-neon); border: 1px solid rgba(0, 229, 153, 0.35); }
    .pill-manager { background: rgba(255, 184, 48, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 184, 48, 0.35); }
    
    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 6px 14px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }
    .hud-stat .label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; }
    .hud-stat .value { font-family: var(--font-display); font-size: 17px; font-weight: 800; color: #fff; }
    .hud-stat .value.cash { color: var(--accent-neon); }

    /* Persistent Live Header Budget Tracker Component */
    .hud-budget-tracker {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(14, 30, 56, 0.95), rgba(7, 18, 36, 0.98));
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 0 14px rgba(0, 240, 255, 0.05);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .hud-budget-tracker:hover {
      border-color: var(--accent-neon);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.22);
    }
    .hud-budget-pulse-tag {
      position: absolute;
      top: -12px;
      right: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 2px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      animation: budgetTagBounce 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      white-space: nowrap;
      z-index: 20;
    }
    @keyframes budgetTagBounce {
      0% { transform: translateY(6px) scale(0.85); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .hud-budget-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hud-budget-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .hud-budget-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .hud-budget-lbl {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .hud-budget-val {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }
    .hud-budget-val.cash {
      color: var(--accent-neon);
    }
    .hud-budget-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .hud-budget-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-neon);
      margin-left: 2px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .hud-budget-tracker:hover .hud-budget-btn {
      background: var(--accent-neon);
      color: #030b17;
      border-color: var(--accent-neon);
    }

    .nav-tabs {
      background: #091322;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      padding: 0 24px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 14px 18px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent-blue);
      background: rgba(42, 139, 242, 0.1);
    }

    /* Main Container */
    .game-body {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Tactical Football Pitch */
    .pitch-container {
      background: linear-gradient(135deg, var(--pitch-grass) 0%, var(--pitch-stripe) 100%);
      border: 2px solid #235c34;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.4);
      padding: 30px 20px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pitch-lines {
      position: absolute;
      inset: 12px;
      border: 2px solid var(--pitch-lines);
      border-radius: 12px;
      pointer-events: none;
    }
    .pitch-halfway {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--pitch-lines);
      transform: translateY(-50%);
    }
    .pitch-center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      border: 2px solid var(--pitch-lines);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .pitch-penalty-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-top: none;
      border-radius: 0 0 10px 10px;
    }
    .pitch-penalty-bottom {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    /* Pitch Player Nodes */
    .pitch-line {
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 4px 0;
    }
    .pitch-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .pitch-player:hover { transform: scale(1.1); z-index: 20; }
    .player-jersey-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #112239;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      position: relative;
    }
    .player-ovr-tag {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .ovr-elite { color: #00e599; border-color: #00e599; }
    .ovr-gold { color: #ffb830; border-color: #ffb830; }
    .ovr-silver { color: #a1c4fd; border-color: #a1c4fd; }
    
    .player-name-plate {
      margin-top: 6px;
      background: rgba(6, 13, 24, 0.88);
      backdrop-filter: blur(8px);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .pos-label {
      font-size: 9px;
      font-weight: 800;
      color: #ffca3a;
      text-transform: uppercase;
    }

    /* Cards & Grids */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; }
    .col-5 { grid-column: span 5; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

    .game-card {
      background: linear-gradient(165deg, var(--bg-card) 0%, var(--bg-card-subtle) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .card-header h2 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Buttons */
    button, .btn {
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    button:active, .btn:active {
      transform: scale(0.96) !important;
      filter: brightness(0.92);
    }
    .btn:disabled, button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .btn-loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      top: calc(50% - 8px);
      left: calc(50% - 8px);
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spinFast 0.6s linear infinite;
    }
    @keyframes spinFast {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
    }
    .subnav-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }
    .subnav-pill {
      padding: 8px 18px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .subnav-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .subnav-pill.active {
      color: #fff;
      background: var(--accent-blue);
      box-shadow: 0 2px 10px rgba(18, 130, 232, 0.4);
    }
    .btn-primary {
      background: linear-gradient(135deg, #1282e8 0%, #0b5fb0 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(18, 130, 232, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2293fa 0%, #106fcc 100%);
      box-shadow: 0 6px 20px rgba(18, 130, 232, 0.6);
    }
    .btn-success {
      background: linear-gradient(135deg, #00d287 0%, #00a669 100%);
      color: #032112;
      box-shadow: 0 4px 14px rgba(0, 210, 135, 0.35);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #05ea97 0%, #00bf79 100%);
    }
    .btn-secondary {
      background: #13243c;
      color: #d1e2f7;
      border: 1px solid var(--border-accent);
    }
    .btn-secondary:hover {
      background: #1a3254;
      color: #fff;
    }
    .btn-danger {
      background: rgba(255, 71, 87, 0.15);
      color: #ff6b7a;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 6px 12px; font-size: 11.5px; border-radius: 7px; }

    /* Forms & Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-control {
      background: #091322;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-blue);
      background: #0d1b30;
    }

    /* Roster & Table Styles */
    .roster-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    .roster-table th {
      padding: 8px 14px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
    }
    .roster-row {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      transition: transform 0.15s, background 0.15s;
    }
    .roster-row td {
      padding: 12px 14px;
      font-size: 13px;
    }
    .roster-row td:first-child { border-radius: 10px 0 0 10px; }
    .roster-row td:last-child { border-radius: 0 10px 10px 0; }
    .roster-row:hover {
      background: var(--bg-card-hover);
      transform: translateX(3px);
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pos-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: #172d47;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .pos-badge.att { background: #5c1825; color: #ff7b92; border-color: #ff7b92; }
    .pos-badge.mid { background: #1c4228; color: #73e69b; border-color: #73e69b; }
    .pos-badge.def { background: #183354; color: #76b6ff; border-color: #76b6ff; }
    .pos-badge.gk { background: #4f3b14; color: #ffd166; border-color: #ffd166; }

    /* Jersey Studio */
    .kit-preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle, #162640 0%, #091322 100%);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      width: min(540px, 100%);
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      position: relative;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
      .hud-metrics { display: none; }
      .game-body { padding: 16px; }
    }

    /* ============================================================
       ANIMATIONS & CINEMATIC SUITE
       ============================================================ */
    @keyframes penGlide {
      0% { transform: translate(-20px, -40px) rotate(-15deg); opacity: 0; }
      20% { opacity: 1; }
      85% { transform: translate(140px, 8px) rotate(-5deg); opacity: 1; }
      100% { transform: translate(160px, -15px) rotate(0deg); opacity: 0; }
    }
    @keyframes inkDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes stampDrop {
      0% { transform: scale(3) rotate(-25deg); opacity: 0; }
      70% { transform: scale(0.95) rotate(-5deg); opacity: 1; }
      85% { transform: scale(1.05) rotate(-8deg); }
      100% { transform: scale(1) rotate(-8deg); opacity: 0.95; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -1px); }
    }
    @keyframes flashBurst {
      0% { opacity: 0; }
      15% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(520px) rotate(720deg); opacity: 0; }
    }
    @keyframes searchlightSweep {

<script>
const app = document.getElementById('app');
let S = null;
let session = JSON.parse(localStorage.getItem('fw4') || 'null');
let socket = io();
let currentTab = 'matchday';
let subTabs = {
  matchday: 'fixture',
  squad: 'pitch',
  transfers: 'bids',
  competitions: 'league',
  club: 'stadium'
};
let cachedNextFixture = null;
let activeLiveMatch = null;
let matchSimulationInProgress = false;
let clientSelectedMentality = 'balanced';
let activeYouthRegime = 'finishing';

const esc = s => String(s ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const money = n => Number(n || 0).toLocaleString('en-IN');

function save() { localStorage.setItem('fw4', JSON.stringify(session)); }

// Web Audio synthesizer for atmospheric animations
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSfx(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'pen') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(540, now + 0.12);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'stamp') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.28);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'flash') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.04);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'deal' || type === 'applause') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.1, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.35);
      });
    } else if (type === 'crisis') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.4);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.45);
    }
  } catch(e) {}
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}

function ref(extra = {}) {
  return Object.assign({}, extra,
    session?.roomCode ? { room: session.roomCode } : {},
    session?.soloId ? { soloId: session.soloId } : {},
    session?.managerId ? { managerId: session.managerId } : {}
  );
}

function refresh() {
  const q = session?.roomCode ? `?room=${session.roomCode}` : `?soloId=${session.soloId}`;
  fetch('/api/world4/state' + q)
    .then(r => r.json())
    .then(data => {
      S = data;
      renderGame();
    })
    .catch(err => console.error('[State Error]', err));
}

socket.on('world4:session', d => {
  session = { ...session, ...d };
  save();
  S = d.state;
  renderGame();
});
socket.on('world4:state', d => { S = d; renderGame(); });
socket.on('world4:error', e => alert(e.error || 'World error'));

async function createSoloWorld() {
  const cards = document.querySelectorAll('.game-card');
  cards.forEach(card => {
    if (card.getAttribute('onclick') === 'createSoloWorld()') {
      card.style.pointerEvents = 'none';
      card.style.opacity = '0.7';
    }
  });

  try {
    // Use the HTTP API as the primary path. This is more reliable on mobile
    // and still works when the Socket.IO connection is reconnecting.
    const res = await fetch('/api/world4/solo/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    const data = await res.json();
    if (!res.ok || !data.soloId || !data.state) {
      throw new Error(data.error || 'Unable to create solo career.');
    }

    session = {
      ...(session || {}),
      type: 'solo',
      soloId: data.soloId,
      roomCode: null,
      managerId: null
    };
    save();
    S = data.state;
    renderGame();
  } catch (err) {
    console.error('[Solo Career]', err);

    // Fallback to Socket.IO if the HTTP request failed.
    if (socket && socket.connected) {
      socket.emit('world4:soloCreate');
    } else {
      alert('Solo Career could not start. Please refresh the page and try again.');
    }

    cards.forEach(card => {
      if (card.getAttribute('onclick') === 'createSoloWorld()') {
        card.style.pointerEvents = '';
        card.style.opacity = '';
      }
    });
  }
}

function resumeSession() {
  if (!session?.soloId && !session?.roomCode) return modeScreen();
  refresh();
}

function applyPresetClub(indexStr) {
  if (indexStr === '' || !AUTHENTIC_PRESETS[+indexStr]) return;
  const p = AUTHENTIC_PRESETS[+indexStr];
  cinematicState.name = p.name;
  cinematicState.country = p.country;
  cinematicState.division = 3; // Enforce Division 3 entry point for all clubs!
  cinematicState.home = p.home;
  cinematicState.away = p.away;
  cinematicState.third = p.third;
  cinematicState.crest = p.crest;
  cinematicState.pattern = p.pattern;
  renderClubIdentityStudio();
}

function liveUpdateDeedJersey() {
  const container = document.getElementById('deedJerseyContainer');
  const crestBadge = document.getElementById('deedCrestBadge');
  const namePreview = document.getElementById('deedClubNamePreview');

  const name = document.getElementById('newClubName')?.value || cinematicState.name;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;

  if (crestBadge) crestBadge.innerHTML = renderCrest(cinematicState.crest, 36);
  if (namePreview) namePreview.innerText = name;

  if (container) {
    container.innerHTML = generateJerseySVG({
      home,
      away,
      collar: away,
      pattern
    }, name, 'EMIRATES');
  }
}

function submitNewClubFromStudio() {
  const name = document.getElementById('newClubName')?.value.trim() || cinematicState.name;
  if (!name) return alert('Please enter a club name');
  const country = document.getElementById('newCountry')?.value || cinematicState.country;
  const division = 3; // Enforce Division 3 starting tier!
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const third = document.getElementById('newThirdColor')?.value || cinematicState.third;

  post('/api/world4/club/create', ref({
    name,
    country,
    division,
    pattern,
    home,
    away,
    third,
    crest: cinematicState.crest,
    quality: 75
  })).then(data => {
    playSfx('applause');
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function switchTab(t, sub = null) {
  if (['pitch', 'squad'].includes(t)) {
    currentTab = 'squad';
    subTabs.squad = t === 'pitch' ? 'pitch' : 'roster';
  } else if (['transfers', 'scouting'].includes(t)) {
    currentTab = 'transfers';
    subTabs.transfers = t === 'scouting' ? 'scout' : (sub || 'bids');
  } else if (['league', 'tournament', 'awards'].includes(t)) {
    currentTab = 'competitions';
    subTabs.competitions = t === 'tournament' ? 'global_cup' : (t === 'awards' ? 'awards' : 'league');
  } else if (['stadium', 'managers', 'kit'].includes(t)) {
    currentTab = 'club';
    subTabs.club = t === 'managers' ? 'manager' : (t === 'kit' ? 'kit' : 'stadium');
  } else {
    currentTab = t;
  }
  if (sub) {
    if (currentTab === 'matchday') subTabs.matchday = sub;
    if (currentTab === 'squad') subTabs.squad = sub;
    if (currentTab === 'transfers') subTabs.transfers = sub;
    if (currentTab === 'competitions') subTabs.competitions = sub;
    if (currentTab === 'club') subTabs.club = sub;
  }
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  renderGame();
}

function renderTabContent() {
  const container = document.getElementById('gameContent');
  if (!container) return;

  switch (currentTab) {
    case 'matchday': return renderMatchday(container);
    case 'home': return renderDashboard(container);
    case 'squad': return renderSquadSection(container);
    case 'transfers': return renderTransfersSection(container);
    case 'competitions': return renderCompetitionsSection(container);
    case 'club': return renderClubFinanceSection(container);
    // Legacy direct fallbacks
    case 'pitch': return renderTacticalPitch(container);
    case 'scouting': return renderScoutingAndAcademy(container);
    case 'managers': return renderManagerMarket(container);
    case 'stadium': return renderStadiumEconomy(container);
    case 'kit': return renderKitStudio(container);
    case 'league': return renderLeagueStandings(container);
    case 'news': return renderNewsFeed(container);
    case 'awards': return renderAwardsGala(container);
    case 'tournament': return renderGlobalTournament(container);
    default: return renderMatchday(container);
  }
}

// -------------------------------------------------------------
function computeClientNextFixture(s) {
  if (cachedNextFixture && cachedNextFixture.matchday === ((s?.matchday || 0) + 1)) {
    return cachedNextFixture;
  }
  const user = s?.clubs?.find(c => c.name === s?.selectedClub);
  if (!user) return null;
  const matchday = (s.matchday || 0) + 1;

  let isGlobalCup = false;
  let gtOpponent = null;
  let gtStage = '';

  if (s.globalTournament && s.globalTournament.status !== 'completed' && matchday % 3 === 0) {
    const gt = s.globalTournament;
    if (gt.status === 'groups') {
      ['A', 'B', 'C', 'D'].forEach(k => {
        if (gt.groups[k]?.standings?.some(x => x.clubName === user.name)) {
          isGlobalCup = true;
          gtStage = `Group ${k} · Matchday ${gt.currentRound || 1}`;
          const oppClub = gt.groups[k].standings.find(x => x.clubName !== user.name);
          if (oppClub) gtOpponent = s.clubs.find(c => c.name === oppClub.clubName);
        }
      });
    } else if (gt.status === 'knockout') {
      const ko = gt.knockout;
      const koMatch = ko.quarterFinals?.find(m => !m.completed && (m.home === user.name || m.away === user.name))
        || ko.semiFinals?.find(m => !m.completed && (m.home === user.name || m.away === user.name))
        || (ko.final && !ko.final.completed && (ko.final.home === user.name || ko.final.away === user.name) ? ko.final : null);
      if (koMatch) {
        isGlobalCup = true;
        gtStage = 'Knockout Elimination';
        const oppName = koMatch.home === user.name ? koMatch.away : koMatch.home;
        gtOpponent = s.clubs.find(c => c.name === oppName);
      }
    }
  }

  let compType = 'league';
  let compLabel = 'REGULAR LEAGUE MATCH';
  let compBadgeColor = '#38bdf8';
  let compIcon = '🛡️';
  let compStage = `Division ${user.division} · Matchday ${Math.ceil(matchday * 0.75)}`;
  let opp = null;
  let stakes = '+3 Points towards Division Title & Promotion';
  let winBonus = 0.5;

  if (isGlobalCup && gtOpponent) {
    compType = 'global_cup';
    compLabel = 'GLOBAL CLUB WORLD CUP';
    compBadgeColor = '#f59e0b';
    compIcon = '🌍';
    compStage = gtStage || 'Tournament Matchday';
    opp = gtOpponent;
    winBonus = 12.5;
    stakes = `Global Cup Group Progression · ₹${winBonus}M Bonus`;
  } else if ((user.division === 1 || (user.reputation || 60) >= 80) && (matchday % 4 === 0)) {
    compType = 'champions_league';
    compLabel = 'UEFA CHAMPIONS LEAGUE';
    compBadgeColor = '#818cf8';
    compIcon = '⭐';
    compStage = `Continental Fixture · MD ${Math.ceil(matchday / 4)}`;
    winBonus = 8.0;
    stakes = 'European Prestige & Continental Progression';
    const foreignPool = s.clubs.filter(c => c.name !== user.name && c.country !== user.country && c.division === 1);
    opp = foreignPool[matchday % (foreignPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else if (user.division === 2 && (matchday % 4 === 0)) {
    compType = 'conference_league';
    compLabel = 'UEFA CONFERENCE LEAGUE';
    compBadgeColor = '#10b981';
    compIcon = '🏅';
    compStage = `Knockout Playoff · Matchday ${matchday}`;
    winBonus = 4.0;
    stakes = 'Continental Conference Advancement';
    const foreignPool = s.clubs.filter(c => c.name !== user.name && c.country !== user.country && c.division <= 2);
    opp = foreignPool[matchday % (foreignPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else if (matchday % 4 === 0) {
    compType = 'domestic_cup';
    compLabel = 'DOMESTIC FA CUP';
    compBadgeColor = '#ef4444';
    compIcon = '🏆';
    compStage = matchday === 4 ? 'Round of 16' : matchday === 8 ? 'Quarter-Final' : matchday === 12 ? 'Semi-Final' : 'Cup Final';
    winBonus = 2.0;
    stakes = 'Knockout Cup Tie · Single-Leg Elimination';
    const cupPool = s.clubs.filter(c => c.name !== user.name && c.country === user.country);
    opp = cupPool[matchday % (cupPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else {
    const leagueClubs = s.clubs.filter(c => c.country === user.country && c.division === user.division && c.name !== user.name);
    const rival = leagueClubs.find(c => c.name === user.rivalName);
    if (rival && (matchday === 3 || matchday === 7 || matchday === 11)) {
      opp = rival;
      stakes = `🔥 HEATED LOCAL DERBY vs ${rival.name} (+3 Pts & Fan Pride)`;
    } else {
      opp = leagueClubs[matchday % (leagueClubs.length || 1)] || s.clubs.find(c => c.name !== user.name);
    }
  }

  if (!opp) opp = s.clubs.find(c => c.name !== user.name) || { name: 'Rival FC', country: user.country, division: user.division, reputation: 60 };

  const isHome = matchday % 2 !== 0;
  const oppPlayers = s.market.filter(p => p.ownerClub === opp.name);
  const oppOvr = oppPlayers.length ? Math.round(oppPlayers.reduce((a, b) => a + b.rating, 0) / oppPlayers.length) : (opp.reputation || 60);
  const oppKeyPlayer = oppPlayers.sort((a, b) => b.rating - a.rating)[0];

  const userPlayers = s.market.filter(p => p.ownerClub === user.name);
  const userOvr = userPlayers.length ? Math.round(userPlayers.reduce((a, b) => a + b.rating, 0) / userPlayers.length) : 64;

  return {
    matchday,
    compType,
    compLabel,
    compBadgeColor,
    compIcon,
    compStage,
    fullTitle: `${compLabel} · ${compStage}`,
    isHome,
    stadium: isHome ? (user.stadium?.name || `${user.name} Ground`) : (opp.stadium?.name || `${opp.name} Arena`),
    homeTeam: isHome ? user.name : opp.name,
    awayTeam: isHome ? opp.name : user.name,
    userTeam: {
      name: user.name,
      division: user.division,
      rating: userOvr,
      crest: user.crest || 'crest_lion',
      jersey: user.jersey || { home: '#0f172a' }
    },
    opponent: {
      name: opp.name,
      country: opp.country,
      division: opp.division,
      reputation: opp.reputation || 60,
      crest: opp.crest || 'crest_lion',
      jersey: opp.jersey || { home: '#1e293b' },
      rating: oppOvr,
      keyPlayer: oppKeyPlayer ? { name: oppKeyPlayer.name, rating: oppKeyPlayer.rating, position: oppKeyPlayer.position } : null
    },
    stakes,
    winBonus
  };
}

function startInteractiveLiveMatch(m) {
  const isHome = m.home === S.selectedClub;

  activeLiveMatch = {
    result: m,
    minute: 0,
    currentHomeGoals: 0,
    currentAwayGoals: 0,
    events: [],
    ballX: 50,
    ballY: 50,
    possession: { home: 52, away: 48 },
    shots: { home: 1, away: 1 },
    timer: null,
    finished: false,
    mentality: clientSelectedMentality || 'balanced',
    isHalftime: false,
    halftimeTalkGiven: false,
    halftimeTalk: null,
    step: 0
  };

  currentTab = 'matchday';
  renderGame();

  resumeInteractiveMatch();
}

function resumeInteractiveMatch() {
  if (!activeLiveMatch) return;
  const m = activeLiveMatch.result;
  const minutes = [15, 30, 45, 60, 75, 90];

  activeLiveMatch.timer = setInterval(() => {
    if (!activeLiveMatch) {
      clearInterval(activeLiveMatch?.timer);
      return;
    }
    const step = activeLiveMatch.step;
    const min = minutes[step];
    activeLiveMatch.minute = min;

    activeLiveMatch.ballX = 25 + Math.floor(Math.random() * 50);
    activeLiveMatch.ballY = 25 + Math.floor(Math.random() * 50);
    activeLiveMatch.shots.home += Math.random() > 0.4 ? 1 : 0;
    activeLiveMatch.shots.away += Math.random() > 0.4 ? 1 : 0;

    // Halftime Pause at Minute 45
    if (min === 45 && !activeLiveMatch.halftimeTalkGiven) {
      clearInterval(activeLiveMatch.timer);
      activeLiveMatch.isHalftime = true;
      playSfx('whistle');
      activeLiveMatch.events.unshift({
        min: 45,
        icon: '⏸️',
        text: `HALFTIME: The referee sounds the whistle for the interval. Both teams head to the dressing room.`
      });
      renderGame();
      return;
    }

    if (min >= 30 && activeLiveMatch.currentHomeGoals < m.homeGoals && Math.random() > 0.25) {
      activeLiveMatch.currentHomeGoals++;
      activeLiveMatch.events.unshift({
        min,
        icon: '⚽',
        text: `GOAL! ${m.home} hits the target with power!`
      });
      playSfx('goal');
    } else if (min >= 30 && activeLiveMatch.currentAwayGoals < m.awayGoals && Math.random() > 0.25) {
      activeLiveMatch.currentAwayGoals++;
      activeLiveMatch.events.unshift({
        min,
        icon: '⚽',
        text: `GOAL! ${m.away} breaks through the defensive line!`
      });
      playSfx('goal');
    } else {
      const commentary = [
        `High pressing in midfield, maintaining tactical shape.`,
        `Fierce strike on goal! Excellent save by the goalkeeper.`,
        `Dangerous cross into the box cleared by defense.`,
        `Clean interception and quick counter-attack launched.`,
        `Solid midfield duel won, recycling possession.`
      ];
      activeLiveMatch.events.unshift({
        min,
        icon: '⚡',
        text: commentary[step % commentary.length]
      });
    }

    activeLiveMatch.step++;
    if (activeLiveMatch.step >= minutes.length) {
      activeLiveMatch.currentHomeGoals = m.homeGoals;
      activeLiveMatch.currentAwayGoals = m.awayGoals;
      clearInterval(activeLiveMatch.timer);
      activeLiveMatch.finished = true;
      playSfx('whistle');
    }

    const scoreBox = document.getElementById('liveScoreBox');
    const clockBox = document.getElementById('liveClockBox');
    const ballInd = document.getElementById('liveBallIndicator');
    const feedBox = document.getElementById('liveEventsFeed');
    if (scoreBox && clockBox && ballInd && feedBox && !activeLiveMatch.isHalftime) {
      scoreBox.innerHTML = `${activeLiveMatch.currentHomeGoals} - ${activeLiveMatch.currentAwayGoals}`;
      clockBox.innerHTML = `${activeLiveMatch.minute}' ${activeLiveMatch.finished ? '(FULL TIME)' : ''}`;
      ballInd.style.left = `${activeLiveMatch.ballX}%`;
      ballInd.style.top = `${activeLiveMatch.ballY}%`;
      feedBox.innerHTML = activeLiveMatch.events.map(e => `
        <div class="live-event-pill">
          <b style="color:var(--accent-gold);">${e.min}'</b> <span>${e.icon}</span> <span>${esc(e.text)}</span>
        </div>
      `).join('');
      if (activeLiveMatch.finished) {
        renderGame();
      }
    } else {
      renderGame();
    }
  }, 350);
}

function deliverHalftimeTalk(talkType) {
  if (!activeLiveMatch) return;
  activeLiveMatch.halftimeTalk = talkType;
  activeLiveMatch.halftimeTalkGiven = true;
  activeLiveMatch.isHalftime = false;
  activeLiveMatch.step++; // advance past 45' to 60'

  let talkText = '';
  if (talkType === 'demand_more') {
    talkText = '🔥 "Show our true grit! Attack with courage and fight for every inch!"';
  } else if (talkType === 'tighten_defense') {
    talkText = '🛡️ "Stay compact, tighten the backline and eliminate careless errors!"';
  } else {
    talkText = '⚡ "Suffocate them with aggressive high-pressing and fast transitions!"';
  }

  activeLiveMatch.events.unshift({
    min: 45,
    icon: '💬',
    text: `HALFTIME TALK: Manager rallied squad: ${talkText} The players re-enter the pitch fired up!`
  });
  playSfx('applause');
  renderGame();
  resumeInteractiveMatch();
}

function setLiveMatchMentality(newMentality) {
  if (!activeLiveMatch) return;
  activeLiveMatch.mentality = newMentality;
  clientSelectedMentality = newMentality;
  const labels = {
    park_bus: '🛡️ PARK THE BUS (Ultra-Defensive)',
    balanced: '⚖️ BALANCED SHAPE',
    counter: '⚡ FAST COUNTER-ATTACK',
    attacking: '🔥 ALL-OUT ATTACK'
  };
  activeLiveMatch.events.unshift({
    min: activeLiveMatch.minute || 1,
    icon: '📋',
    text: `TACTICAL SHIFT: Manager commanded squad to switch to ${labels[newMentality] || newMentality}!`
  });
  playSfx('deal');

  document.querySelectorAll('.tactical-mentality-bar .mentality-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  const activeBtn = document.querySelector(`.tactical-mentality-bar .mentality-btn.${newMentality}`) ||
                    document.querySelector(`.tactical-mentality-bar .mentality-btn[onclick*="${newMentality}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const feedBox = document.getElementById('liveEventsFeed');
  if (feedBox) {
    feedBox.innerHTML = activeLiveMatch.events.map(e => `
      <div class="live-event-pill">
        <b style="color:var(--accent-gold);">${e.min}'</b> <span>${e.icon}</span> <span>${esc(e.text)}</span>
      </div>
    `).join('');
  }
}

function executeLiveMatchSub(pid) {
  const p = S.market.find(x => x.id === pid);
  const modal = document.getElementById('quickSubModal');
  if (modal) modal.remove();
  if (!p || !activeLiveMatch) return;

  activeLiveMatch.events.unshift({
    min: activeLiveMatch.minute || 60,
    icon: '🔄',
    text: `SUBSTITUTION: ${esc(p.name)} (${p.position} · ${p.rating} OVR) enters the pitch with fresh legs and high energy!`
  });
  playSfx('whistle');
  renderGame();
}

function finishInteractiveMatch() {
  if (!activeLiveMatch) return;
  if (activeLiveMatch.timer) clearInterval(activeLiveMatch.timer);
  const m = activeLiveMatch.result;
  activeLiveMatch = null;
  openMatchModal(m);
  renderGame();
}

function conductSquadBonding() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;
  if ((c.cash || 0) < 0.15) return alert('Insufficient treasury funds! Retreat costs ₹0.15M.');

  c.cash = Math.round((c.cash - 0.15) * 100) / 100;
  if (S.chemistry) {
    S.chemistry.chemistryScore = Math.min(100, (S.chemistry.chemistryScore || 75) + 6);
    S.chemistry.harmonyScore = Math.min(100, (S.chemistry.harmonyScore || 80) + 8);
    S.chemistry.dressingRoomMorale = Math.min(100, (S.chemistry.dressingRoomMorale || 85) + 6);
  }
  playSfx('applause');
  triggerLiveBudgetUpdate('🤝 Squad Bonding Retreat Held (-₹0.15M)', 'transfer');
  alert('🤝 TEAM RETREAT COMPLETED!\n\nThe squad bonded over an off-site tactical retreat. Dressing room morale increased by +8% and pitch synergy improved by +6%!');
  renderSquadSection(document.getElementById('gameContent'));
}

// -------------------------------------------------------------
// JOB OFFER ACTIONS: ACCEPT, DECLINE, NEGOTIATE
// -------------------------------------------------------------
function acceptJobOffer(jobId, targetName, type) {
  const isNat = type === 'national';
  const promptText = isNat 
    ? `Accept the prestigious appointment as Head Coach of ${targetName}? You will lead them into international tournaments alongside your club duties!`
    : `Are you sure you want to conclude your reign at ${S.selectedClub} and accept managerial appointment at ${targetName}?`;

  if (!confirm(promptText)) return;

  post('/api/world4/job/accept', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    playSfx('applause');
    playSfx('deal');
    alert(`🎉 CONTRACT SIGNED!\n\n${data.message || `Welcome to ${targetName}!`}`);
    renderGame();
  }).catch(err => {
    alert(err.message || 'Failed to accept job offer.');
  });
}

function declineJobOffer(jobId) {
  post('/api/world4/job/decline', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    playSfx('whistle');
    alert(`🤝 Total Loyalty Pledged!\n\n${data.message}`);
    const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
    if (subContainer) renderTrophyCabinetAndCareer(subContainer);
  }).catch(err => {
    alert(err.message || 'Failed to decline offer.');
  });
}

function negotiateJobOffer(jobId) {
  post('/api/world4/job/negotiate', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    if (data.success) {
      playSfx('deal');
      alert(`💼 TERMS ACCEPTED!\n\n${data.message}`);
    } else {
      alert(`💼 COUNTER-TERMS DECLINED\n\n${data.message}`);
    }
    const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
    if (subContainer) renderTrophyCabinetAndCareer(subContainer);
  }).catch(err => {
    alert(err.message || 'Negotiation failed.');
  });
}

function renderTacticalPitch(container) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const myPlayers = S.market.filter(p => p.ownerClub === c.name);

  // Group players by position
  const gks = myPlayers.filter(p => p.position === 'GK');
  const defs = myPlayers.filter(p => ['CB', 'LB', 'RB'].includes(p.position));
  const mids = myPlayers.filter(p => ['CMF', 'DMF', 'AMF'].includes(p.position));
  const fwds = myPlayers.filter(p => ['CF', 'LWF', 'RWF'].includes(p.position));

  // Build starting XI (4-3-3 default)
  const startingGK = gks[0] || myPlayers[0];
  const startingDef = defs.slice(0, 4);
  const startingMid = mids.slice(0, 3);
  const startingFwd = fwds.slice(0, 3);

  // Fillers if positions are scarce
  const bench = myPlayers.filter(p => ![startingGK?.id, ...startingDef.map(d=>d.id), ...startingMid.map(m=>m.id), ...startingFwd.map(f=>f.id)].includes(p.id));

  const makePlayerNode = (p, fallbackPos) => {
    if (!p) return `<div class="pitch-player"><div class="player-jersey-icon" style="background:#222;color:#666;">-</div><div class="player-name-plate">Vacant</div></div>`;
    const ovrClass = p.rating >= 85 ? 'ovr-elite' : p.rating >= 80 ? 'ovr-gold' : 'ovr-silver';
    return `
      <div class="pitch-player" onclick="viewPlayerCard('${p.id}')">
        <div class="player-jersey-icon" style="background:${c.jersey?.home || '#0b2545'};">
          ${p.position || fallbackPos}
          <span class="player-ovr-tag ${ovrClass}">${p.rating}</span>
        </div>
        <div class="player-name-plate">
          <span class="pos-label">${p.position || fallbackPos}</span>
          ${esc(p.name.split(' ').pop())}
        </div>
      </div>
    `;
  };

  const chem = S.chemistry || {
    chemistryScore: 78,
    harmonyScore: 82,
    chemistryTier: 'High',
    dressingRoomMorale: 85,
    tacticalFamiliarity: 80,
    boosts: { passAccuracyBonus: '+6%', defensiveSolidity: '+5%', moraleModifier: '+4%' }
  };

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div class="card-kicker">TACTICAL BOARD · FORMATION 4-3-3</div>
        <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;">First Team Starting XI</h2>
      </div>
      <div style="display:flex;gap:10px;">
        <span class="pill pill-div">Squad: ${myPlayers.length} Players</span>
        <button class="btn btn-secondary btn-sm" onclick="switchTab('squad')">MANAGE FULL ROSTER &rarr;</button>
      </div>
    </div>

    <!-- Squad Chemistry Mini HUD Strip -->

function refreshTalksUI(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!p) return;

  const minFee = Math.round((p.askingPrice || 10) * 0.9);
  const minSal = Math.round((p.contract?.salary || 2) * 1.05);

  let prob = 50;
  if (activeTalksState.fee >= p.askingPrice * 1.25) prob += 35;
  else if (activeTalksState.fee >= p.askingPrice) prob += 20;
  else if (activeTalksState.fee < minFee) prob -= 40;

  if (activeTalksState.salary >= minSal * 1.3) prob += 25;
  else if (activeTalksState.salary >= minSal) prob += 15;
  else if (activeTalksState.salary < minSal) prob -= 30;

  if (activeTalksState.dealType === 'loan_to_buy') prob -= 5;
  if (activeTalksState.sellOnClause >= 15) prob += 8;

  prob = Math.max(5, Math.min(98, prob));

  const fill = document.getElementById('talksGaugeFill');
  const pct = document.getElementById('talksGaugePct');
  const bubble = document.getElementById('talksAgentBubble');
  const feeDsp = document.getElementById('talksFeeDisplay');
  const salDsp = document.getElementById('talksSalDisplay');

  if (feeDsp) feeDsp.textContent = `₹${money(activeTalksState.fee)}M`;
  if (salDsp) salDsp.textContent = `₹${money(activeTalksState.salary)}M / yr`;

  if (fill && pct) {
    fill.style.width = prob + '%';
    pct.textContent = prob + '%';

    if (prob >= 75) {
      fill.style.background = 'linear-gradient(90deg, #f59e0b, #00f0ff)';
      pct.style.color = '#00f0ff';
      if (bubble) bubble.innerHTML = `Agent: "Now we're talking business, Chairman! This lucrative valuation matches ${p.name}'s pedigree. We are ready to put pen to paper!"`;
    } else if (prob >= 45) {
      fill.style.background = 'linear-gradient(90deg, #ff4757, #f59e0b)';
      pct.style.color = '#f59e0b';
      if (bubble) bubble.innerHTML = `Agent: "The offer is respectable, but ${p.name} has competing suitors. Sweeten the terms slightly and we're done."`;
    } else {
      fill.style.background = '#ff4757';
      pct.style.color = '#ff4757';
      if (bubble) bubble.innerHTML = `Agent: "Are you serious, sir? This bid is below our client's market valuation. Increase your bid or we walk away."`;
    }
  }

  // Live Budget & FFP Health Forecast calculation
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (c) {
    const b = calculateClientBudget(c);
    const remCash = Math.max(0, Math.round((c.cash - activeTalksState.fee) * 10) / 10);
    const remWarChest = Math.max(0, Math.round(((c.cash * 0.6) - activeTalksState.fee) * 10) / 10);
    const newAnnualWage = Math.round((b.wageBillAnnual + activeTalksState.salary) * 10) / 10;
    const newPerMatchWage = Math.round((newAnnualWage / 24) * 100) / 100;
    const newCashflow = Math.round((b.projectedRevPerMatch - newPerMatchWage) * 100) / 100;
    const newRatio = b.projectedTurnoverAnnual > 0 ? Math.round((newAnnualWage / b.projectedTurnoverAnnual) * 100) : 55;

    const elCash = document.getElementById('talksProjCash');
    const elChest = document.getElementById('talksProjWarChest');
    const elFlow = document.getElementById('talksProjCashflow');
    const elRatio = document.getElementById('talksProjFfpRatio');
    const elFfpTag = document.getElementById('talksFfpHealthTag');

    if (elCash) {
      elCash.textContent = `₹${money(remCash)}M`;
      elCash.style.color = remCash <= 1.0 ? '#ff4757' : 'var(--accent-neon)';
    }
    if (elChest) {
      elChest.textContent = `₹${money(remWarChest)}M`;
      elChest.style.color = remWarChest === 0 ? '#ff4757' : 'var(--accent-gold)';
    }
    if (elFlow) {
      elFlow.textContent = `${newCashflow>=0?'+':''}₹${money(newCashflow)}M/m`;
      elFlow.style.color = newCashflow < 0 ? '#ff4757' : 'var(--accent-neon)';
    }
    if (elRatio) {
      elRatio.textContent = `${newRatio}%`;
      elRatio.style.color = newRatio > 70 ? '#ff4757' : 'var(--accent-gold)';
    }
    if (elFfpTag) {
      if (newRatio > 85 || remCash < 1.0) {
        elFfpTag.textContent = '● FFP RISK';
        elFfpTag.style.color = '#ef4444';
      } else if (newRatio > 70) {
        elFfpTag.textContent = '● MONITORED';
        elFfpTag.style.color = '#eab308';
      } else {
        elFfpTag.textContent = '● HEALTHY';
        elFfpTag.style.color = '#00e599';
      }
    }
  }
}

function finalizeTransferNegotiation(pid) {
  const p = S.market.find(x => x.id === pid);
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!p || !c) return;

  if (c.cash < activeTalksState.fee) {
    return alert(`Insufficient treasury funds! Club has ₹${money(c.cash)}M, but transfer fee requires ₹${money(activeTalksState.fee)}M.`);
  }

  const actionBox = document.getElementById('talksActionBox');
  if (actionBox) {
    actionBox.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;background:rgba(0,240,255,0.1);border:1px solid var(--accent-neon);border-radius:10px;color:var(--accent-neon);font-weight:700;">
        ✍️ Submitting formal bid & negotiating terms with representatives...
      </div>
    `;
  }

  post('/api/world4/transfer/negotiate', ref({
    club: S.selectedClub,
    playerId: pid,
    offer: {
      fee: activeTalksState.fee,
      salary: activeTalksState.salary,
      years: activeTalksState.years,
      dealType: activeTalksState.dealType,
      releaseClause: activeTalksState.releaseClause,
      sellOnClause: activeTalksState.sellOnClause,
      bonusAddons: activeTalksState.bonusAddons
    }
  })).then(res => {
    const data = res.result;
    if (res.state) S = res.state;

    if (data.status === 'accepted') {
      playSfx('flash');
      playSfx('deal');
      playSfx('applause');

      const flash = document.createElement('div');
      flash.className = 'camera-flash-overlay active';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 600);

      const cele = document.getElementById('talksCelebration');
      const det = document.getElementById('talksSuccessDetail');
      const sFee = document.getElementById('sealedFeeVal');
      const sSal = document.getElementById('sealedSalVal');

      if (sFee) sFee.textContent = `₹${money(data.fee)}M`;
      if (sSal) sSal.textContent = `₹${money(data.salary)}M/yr`;
      if (det) det.textContent = data.message || `${p.name} has officially signed for ${c.name} on a ${data.years}-year contract!`;
      if (cele) cele.style.display = 'flex';
      triggerLiveBudgetUpdate(`✍️ Signed: ${p.name} (-₹${money(data.fee)}M | ₹${money(data.salary)}M/yr)`, 'transfer');
      return;
    }

    if (data.status === 'countered') {
      playSfx('crisis');
      const bubble = document.getElementById('talksAgentBubble');
      if (bubble) {
        bubble.innerHTML = `
          <div style="color:#ffb86c;font-weight:800;margin-bottom:4px;">🚨 SELLING CLUB & AGENT COUNTER-BID:</div>
          <div>${esc(data.message)}</div>
        `;
      }

      if (actionBox) {
        actionBox.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px;width:100%;">
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" style="flex:1;font-weight:800;background:linear-gradient(90deg,#00b09b,#96c93d);" onclick="acceptCounterOffer('${pid}', ${data.counterFee}, ${data.counterSalary})">
                🤝 ACCEPT COUNTER (₹${data.counterFee}M Fee · ₹${data.counterSalary}M/yr)
              </button>
              <button class="btn btn-warning" style="flex:1;font-weight:800;" onclick="compromiseOffer('${pid}', ${data.counterFee}, ${data.counterSalary})">
                ⚖️ COMPROMISE (₹${Math.round((activeTalksState.fee + data.counterFee)/2)}M)
              </button>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('transferTalksModal').remove()">
              🚪 REJECT & WALK AWAY
            </button>
          </div>
        `;
      }
      return;
    }

    if (data.status === 'hijacked') {
      playSfx('crisis');
      const bubble = document.getElementById('talksAgentBubble');
      if (bubble) {
        bubble.innerHTML = `
          <div style="color:#ff4757;font-weight:900;font-size:13.5px;margin-bottom:6px;">🚨 11TH-HOUR TRANSFER HIJACK ALERT!</div>
          <div style="color:#fff;line-height:1.5;">${esc(data.message)}</div>
        `;
      }
      if (actionBox) {
        actionBox.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:10px;width:100%;">
            <div style="background:rgba(255,71,87,0.15);border:1px solid #ff4757;border-radius:10px;padding:12px;color:#fca5a5;font-size:12.5px;">
              ⚡ <b>Hijacking Competitor:</b> ${esc(data.hijacker)} swooped in with an aggressive bid of <b>₹${data.hijackFee}M</b> fee and <b>₹${data.hijackSalary}M/yr</b> salary!
            </div>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-danger" style="flex:1.2;font-weight:900;background:linear-gradient(90deg,#ff416c,#ff4b2b);padding:10px;" onclick="counterHijackOffer('${pid}', ${data.hijackFee}, ${data.hijackSalary}, '${esc(data.hijacker)}')">
                💥 OUTBID & THWART HIJACK (₹${data.hijackFee + 1}M Fee · ₹${data.hijackSalary}M/yr)
              </button>
              <button class="btn btn-secondary" style="flex:0.8;" onclick="document.getElementById('transferTalksModal').remove(); refresh();">
                🏳️ CONCEDE TARGET
              </button>
            </div>
          </div>
        `;
      }
      return;
    }

    if (data.status === 'refused_prestige' || data.status === 'refused_quota' || data.status === 'refused_untouchable' || data.status === 'rejected_division') {
      playSfx('crisis');
      const bubble = document.getElementById('talksAgentBubble');
      if (bubble) {
        bubble.innerHTML = `
          <div style="color:#ff4757;font-weight:900;margin-bottom:4px;">🛡️ SELLING CLUB SQUAD LOCKDOWN:</div>
          <div style="color:#fca5a5;line-height:1.5;">${esc(data.message)}</div>
        `;
      }
      if (actionBox) {
        actionBox.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px;width:100%;">
            <button class="btn btn-secondary" style="width:100%;" onclick="document.getElementById('transferTalksModal').remove(); refresh();">
              CLOSE NEGOTIATION
            </button>
          </div>
        `;
      }
      return;
    }

    playSfx('crisis');
    alert(data.message || 'Offer rejected.');
    document.getElementById('transferTalksModal')?.remove();
    refresh();
  }).catch(err => {
    alert(`Transfer error: ${err.message}`);
    document.getElementById('transferTalksModal')?.remove();
  });
}

function counterHijackOffer(pid, hijackFee, hijackSalary, hijacker) {
  post('/api/world4/transfer/negotiate', ref({
    club: S.selectedClub,
    playerId: pid,
    offer: {
      fee: hijackFee + 1,
      salary: hijackSalary,
      years: activeTalksState.years,
      isCounterHijack: true,
      hijacker: hijacker
    }
  })).then(res => {
    const data = res.result;
    if (res.state) S = res.state;
    if (data.status === 'accepted') {
      playSfx('flash');
      playSfx('deal');
      playSfx('applause');
      triggerLiveBudgetUpdate(`🛡️ Hijack Thwarted: Deal Signed!`, 'transfer');
      alert(`Transfer Hijack Thwarted! ${data.message}`);
      document.getElementById('transferTalksModal')?.remove();
      refresh();
    } else {
      alert(data.message || 'Counter-bid was unsuccessful.');
      document.getElementById('transferTalksModal')?.remove();
      refresh();
    }
  }).catch(err => alert(err.message));
}

function acceptCounterOffer(pid, fee, salary) {
  activeTalksState.fee = fee;
  activeTalksState.salary = salary;
  finalizeTransferNegotiation(pid);
}

function compromiseOffer(pid, counterFee, counterSalary) {
  activeTalksState.fee = Math.round((activeTalksState.fee + counterFee) / 2);
  activeTalksState.salary = Math.round((activeTalksState.salary + counterSalary) / 2);
  refreshTalksUI(pid);
  finalizeTransferNegotiation(pid);
}

function makeTransferBid(pid, defaultFee) {
  openPlayerTransferTalks(pid);
}

function setScoutFocus(focus) {
  activeScoutFocus = focus;
  ['wonderkids', 'bargains', 'attackers', 'midfielders', 'defenders', 'all'].forEach(f => {
    document.getElementById('scoutFocus_' + f)?.classList.remove('btn-primary');
  });
  document.getElementById('scoutFocus_' + focus)?.classList.add('btn-primary');
}

function setYouthRegime(regime) {
  activeYouthRegime = regime;
  renderScoutingAndAcademy(document.getElementById('gameContent'));
}

function executeYouthDrills() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;
  if ((c.cash || 0) < 0.2) return alert('Insufficient funds! Youth drills cost ₹0.2M.');

  const btn = document.getElementById('btnRunYouthDrills');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⚡ Running intensive youth drills...</span>';
  }

  post('/api/world4/youth/train', ref({
    club: S.selectedClub,
    regime: activeYouthRegime
  })).then(res => {
    if (res.state) S = res.state;
    playSfx('applause');
    playSfx('deal');
    const r = res.result;
    alert(`🌟 YOUTH TRAINING COMPLETE!\n\nRegime: ${activeYouthRegime.toUpperCase()}\n${r?.message || 'Prodigies gained XP and attribute boosts!'}`);
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(err.message || 'Failed to complete youth training.');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '🏃 RUN TARGETED DRILLS (₹0.2M)';
    }
  });
}

function renderWonderkidCards(c) {
  const myYouth = S.market.filter(p => p.ownerClub === c.name && (p.age <= 21 || p.isAcademy || p.isWonderkid));
  if (!myYouth.length) {
    return `
      <div style="grid-column:1/-1;padding:24px;text-align:center;background:var(--bg-card-subtle);border:1px dashed var(--border-subtle);border-radius:12px;color:var(--text-muted);font-size:13px;">
        No U21 prospects currently in squad. Scout or create an academy graduate above to train!
      </div>
    `;
  }

  return myYouth.map(p => {
    const pot = p.potential || Math.min(94, p.rating + Math.round((24 - p.age) * 2.2));
    const xp = p.academyXp || 65;
    return `
      <div class="wonderkid-card" onclick="viewPlayerCard('${p.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div>
            <span class="pill pill-success" style="font-size:9px;margin-bottom:4px;display:inline-block;">🌟 WONDERKID</span>
            <h4 style="font-family:var(--font-display);font-size:16px;font-weight:900;color:#fff;margin:0;">${esc(p.name)}</h4>
            <div style="font-size:11px;color:var(--text-muted);">${p.position} · ${p.age} Yrs old</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:10px;color:var(--text-dim);font-weight:700;">POTENTIAL</div>
            <div style="font-family:var(--font-display);font-size:18px;font-weight:900;color:var(--accent-gold);">${pot}</div>
          </div>
        </div>

        <div style="margin-top:10px;">
          <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-bottom:3px;">
            <span>TRAINING PROGRESS</span>
            <span style="color:var(--accent-neon);font-weight:800;">${xp}% XP</span>
          </div>
          <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${xp}%;background:linear-gradient(90deg, #10b981, #00f0ff);border-radius:4px;"></div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);font-size:11.5px;">
          <span style="color:var(--text-dim);">Current OVR: <b style="color:#fff;">${p.rating}</b></span>
          <span style="color:var(--accent-neon);font-weight:700;">Growth +${Math.max(1, pot - p.rating)}</span>
        </div>
      </div>
    `;
  }).join('');
}

function executeScoutMission() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const btn = document.getElementById('btnDispatchScout');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span>⏳ Scouts exploring regions & compiling dossiers...</span>`;
  }

  post('/api/world4/scout/dispatch', ref({
    club: S.selectedClub,
    mission: { focus: activeScoutFocus }
  })).then(res => {
    playSfx('deal');
    if (res.state) S = res.state;
    currentScoutReports = res.result?.reports || [];
    triggerLiveBudgetUpdate('🔍 Scout Mission Dispatched (-₹1.5M)', 'transfer');
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(`Scout mission failed: ${err.message}`);
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `${svgIcon('search', 16)} <span>LAUNCH SCOUTING EXPEDITION</span>`;
    }
  });
}

function submitCustomPlayer() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const name = document.getElementById('cp_name')?.value;
  const position = document.getElementById('cp_position')?.value;
  const age = document.getElementById('cp_age')?.value;
  const style = document.getElementById('cp_style')?.value;
  const rating = document.getElementById('cp_rating')?.value;

  const btn = document.getElementById('btnCreatePlayer');
  if (btn) btn.disabled = true;

  post('/api/world4/player/create', ref({
    club: S.selectedClub,
    player: { name, position, age, style, rating, nationality: c.country }
  })).then(res => {
    playSfx('applause');
    playSfx('deal');
    alert(`🎉 Academy Success! ${res.result?.player?.name} has graduated and signed a first-team contract with ${c.name}!`);
    if (res.state) S = res.state;
    triggerLiveBudgetUpdate(`🎓 Academy Graduate Signed: ${res.result?.player?.name || 'Youth Player'}`, 'salary');
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(`Academy graduation error: ${err.message}`);
    if (btn) btn.disabled = false;
  });
}
