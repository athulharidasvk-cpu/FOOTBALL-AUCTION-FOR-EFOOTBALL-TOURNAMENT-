<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football World</title><style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#eaf2ff;font-family:Inter,system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0}#app{min-height:100vh;background:radial-gradient(circle at 70% 0,#12365b 0,#07111d 42%,#03070d 100%)}.screen{min-height:100vh;padding:28px;display:flex;align-items:center;justify-content:center}.mode{width:min(1050px,100%);text-align:center}.k{font-size:11px;letter-spacing:3px;color:#48b7ff;font-weight:800}.mode h1{font-size:clamp(38px,7vw,76px);margin:12px 0 8px}.sub{color:#8ea4bb;max-width:680px;margin:auto;line-height:1.6}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:34px auto;max-width:800px}.modeCard{padding:30px;text-align:left;background:linear-gradient(145deg,#10233a,#071321);border:1px solid #234866;border-radius:18px;color:#fff;transition:.2s}.modeCard:hover{transform:translateY(-4px);border-color:#3fb5ff}.modeCard b{display:block;font-size:22px}.modeCard span{display:block;color:#8ea4bb;margin-top:10px;line-height:1.5}.panel{max-width:650px;margin:20px auto;background:#081421;border:1px solid #23405b;border-radius:16px;padding:22px;text-align:left}.form{display:grid;gap:10px}.form label{font-size:12px;color:#9db0c5}.form input,.form select,.search{width:100%;margin-top:5px;background:#0c1d2e;color:#fff;border:1px solid #294963;border-radius:8px;padding:11px}.primary{background:#0c9be8;color:white;padding:12px 18px;border-radius:8px;font-weight:800}.secondary{background:#102438;color:#dcecff;border:1px solid #2a4d6a;padding:10px 15px;border-radius:8px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:18px 24px;border-bottom:1px solid #19334b;position:sticky;top:0;background:#06101bf2;backdrop-filter:blur(12px);z-index:5}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 18px;background:#071321}.tabs button{white-space:nowrap;background:#0d2033;color:#8fa6bb;padding:10px 14px;border-radius:7px}.tabs button.active{background:#087fbe;color:#fff}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(145deg,#0b1a2a,#07111c);border:1px solid #1d3b55;border-radius:13px;padding:18px}.card h2,.card h3{margin:6px 0 10px}.muted{color:#8ca1b6}.big{font-size:28px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric div{padding:10px;background:#091a29;border:1px solid #17364e;border-radius:8px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.6fr .7fr .8fr auto;gap:8px;align-items:center;padding:11px;background:#091827;border:1px solid #19384f;border-radius:8px}.tag{font-size:10px;padding:4px 6px;border:1px solid #31516b;border-radius:5px;color:#86cfff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #193349;text-align:left;font-size:12px}.notice{padding:10px;border-left:3px solid #24a9ed;background:#091b2a;color:#c9d9e8}.danger{color:#ff9d9d}.success{color:#7ee2b2}@media(max-width:800px){.modes,.grid{grid-template-columns:1fr}.screen{padding:14px}.row{grid-template-columns:1fr 1fr}.top{padding:14px}.wrap{padding:12px}}
</style></head><body><div id="app"></div><script src="/socket.io/socket.io.js"></script><script>
const app=document.getElementById('app');let S=null,session=JSON.parse(localStorage.getItem('fw4')||'null'),socket=io();
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const money=n=>Number(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem('fw4',JSON.stringify(session));}function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d})}function ref(x={}){return Object.assign({},x,session?.roomCode?{room:session.roomCode}:{},session?.soloId?{soloId:session.soloId}:{},session?.managerId?{managerId:session.managerId}:{})}function refresh(){let q=session?.roomCode?`?room=${session.roomCode}`:`?soloId=${session.soloId}`;fetch('/api/world4/state'+q).then(r=>r.json()).then(d=>{S=d;renderGame()})}
socket.on('world4:session',d=>{session={...session,...d};save();S=d.state;renderGame()});socket.on('world4:state',d=>{S=d;renderGame()});socket.on('world4:error',e=>alert(e.error||'World error'));
function modeScreen(){app.innerHTML=`<div class="screen"><div class="mode"><div class="k">FOOTBALL MANAGEMENT WORLD</div><h1>Choose Your World</h1><p class="sub">One football universe. Choose a private friends room or build a solo career where AI clubs manage everything around you.</p><div class="modes"><button class="modeCard" onclick="solo()"><b>SOLO CAREER</b><span>One human club. AI managers run the rest of the world. Matches, transfers, leagues, finances and seasons continue without other players.</span></button><button class="modeCard" onclick="online()"><b>ONLINE WORLD</b><span>Create a private room for your friends or join with a room code. Human clubs share one server state while AI fills the remaining football world.</span></button></div><div class="panel"><b>Already playing?</b><div class="actions"><button class="secondary" onclick="resume()">RESUME</button><button class="secondary" onclick="rooms()">BROWSE ROOMS</button></div></div></div></div>`}
function solo(){app.innerHTML=`<div class="screen"><div class="panel"><div class="k">SOLO CAREER</div><h2>Create your football world</h2><p class="muted">The AI will control every other club and manager. You can simulate every match.</p><button class="primary" onclick="createSolo()">CREATE SOLO CAREER</button> <button class="secondary" onclick="modeScreen()">BACK</button></div></div>`}function createSolo(){socket.emit('world4:soloCreate')}
function online(){app.innerHTML=`<div class="screen"><div class="panel"><div class="k">ONLINE WORLD</div><h2>Create a Friends Room</h2><div class="form"><label>Room name<input id="rn" value="Friends Football League"></label><label>Human managers<input id="rm" type="number" min="2" max="20" value="10"></label><label>Your manager<input id="mn" value="Manager"></label></div><div class="actions"><button class="primary" onclick="createRoom()">CREATE ROOM</button><button class="secondary" onclick="modeScreen()">BACK</button></div><hr><h3>Join an existing room</h3><input class="search" id="jc" placeholder="ROOM CODE"><button class="primary" onclick="joinRoom()">JOIN ROOM</button></div></div>`}function createRoom(){socket.emit('world4:createRoom',{name:rn.value,maxHumans:+rm.value,managerName:mn.value})}function joinRoom(){socket.emit('world4:joinRoom',{code:jc.value,managerName:document.getElementById('mn')?.value||'Manager'})}async function rooms(){let r=await fetch('/api/world4/rooms').then(x=>x.json());app.innerHTML=`<div class="screen"><div class="panel"><div class="k">ROOM BROWSER</div><h2>Active friend rooms</h2>${r.length?r.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><small class="muted">${x.count}/${x.max} managers</small></div><strong>${esc(x.code)}</strong><button class="primary" onclick="joinCode('${esc(x.code)}')">JOIN</button></div>`).join(''):'<p class="muted">No rooms are active.</p>'}<button class="secondary" onclick="modeScreen()">BACK</button></div></div>`}function joinCode(c){socket.emit('world4:joinRoom',{code:c,managerName:'Manager'})}function resume(){if(!session?.soloId&&!session?.roomCode)return modeScreen();refresh()}
function renderGame(){if(!S)return;const c=S.clubs.find(x=>x.name===S.selectedClub);if(!c)return clubSetup();app.innerHTML=`<div class="top"><div><div class="k">${S.mode==='solo'?'SOLO CAREER':'ONLINE WORLD'+(S.roomCode?' · '+S.roomCode:'')}</div><b>${esc(c.name)}</b><span class="muted"> · Season ${S.season}</span></div><div class="actions"><button class="secondary" onclick="modeScreen()">EXIT WORLD</button></div></div><div class="tabs">${['home','squad','transfers','managers','league','club','news'].map(t=>`<button id="t-${t}" onclick="tab('${t}')">${t.toUpperCase()}</button>`).join('')}</div><main class="wrap" id="content"></main>`;tab('home')}
function tab(t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('t-'+t)?.classList.add('active');({home, squad, transfers, managers, league, club, news}[t])()}
function home(){const c=S.clubs.find(x=>x.name===S.selectedClub);document.getElementById('content').innerHTML=`<div class="grid"><section class="card"><div class="k">CLUB OVERVIEW</div><h2>${esc(c.name)}</h2><div class="metric"><div>Funds<br><b>₹${money(c.cash)}M</b></div><div>Fans<br><b>${money(c.fans)}</b></div><div>Reputation<br><b>${c.reputation}</b></div><div>Morale<br><b>${c.morale}%</b></div></div></section><section class="card"><div class="k">STADIUM</div><div class="big">${money(c.stadium.capacity||c.stadiumCapacity)}</div><p class="muted">Capacity · Ticket ₹${money(c.ticketPrice)}</p><p>Projected attendance: ${money(c.lastProjectedAttendance||0)}</p></section><section class="card"><div class="k">COMMERCIAL</div><div class="big">${c.merchandise}%</div><p class="muted">Merchandise demand</p><p>Jersey quality: ${c.jersey.quality}%</p><p>Sponsor: ${esc(c.sponsor?.name||'None')} · ₹${money(c.sponsor?.value||0)}M</p></section></div><section class="card" style="margin-top:14px"><div class="k">MANAGER'S PLAN</div><h3>${esc(c.manager?.name||'No manager')}</h3><p>${esc(c.manager?.style||'Hire a manager. The manager will recommend players that fit the tactical system instead of blindly chasing famous names.')}</p><div class="actions"><button class="primary" onclick="simulate()">SIMULATE NEXT MATCH</button><button class="secondary" onclick="advance()">ADVANCE SEASON</button><button class="secondary" onclick="tab('club')">CLUB ECONOMY</button></div></section>`}
function clubSetup(){app.innerHTML=`<div class="screen"><div class="panel"><div class="k">CREATE YOUR CLUB</div><h2>Choose your football world club</h2><div class="form"><label>Country<select id="country">${S.countries.map(x=>`<option>${esc(x.country)}</option>`).join('')}</select></label><label>Division<select id="div"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label><label>Club name<input id="newClub" value="Athul FC"></label><label>Home jersey colour<input id="home" type="color" value="#10243b"></label><label>Away jersey colour<input id="away" type="color" value="#e8edf4"></label><label>Third jersey colour<input id="third" type="color" value="#263b55"></label></div><div class="actions"><button class="primary" onclick="createClub()">CREATE CLUB</button><button class="secondary" onclick="modeScreen()">EXIT</button></div><p class="muted">Your existing crest and jersey customization can be connected here without creating a second club identity.</p></div></div>`}
function createClub(){const country=document.getElementById('country').value,div=+document.getElementById('div').value;post('/api/world4/club/create',ref({name:document.getElementById('newClub').value,country,division:div,home:home.value,away:away.value,third:third.value,quality:75})).then(d=>{S=d;renderGame()}).catch(e=>alert(e.message))}
function squad(){const c=S.clubs.find(x=>x.name===S.selectedClub),ps=S.market.filter(p=>p.ownerClub===c.name);document.getElementById('content').innerHTML=`<section class="card"><div class="k">SQUAD</div><h2>${esc(c.name)}</h2><div class="rows">${ps.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small class="muted">${esc(p.position||'')} · ${p.rating} OVR · Form ${p.form}</small></div><span class="tag">${esc(p.mentality)} ${p.mentalityStrength}</span><span>₹${money(p.salary)}M/y</span><button class="secondary" onclick="release('${p.id}')">RELEASE</button></div>`).join('')}</div></section>`}
function transfers(){const c=S.clubs.find(x=>x.name===S.selectedClub),q=(document.getElementById('q')?.value||'').toLowerCase();const ps=S.market.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.position).toLowerCase().includes(q)).slice(0,100);document.getElementById('content').innerHTML=`<section class="card"><div class="k">TRANSFER MARKET</div><h2>Buy · Sell · Loan · Release</h2><input id="q" class="search" placeholder="Search players" value="${esc(q)}" oninput="transfers()"><div class="notice">${S.transferWindowOpen?'TRANSFER WINDOW OPEN':'TRANSFER WINDOW CLOSED'} · Other managers can intervene in live negotiations.</div><div class="rows" style="margin-top:12px">${ps.map(p=>{const own=p.ownerClub===c.name;return `<div class="row"><div><b>${esc(p.name)}</b><small class="muted">${esc(p.position||'')} · ${p.rating} OVR · ${esc(p.ownerClub||'Free Agent')}</small></div><span class="tag">${esc(p.mentality)}</span><span>₹${money(p.askingPrice)}M</span><div class="actions">${!own?`<button class="secondary" onclick="offer('${p.id}')">BUY</button><button class="secondary" onclick="loan('${p.id}')">LOAN</button>`:`<button class="secondary" onclick="sell('${p.id}')">SELL</button><button class="secondary" onclick="release('${p.id}')">RELEASE</button>`}</div></div>`}).join('')}</div></section>`}
function offer(pid){const fee=prompt('Transfer fee (₹M)','10');if(fee===null)return;post('/api/world4/transfer/offer',ref({club:S.selectedClub,playerId:pid,fee:+fee,salary:3,years:3,type:'buy'})).then(b=>{alert('Negotiation opened. Other managers can hijack this deal.');}).catch(e=>alert(e.message))}function sell(pid){const fee=prompt('Asking price (₹M)','10');if(fee===null)return;post('/api/world4/transfer/sell',ref({club:S.selectedClub,playerId:pid,asking:+fee})).then(()=>alert('Player listed for negotiation.')).catch(e=>alert(e.message))}function loan(pid){post('/api/world4/transfer/loan',ref({club:S.selectedClub,playerId:pid,months:12,fee:1,salaryShare:50})).then(()=>refresh()).catch(e=>alert(e.message))}function release(pid){if(!confirm('Release this player and make them a free agent?'))return;post('/api/world4/transfer/release',ref({club:S.selectedClub,playerId:pid})).then(()=>refresh()).catch(e=>alert(e.message))}
function managers(){fetch('/api/world4/managers?'+(session.roomCode?'room='+session.roomCode:'soloId='+session.soloId)).then(r=>r.json()).then(ms=>{document.getElementById('content').innerHTML=`<section class="card"><div class="k">MANAGER MARKET</div><h2>Hire your football brain</h2><p class="muted">Managers have different philosophies, formations and recruitment strengths.</p><div class="rows">${ms.filter(m=>m.status==='available').slice(0,25).map(m=>`<div class="row"><div><b>${esc(m.name)}</b><small class="muted">${esc(m.style)} · OVR ${m.rating}</small></div><span>${m.preferredFormations?.join(' / ')||''}</span><span>₹${money(m.salary)}M/y</span><button class="primary" onclick="hire('${m.id}')">HIRE</button></div>`).join('')}</div></section>`})}
function hire(id){post('/api/world4/manager/hire',ref({club:S.selectedClub,managerId:id})).then(d=>{S=d;renderGame()}).catch(e=>alert(e.message))}
function league(){const cs=S.clubs.filter(c=>c.country===S.clubs.find(x=>x.name===S.selectedClub)?.country&&c.division===S.clubs.find(x=>x.name===S.selectedClub)?.division).sort((a,b)=>b.stats.points-a.stats.points);document.getElementById('content').innerHTML=`<section class="card"><div class="k">LEAGUE</div><h2>Division ${S.clubs.find(x=>x.name===S.selectedClub).division}</h2><table class="table"><tr><th>#</th><th>Club</th><th>Pts</th><th>W</th><th>D</th><th>L</th></tr>${cs.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${c.stats.points}</td><td>${c.stats.wins}</td><td>${c.stats.draws}</td><td>${c.stats.losses}</td></tr>`).join('')}</table><div class="actions"><button class="primary" onclick="simulate()">SIMULATE MATCH</button><button class="secondary" onclick="advance()">NEXT SEASON</button></div></section>`}
function club(){const c=S.clubs.find(x=>x.name===S.selectedClub);document.getElementById('content').innerHTML=`<div class="grid"><section class="card"><div class="k">STADIUM & TICKETS</div><p>Capacity: <b>${money(c.stadium.capacity||c.stadiumCapacity)}</b></p><label class="muted">Ticket price<input id="ticket" type="number" value="${c.ticketPrice}"></label><label class="muted">New capacity<input id="cap" type="number" value="${c.stadium.capacity||c.stadiumCapacity}"></label><button class="primary" onclick="economy()">SAVE ECONOMY</button></section><section class="card"><div class="k">JERSEY & MERCHANDISE</div><p>Jersey quality: <b>${c.jersey.quality}%</b></p><input id="jq" type="range" min="10" max="100" value="${c.jersey.quality}"><p>Merchandise demand: <b>${c.merchandise}%</b></p><p>Famous/high-rated players increase jersey demand.</p><button class="secondary" onclick="economy()">UPDATE KIT DEMAND</button></section><section class="card"><div class="k">SPONSORSHIPS</div><p>Current: <b>${esc(c.sponsor?.name||'None')}</b> · ₹${money(c.sponsor?.value||0)}M</p><button class="primary" onclick="sponsors()">VIEW DEALS</button></section></div>`}
function economy(){post('/api/world4/economy',ref({club:S.selectedClub,ticketPrice:+ticket.value,capacity:+cap.value,jerseyQuality:+jq.value})).then(d=>{S=d;renderGame()}).catch(e=>alert(e.message))}function sponsors(){fetch('/api/world4/sponsors?'+(session.roomCode?'room='+session.roomCode+'&':'soloId='+session.soloId+'&')+'club='+encodeURIComponent(S.selectedClub)).then(r=>r.json()).then(a=>{document.getElementById('content').innerHTML=`<section class="card"><div class="k">SPONSOR MARKET</div><h2>Choose a commercial partner</h2><div class="rows">${a.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><small class="muted">${x.years} season · ${esc(x.objective)}</small></div><strong>₹${money(x.value)}M</strong><span>Bonus ₹${money(x.bonus)}M</span><button class="primary" onclick="signSponsor('${x.id}')">SIGN</button></div>`).join('')}</div></section>`})}function signSponsor(id){post('/api/world4/sponsor/sign',ref({club:S.selectedClub,offerId:id})).then(d=>{S=d;renderGame()}).catch(e=>alert(e.message))}
function news(){document.getElementById('content').innerHTML=`<section class="card"><div class="k">GLOBAL NEWS</div><h2>Football World</h2><div class="rows">${S.news.map(n=>`<div class="notice"><b>${esc(n.type)}</b> · ${esc(n.text)}</div>`).join('')}</div></section>`}
function simulate(){post('/api/world4/match/simulate',ref({})).then(r=>{alert(`${r.home} ${r.homeGoals}-${r.awayGoals} ${r.away}\nAttendance: ${money(r.attendance)}\nRevenue: ₹${money(r.revenue)}M`);refresh()}).catch(e=>alert(e.message))}function advance(){post('/api/world4/season/advance',ref({})).then(d=>{S=d;renderGame()}).catch(e=>alert(e.message))}
modeScreen();
</script></body></html>
