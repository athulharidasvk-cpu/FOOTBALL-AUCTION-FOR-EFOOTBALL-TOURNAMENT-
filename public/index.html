<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Football Auction</title>
  <meta name="description" content="Football club management simulator featuring Head Manager and Club Owner career modes, tactical set-pieces, youth academy, stadium expansion, real-time transfers, and dynamic matchday competition.">
  <meta property="og:title" content="Football Auction">
  <meta property="og:description" content="Football club management simulator featuring Head Manager and Club Owner career modes, tactical set-pieces, youth academy, stadium expansion, real-time transfers, and dynamic matchday competition.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d18;
      --bg-card: #0d1728;
      --bg-card-hover: #122038;
      --bg-card-subtle: #0a1322;
      --border-subtle: #1a2c47;
      --border-accent: #2c4a75;
      --pitch-grass: #164024;
      --pitch-stripe: #12361e;
      --pitch-lines: rgba(255, 255, 255, 0.45);
      --accent-neon: #00e599;
      --accent-blue: #2a8bf2;
      --accent-gold: #ffb830;
      --text-main: #f0f6fc;
      --text-muted: #8b9eb5;
      --text-dim: #5c708a;
      --danger: #ff4757;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; outline: none; }
    button { cursor: pointer; border: 0; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    button:active { transform: scale(0.98); }
    
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -10%, #152744 0%, #080f1e 50%, #040810 100%);
    }

    /* Top HUD Navigation */
    .hud-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 17, 31, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .club-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .crest-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.25);
      flex-shrink: 0;
    }
    .club-title {
      display: flex;
      flex-direction: column;
    }
    .club-title h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.15;
    }
    .club-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-div { background: rgba(42, 139, 242, 0.2); color: #6db4ff; border: 1px solid rgba(42, 139, 242, 0.4); }
    .pill-season { background: rgba(0, 229, 153, 0.15); color: var(--accent-neon); border: 1px solid rgba(0, 229, 153, 0.35); }
    .pill-manager { background: rgba(255, 184, 48, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 184, 48, 0.35); }
    
    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 6px 14px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }
    .hud-stat .label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; }
    .hud-stat .value { font-family: var(--font-display); font-size: 17px; font-weight: 800; color: #fff; }
    .hud-stat .value.cash { color: var(--accent-neon); }

    /* Persistent Live Header Budget Tracker Component */
    .hud-budget-tracker {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(14, 30, 56, 0.95), rgba(7, 18, 36, 0.98));
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 0 14px rgba(0, 240, 255, 0.05);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .hud-budget-tracker:hover {
      border-color: var(--accent-neon);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.22);
    }
    .hud-budget-pulse-tag {
      position: absolute;
      top: -12px;
      right: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 2px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      animation: budgetTagBounce 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      white-space: nowrap;
      z-index: 20;
    }
    @keyframes budgetTagBounce {
      0% { transform: translateY(6px) scale(0.85); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .hud-budget-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hud-budget-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .hud-budget-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .hud-budget-lbl {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .hud-budget-val {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }
    .hud-budget-val.cash {
      color: var(--accent-neon);
    }
    .hud-budget-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .hud-budget-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-neon);
      margin-left: 2px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .hud-budget-tracker:hover .hud-budget-btn {
      background: var(--accent-neon);
      color: #030b17;
      border-color: var(--accent-neon);
    }

    .nav-tabs {
      background: #091322;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      padding: 0 24px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 14px 18px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent-blue);
      background: rgba(42, 139, 242, 0.1);
    }

    /* Main Container */
    .game-body {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Tactical Football Pitch */
    .pitch-container {
      background: linear-gradient(135deg, var(--pitch-grass) 0%, var(--pitch-stripe) 100%);
      border: 2px solid #235c34;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.4);
      padding: 30px 20px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pitch-lines {
      position: absolute;
      inset: 12px;
      border: 2px solid var(--pitch-lines);
      border-radius: 12px;
      pointer-events: none;
    }
    .pitch-halfway {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--pitch-lines);
      transform: translateY(-50%);
    }
    .pitch-center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      border: 2px solid var(--pitch-lines);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .pitch-penalty-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-top: none;
      border-radius: 0 0 10px 10px;
    }
    .pitch-penalty-bottom {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    /* Pitch Player Nodes */
    .pitch-line {
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 4px 0;
    }
    .pitch-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .pitch-player:hover { transform: scale(1.1); z-index: 20; }
    .player-jersey-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #112239;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      position: relative;
    }
    .player-ovr-tag {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .ovr-elite { color: #00e599; border-color: #00e599; }
    .ovr-gold { color: #ffb830; border-color: #ffb830; }
    .ovr-silver { color: #a1c4fd; border-color: #a1c4fd; }
    
    .player-name-plate {
      margin-top: 6px;
      background: rgba(6, 13, 24, 0.88);
      backdrop-filter: blur(8px);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .pos-label {
      font-size: 9px;
      font-weight: 800;
      color: #ffca3a;
      text-transform: uppercase;
    }

    /* Cards & Grids */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; }
    .col-5 { grid-column: span 5; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

    .game-card {
      background: linear-gradient(165deg, var(--bg-card) 0%, var(--bg-card-subtle) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .card-header h2 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Buttons */
    button, .btn {
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    button:active, .btn:active {
      transform: scale(0.96) !important;
      filter: brightness(0.92);
    }
    .btn:disabled, button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .btn-loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      top: calc(50% - 8px);
      left: calc(50% - 8px);
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spinFast 0.6s linear infinite;
    }
    @keyframes spinFast {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
    }
    .subnav-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }
    .subnav-pill {
      padding: 8px 18px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .subnav-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .subnav-pill.active {
      color: #fff;
      background: var(--accent-blue);
      box-shadow: 0 2px 10px rgba(18, 130, 232, 0.4);
    }
    .btn-primary {
      background: linear-gradient(135deg, #1282e8 0%, #0b5fb0 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(18, 130, 232, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2293fa 0%, #106fcc 100%);
      box-shadow: 0 6px 20px rgba(18, 130, 232, 0.6);
    }
    .btn-success {
      background: linear-gradient(135deg, #00d287 0%, #00a669 100%);
      color: #032112;
      box-shadow: 0 4px 14px rgba(0, 210, 135, 0.35);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #05ea97 0%, #00bf79 100%);
    }
    .btn-secondary {
      background: #13243c;
      color: #d1e2f7;
      border: 1px solid var(--border-accent);
    }
    .btn-secondary:hover {
      background: #1a3254;
      color: #fff;
    }
    .btn-danger {
      background: rgba(255, 71, 87, 0.15);
      color: #ff6b7a;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 6px 12px; font-size: 11.5px; border-radius: 7px; }

    /* Forms & Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-control {
      background: #091322;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-blue);
      background: #0d1b30;
    }

    /* Roster & Table Styles */
    .roster-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    .roster-table th {
      padding: 8px 14px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
    }
    .roster-row {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      transition: transform 0.15s, background 0.15s;
    }
    .roster-row td {
      padding: 12px 14px;
      font-size: 13px;
    }
    .roster-row td:first-child { border-radius: 10px 0 0 10px; }
    .roster-row td:last-child { border-radius: 0 10px 10px 0; }
    .roster-row:hover {
      background: var(--bg-card-hover);
      transform: translateX(3px);
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pos-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: #172d47;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .pos-badge.att { background: #5c1825; color: #ff7b92; border-color: #ff7b92; }
    .pos-badge.mid { background: #1c4228; color: #73e69b; border-color: #73e69b; }
    .pos-badge.def { background: #183354; color: #76b6ff; border-color: #76b6ff; }
    .pos-badge.gk { background: #4f3b14; color: #ffd166; border-color: #ffd166; }

    /* Jersey Studio */
    .kit-preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle, #162640 0%, #091322 100%);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      width: min(540px, 100%);
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      position: relative;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
      .hud-metrics { display: none; }
      .game-body { padding: 16px; }
    }

    /* ============================================================
       ANIMATIONS & CINEMATIC SUITE
       ============================================================ */
    @keyframes penGlide {
      0% { transform: translate(-20px, -40px) rotate(-15deg); opacity: 0; }
      20% { opacity: 1; }
      85% { transform: translate(140px, 8px) rotate(-5deg); opacity: 1; }
      100% { transform: translate(160px, -15px) rotate(0deg); opacity: 0; }
    }
    @keyframes inkDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes stampDrop {
      0% { transform: scale(3) rotate(-25deg); opacity: 0; }
      70% { transform: scale(0.95) rotate(-5deg); opacity: 1; }
      85% { transform: scale(1.05) rotate(-8deg); }
      100% { transform: scale(1) rotate(-8deg); opacity: 0.95; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -1px); }
    }
    @keyframes flashBurst {

<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const app = document.getElementById('app');
let S = null;
let session = JSON.parse(localStorage.getItem('fw4') || 'null');
let socket = io({
  query: Object.assign({},
    session?.roomCode ? { room: session.roomCode } : {},
    session?.soloId ? { soloId: session.soloId } : {},
    session?.managerId ? { managerId: session.managerId } : {}
  )
});
let currentTab = 'matchday';
let subTabs = {
  matchday: 'fixture',
  squad: 'pitch',
  transfers: 'bids',
  competitions: 'league',
  club: 'stadium'
};
let cachedNextFixture = null;
let activeLiveMatch = null;
let matchSimulationInProgress = false;
let clientSelectedMentality = 'balanced';
let activeYouthRegime = 'finishing';
let userRole = (session && session.userRole) ? session.userRole : 'manager'; // 'manager' | 'owner' | 'dual'

function getRoleBadgeStyle() {
  if (userRole === 'manager') return 'background:rgba(42,139,242,0.22);color:#70b5ff;border:1px solid rgba(42,139,242,0.5);';
  if (userRole === 'owner') return 'background:rgba(255,184,48,0.22);color:var(--accent-gold);border:1px solid rgba(255,184,48,0.5);';
  return 'background:rgba(0,229,153,0.22);color:var(--accent-neon);border:1px solid rgba(0,229,153,0.5);';
}

function getRoleBadgeContent() {
  if (userRole === 'manager') return `${svgIcon('tie', 14)} ROLE: HEAD MANAGER`;
  if (userRole === 'owner') return `${svgIcon('temple', 14)} ROLE: CLUB OWNER`;
  return `${svgIcon('crown', 14)} ROLE: OWNER &amp; MANAGER`;
}

function getRoleDescriptionHtml(role) {
  if (role === 'manager') {
    return `<span style="color:#70b5ff;font-weight:700;">${svgIcon('tie', 16, '#70b5ff')} HEAD MANAGER MODE:</span> You command the dugout, decide team sheets and tactical shapes, shout instructions from the touchline, develop youth prospects, and face the media in press conferences while answering to the Board.`;
  }
  if (role === 'owner') {
    return `<span style="color:var(--accent-gold);font-weight:700;">${svgIcon('temple', 16, 'var(--accent-gold)')} CLUB OWNER MODE:</span> You hold 100% controlling equity. Hire, evaluate or dismiss managers, finance multi-million stadium &amp; VIP box expansions, negotiate sponsor bids, and sanction blockbuster transfers.`;
  }
  return `<span style="color:var(--accent-neon);font-weight:700;">${svgIcon('crown', 16, 'var(--accent-neon)')} DUAL ROLE (OWNER &amp; MANAGER):</span> Absolute club autocracy. Rule the boardroom treasury, sponsor deals and infrastructure, while commanding starting line-ups and matchday tactics on the pitch.`;
}

function setUserCareerRole(role) {
  userRole = role;
  if (!session) session = {};
  session.userRole = role;
  save();
  playSfx('click');
  const exp = document.getElementById('roleExplainerText');
  if (exp) exp.innerHTML = getRoleDescriptionHtml(role);
  ['manager', 'owner', 'dual'].forEach(r => {
    const btn = document.getElementById('roleBtn_' + r);
    if (btn) {
      if (r === role) {
        btn.className = 'btn btn-sm btn-primary';

// Web Audio synthesizer for atmospheric animations
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSfx(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'pen') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(540, now + 0.12);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'stamp') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.28);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'flash') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.04);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'deal' || type === 'applause') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.1, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.35);
      });
        } else if (type === 'whistle') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'triangle'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(2400, now);
      osc2.frequency.setValueAtTime(2460, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(now); osc1.stop(now + 0.35);
      osc2.start(now); osc2.stop(now + 0.35);
    } else if (type === 'kick') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'goal') {
      [440, 554.37, 659.25, 880].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.15, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.4);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.4);
      });
    } else if (type === 'crisis') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.4);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.45);
    }
  } catch(e) {}
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}

function get(url) {
  const delim = url.includes('?') ? '&' : '?';
  let fullUrl = url;
  if (session?.roomCode) fullUrl += `${delim}room=${encodeURIComponent(session.roomCode)}`;
  else if (session?.soloId) fullUrl += `${delim}soloId=${encodeURIComponent(session.soloId)}`;
  if (session?.managerId) fullUrl += `&managerId=${encodeURIComponent(session.managerId)}`;
  return fetch(fullUrl).then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}


// Universal player resolver helper function
function player(state, idOrName) {
  if (!idOrName) return null;
  if (typeof idOrName === 'object' && idOrName.name) return idOrName;
  const s = state || (typeof S !== 'undefined' ? S : null);
  if (!s || !s.market || !Array.isArray(s.market)) return null;
  const targetId = typeof idOrName === 'object' ? (idOrName.id || idOrName.playerId) : idOrName;
  return s.market.find(p => p.id === targetId || p.name === targetId || String(p.id) === String(targetId)) || null;
}
window.player = player;

function ref(extra = {}) {
  return Object.assign({}, extra,
    session?.roomCode ? { room: session.roomCode } : {},
    session?.soloId ? { soloId: session.soloId } : {},
    session?.managerId ? { managerId: session.managerId } : {}
  );
}

function refresh() {
  const q = session?.roomCode ? `?room=${session.roomCode}` : (session?.soloId ? `?soloId=${session.soloId}` : '');
  fetch('/api/world4/state' + q)
    .then(r => r.json())
    .then(data => {
      if (data && !data.error) {
        S = data;
        renderGame();
      }
    })
    .catch(err => console.error('[State Error]', err));
}

const EMOJI_CHAR_REGEX = /[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1FA00}-\u{1FAFF}]/gu;

function replaceEmojisWithSvg(inputStr, size = 15, color = 'currentColor') {
  if (!inputStr) return '';
  return String(inputStr).replace(EMOJI_CHAR_REGEX, (match) => {
    const iconName = EMOJI_ICON_MAP[match] || 'ball';
    return `<span class="app-icon-wrap" style="display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px;">${svgIcon(iconName, size, color)}</span>`;
  });
}

function sanitizeDomIcons(root = document.body) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  const toSwap = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.nodeValue && EMOJI_CHAR_REGEX.test(node.nodeValue)) {
      const p = node.parentElement;
      if (p && p.tagName !== 'SCRIPT' && p.tagName !== 'STYLE' && p.tagName !== 'TEXTAREA') {
        toSwap.push(node);
      }
    }
  }
  toSwap.forEach(node => {
    const span = document.createElement('span');
    span.innerHTML = replaceEmojisWithSvg(node.nodeValue);
    if (node.parentNode) node.parentNode.replaceChild(span, node);
  });
}

window.svgIcon = svgIcon;
window.replaceEmojisWithSvg = replaceEmojisWithSvg;
window.sanitizeDomIcons = sanitizeDomIcons;


function renderStarsSvg(count = 1, max = 5, size = 13, color = '#f59e0b') {
  let out = '';
  const num = Math.max(0, Math.min(max, Math.round(count)));
  for (let i = 0; i < max; i++) {
    out += svgIcon('star', size, i < num ? color : 'rgba(255,255,255,0.18)');
  }
  return `<span style="display:inline-flex;align-items:center;gap:2px;vertical-align:middle;">${out}</span>`;
}

function flagBadgeSvg(countryName = '', size = 24) {
  const s = size;
  const c = String(countryName || '').toLowerCase();
  let colors = ['#1e3a8a', '#dc2626', '#ffffff']; // Default
  if (c.includes('brazil')) colors = ['#15803d', '#facc15', '#2563eb'];
  else if (c.includes('england')) colors = ['#ffffff', '#dc2626', '#1e3a8a'];
  else if (c.includes('spain')) colors = ['#dc2626', '#facc15', '#b91c1c'];
  else if (c.includes('argentina')) colors = ['#38bdf8', '#ffffff', '#f59e0b'];
  else if (c.includes('france')) colors = ['#2563eb', '#ffffff', '#dc2626'];
  else if (c.includes('germany')) colors = ['#111827', '#dc2626', '#facc15'];
  else if (c.includes('italy')) colors = ['#16a34a', '#ffffff', '#dc2626'];
  else if (c.includes('portugal')) colors = ['#16a34a', '#dc2626', '#facc15'];
  else if (c.includes('netherlands')) colors = ['#ea580c', '#ffffff', '#2563eb'];

function startManagerCareerFlow() {
  setUserCareerRole('manager');

  setUserCareerRole('owner');

async function createSoloWorld(intendedRole) {
  if (intendedRole) {
    setUserCareerRole(intendedRole);
  }
  const cards = document.querySelectorAll('.game-card');
  cards.forEach(card => {
    card.style.pointerEvents = 'none';
    card.style.opacity = '0.7';
  });

  try {
    const res = await fetch('/api/world4/solo/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    const data = await res.json();
    if (!res.ok || !data.soloId || !data.state) {
      throw new Error(data.error || 'Unable to create solo career.');
    }

    session = {
      ...(session || {}),
      type: 'solo',
      soloId: data.soloId,
      roomCode: null,
      managerId: null,
      userRole: userRole
    };
    save();
    S = data.state;

    // Direct routing:
    // If Manager Mode is chosen: Go directly to lower division assignment screen! (NO create a club popup)
    // If Owner Mode is chosen: Go to Create a Club Studio!
    if (userRole === 'manager') {
      renderManagerAppointmentScreen();
    } else {
      clubSetup(); // Only owner mode triggers create a club popup!
    }
  } catch (err) {
    console.error('[Solo Career]', err);
    alert('Solo Career could not start. Please refresh the page and try again.');
    cards.forEach(card => {
      card.style.pointerEvents = '';
      card.style.opacity = '';
    });
  }
}

async function confirmManagerAppointment(clubName) {
  const nameInput = document.getElementById('mgrInputName');
  const mgrName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : (managerCandidateName || 'Head Coach');
  managerCandidateName = mgrName;
  if (!session) session = {};
  session.managerName = mgrName;
  session.userRole = 'manager';
  save();

  try {
    const res = await post('/api/world4/manager/assign', ref({
      club: clubName,
      managerName: mgrName
    }));
    playSfx('pen');
    S = res.state || res;
    showManagerUnveilingModal(clubName, mgrName);
  } catch (err) {
    alert(err.message || 'Could not ratify appointment.');
  }
}

function assignToRandomLowerClub() {
  const nameInput = document.getElementById('mgrInputName');
  const mgrName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : (managerCandidateName || 'Head Coach');
  managerCandidateName = mgrName;
  if (!session) session = {};
  session.managerName = mgrName;
  session.userRole = 'manager';
  save();

  post('/api/world4/manager/assign', ref({
    club: null,
    managerName: mgrName
  })).then(res => {
    playSfx('pen');
    S = res.state || res;
    showManagerUnveilingModal(S.selectedClub, mgrName);
  }).catch(err => alert(err.message || 'Error assigning club.'));
}

function acceptHigherJobOffer(targetClub) {
  if (!confirm(`Are you sure you want to accept the Head Coach appointment at ${targetClub}? You will take your managerial reputation and stats to the new club!`)) return;

  post('/api/world4/manager/accept-job', ref({
    targetClub
  })).then(res => {
    playSfx('deal');
    S = res.state || res;
    document.getElementById('managerOfficeModal')?.remove();
    document.getElementById('managerApproachesModal')?.remove();
    alert(`${svgIcon('party', 14)}  CONTRACT RATIFIED! You are now the official Head Coach of ${targetClub}!`);
    renderGame();
  }).catch(err => alert(err.message || 'Error accepting offer.'));
}

async function respondToClubApproach(approachId, action) {
  const mc = S?.managerCareer;
  const app = (mc?.approaches || []).find(a => a.id === approachId);
  if (!app) return;

  if (action === 'negotiate') {
    document.getElementById('managerOfficeModal')?.remove();
    document.getElementById('managerApproachesModal')?.remove();
    openManagerRoleNegotiationModal(app.club, true, app.id);
    return;
  }

  if (action === 'accept') {
    if (!confirm(`Are you sure you want to accept the Head Coach appointment at ${app.club}?\n\n${svgIcon('coin', 14)}  Transfer War Chest: ₹${money(app.offeredBudget)}M\n${svgIcon('coin', 14)}  Salary: ₹${app.offeredSalary}M/yr\n⏳ Duration: ${app.contractYears || 3} Years\n\nYou will take charge of ${app.club} immediately!`)) return;
  }

  try {
    const res = await post('/api/world4/manager/approaches/respond', ref({
      approachId,
      action
    }));
    playSfx('deal');
    S = res.state || res;

    if (action === 'accept') {
      document.getElementById('managerOfficeModal')?.remove();
      document.getElementById('managerApproachesModal')?.remove();
      alert(`${svgIcon('party', 14)}  APPOINTMENT RATIFIED!\n\nYou have officially taken over as Head Coach of ${app.club}!\nAn extra ₹${money(app.offeredBudget)}M war chest has been deposited into your club treasury.`);
      renderGame();
      return;
    }

    if (action === 'leak') {
      alert(`${svgIcon('bomb', 14)}  BOMBSHELL LEAKED TO PRESS!\n\nYour agent leaked ${app.club}'s approach to Sky Sports and Fabrizio Romano!\n\nIn a state of panic, your current board committed loyalty funds of ₹${res.result?.retentionFunds || 6}M into your squad war chest and boosted your contract salary by 15% to keep you!`);
    } else if (action === 'stall') {
      alert(`⏳ APPROACH POSTPONED!\n\n${app.club} has been informed you need time to focus on upcoming fixtures. They have agreed to hold their formal offer open.`);
    } else if (action === 'decline') {
      alert(`${svgIcon('x', 14)}  APPROACH REJECTED!\n\nYou formally declined ${app.club}'s approach. Your current board and supporters are overjoyed at your loyalty (+5% Board Confidence)!`);
    }

    if (document.getElementById('managerApproachesModal')) {
      openManagerApproachesModal();
    } else if (document.getElementById('managerOfficeModal')) {
      openManagerOfficeModal();
    }
    renderGame();
  } catch (err) {
    alert(err.message || 'Error responding to approach.');
  }
}

async function solicitAgentApproaches() {
  try {

    alert(`${svgIcon('radar', 14)}  AGENT DISPATCHED!\n\nYour representative sounded out interested clubs across the leagues.\n${res.result?.createdCount || 2} new clubs have submitted formal approaches to hire you as their Head Coach!`);

    }

  } catch (err) {
    alert(err.message || 'Error contacting agent.');
  }
}

let currentNegotiatingRoleData = null;

async function openManagerRoleNegotiationModal(clubName, isNewJob = false, offerId = null) {
  const targetName = clubName || S?.selectedClub;
  const c = S?.clubs?.find(x => x.name === targetName) || {};
  let contractData = null;
  try {
    const q = session?.roomCode ? `&room=${encodeURIComponent(session.roomCode)}` : (session?.soloId ? `&soloId=${encodeURIComponent(session.soloId)}` : '');
    const res = await fetch('/api/world4/manager/contract?club=' + encodeURIComponent(targetName) + q);
    contractData = await res.json();
  } catch (e) {}

  const nameInput = document.getElementById('mgrInputName');
  const mgrName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : ((session && session.managerName) ? session.managerName : 'Head Coach');

  const mc = contractData?.managerCareer || S?.managerCareer || {
    name: mgrName,
    reputation: c.division === 4 ? 22 : c.division === 3 ? 28 : 50,
    tier: 'Tactician',
    boardConfidence: 85
  };

  const existingContract = contractData?.contract || mc.contract || {
    salary: c.division === 4 ? 0.35 : c.division === 3 ? 0.65 : c.division === 2 ? 2.5 : 8.0,
    yearsRemaining: 2,
    expectations: c.division === 4 ? 'avoid_relegation' : 'promotion',
    releaseClause: c.division === 4 ? 12 : 25,
    extraWarChestGranted: 0,
    vetoPower: false,
    youthFunding: false
  };

  const div = c.division || 3;
  const approachOffer = (mc.approaches || []).find(a => a.club === targetName || a.id === offerId) || (mc.jobOffers || []).find(o => o.club === targetName || o.id === offerId);
  const defaultWarChest = approachOffer ? (approachOffer.offeredBudget || approachOffer.budget || 10) : (isNewJob ? (div === 4 ? 5 : div === 3 ? 10 : 25) : 8);
  const defaultSalary = approachOffer ? (approachOffer.offeredSalary || (parseFloat(String(approachOffer.salary || '').replace(/[^0-9.]/g, '')) || 1.2)) : (existingContract.salary || (div === 4 ? 0.45 : div === 3 ? 0.8 : 3.0));

  currentNegotiatingRoleData = {
    clubName: targetName,
    isNewJob,
    offerId,
    candidateName: mc.name || mgrName || 'Head Coach',
    demands: {
      salary: defaultSalary,
      transferWarChest: defaultWarChest,
      contractYears: 2,
      expectations: existingContract.expectations || 'balanced',
      releaseClause: existingContract.releaseClause || (div === 4 ? 15 : 30),
      vetoPower: existingContract.vetoPower || false,
      youthFunding: existingContract.youthFunding || false
    }
  };

  renderManagerRoleNegotiationModalUI(c, mc);
}

function calculateRoleNegotiationAcceptanceChance(c, mc, demands) {
  const div = c.division || 3;
  const rep = mc.reputation || 25;
  const maxReasonableWarChest = div === 4 ? 15 : div === 3 ? 28 : div === 2 ? 55 : 95;
  const baseSalaryCap = div === 4 ? 0.9 : div === 3 ? 1.8 : div === 2 ? 4.5 : 16.0;
  const repFactor = Math.max(0.6, rep / 45);

  let score = 75;
  score += (rep - 25) * 0.7;

  const chestDiff = (demands.transferWarChest || 0) - (maxReasonableWarChest * repFactor * 0.5);
  if (chestDiff > 0) score -= chestDiff * 2.8;

  const salDiff = (demands.salary || 0.5) - (baseSalaryCap * repFactor * 0.5);
  if (salDiff > 0) score -= salDiff * 18;

  if (demands.vetoPower && rep < 35) score -= 12;
  if (demands.youthFunding) score -= 5;

  return Math.min(99, Math.max(8, Math.round(score)));
}

  const chance = calculateRoleNegotiationAcceptanceChance(c, mc, d);

  overlay.innerHTML = `

function setRoleContractYears(yrs, c, mc) {
  if (!currentNegotiatingRoleData) return;
  currentNegotiatingRoleData.demands.contractYears = yrs;
  [1, 2, 3, 4, 5].forEach(y => {
    const btn = document.getElementById(`btnYrs_${y}`);
    if (btn) btn.className = `btn btn-sm ${y === yrs ? 'btn-primary' : 'btn-secondary'}`;
  });
  updateRoleNegotiationGauge(c, mc);
}

function setRoleMandate(mandate, c, mc) {
  if (!currentNegotiatingRoleData) return;
  currentNegotiatingRoleData.demands.expectations = mandate;
  ['rebuild', 'balanced', 'title_charge'].forEach(m => {
    const btn = document.getElementById(m === 'rebuild' ? 'mandate_rebuild' : m === 'balanced' ? 'mandate_balanced' : 'mandate_title');
    if (btn) btn.className = `btn btn-sm ${m === mandate ? 'btn-primary' : 'btn-secondary'}`;
  });
  updateRoleNegotiationGauge(c, mc);
}

function updateRoleNegotiationGauge(c, mc) {
  if (!currentNegotiatingRoleData) return;
  const chance = calculateRoleNegotiationAcceptanceChance(c, mc, currentNegotiatingRoleData.demands);
  const color = chance >= 75 ? 'var(--accent-neon)' : chance >= 50 ? 'var(--accent-gold)' : '#ff4757';
  const pctEl = document.getElementById('roleChancePct');
  const barEl = document.getElementById('roleChanceBar');
  if (pctEl) {
    pctEl.textContent = chance + '%';
    pctEl.style.color = color;
  }
  if (barEl) {
    barEl.style.width = chance + '%';
    barEl.style.background = color;
  }
}

function submitRoleNegotiationDemands(c, mc) {
  const data = currentNegotiatingRoleData;
  if (!data) return;

  const btnRow = document.getElementById('roleNegotiationActionRow');
  if (btnRow) {
    btnRow.innerHTML = `<div style="text-align:center;width:100%;color:var(--accent-gold);font-weight:800;padding:12px;">⏳ Boardroom is reviewing contract terms with club ownership...</div>`;
  }

  post('/api/world4/manager/negotiate-role', ref({
    club: data.clubName,
    isNewJob: data.isNewJob,
    offerId: data.offerId,
    demands: data.demands,
    managerName: data.candidateName
  })).then(res => {
    if (res.error) return alert(res.error);
    const r = res.result || res;

    if (r.status === 'accepted') {
      playSfx('deal');
      playSfx('applause');
      S = res.state || S;
      if (data.isNewJob) {
        if (!session) session = {};
        session.managerName = data.candidateName;
        session.userRole = 'manager';
        save();
      }
      document.getElementById('managerRoleNegotiationModal')?.remove();
      document.getElementById('managerOfficeModal')?.remove();
      alert(`${svgIcon('party', 14)}  CONTRACT RATIFIED BY BOARDROOM!\n\n${r.message}`);
      renderGame();
      return;
    }

    if (r.status === 'counter') {
      playSfx('deal');
      const cp = r.counterProposal;
      const dlg = document.getElementById('roleDialogueBox');
      if (dlg) {
        dlg.innerHTML = `
          <b style="color:var(--accent-gold);">Chairman of the Board (Counter-Proposal):</b><br>
          "${r.message}"<br><br>
          <div style="background:rgba(0,0,0,0.3);border-radius:6px;padding:8px 12px;font-size:12px;">
            Offered War Chest: <b style="color:var(--accent-neon);">+₹${cp.transferWarChest}M</b> · Offered Salary: <b style="color:var(--accent-gold);">₹${cp.salary}M/yr</b> · Duration: <b>${cp.contractYears} Seasons</b>
          </div>
        `;
      }
      if (btnRow) {
        btnRow.innerHTML = `
          <button class="btn btn-success" onclick="acceptRoleCounterProposal('${esc(data.clubName)}', ${JSON.stringify(cp).replace(/"/g, '&quot;')})" style="flex:1;font-weight:900;padding:12px;">
            ${svgIcon('handshake', 14)}  ACCEPT BOARD COMPROMISE &amp; RATIFY PACT
          </button>
          <button class="btn btn-secondary" onclick="renderManagerRoleNegotiationModalUI(${JSON.stringify(c).replace(/"/g, '&quot;')}, ${JSON.stringify(mc).replace(/"/g, '&quot;')})" style="flex:1;">
            ${svgIcon('refresh', 14)}  ADJUST DEMANDS &amp; RE-SUBMIT
          </button>
        `;
      }
      return;
    }

    playSfx('kick');
    const dlg = document.getElementById('roleDialogueBox');
    if (dlg) {
      dlg.innerHTML = `<b style="color:#ff4757;">Board Chairman:</b> "${r.message}"`;
    }
    if (btnRow) {
      btnRow.innerHTML = `
        <button class="btn btn-warning" onclick="renderManagerRoleNegotiationModalUI(${JSON.stringify(c).replace(/"/g, '&quot;')}, ${JSON.stringify(mc).replace(/"/g, '&quot;')})" style="flex:1;font-weight:800;color:#0a0f18;">
          ${svgIcon('pen', 14)} ️ SOFTEN DEMANDS &amp; TRY AGAIN
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('managerRoleNegotiationModal').remove()">
          WALK AWAY
        </button>
      `;
    }
  }).catch(err => {
    alert(err.message || 'Negotiation failed.');
    renderManagerRoleNegotiationModalUI(c, mc);
  });
}

function acceptRoleCounterProposal(clubName, counterDemands) {
  const data = currentNegotiatingRoleData;
  if (!data) return;

  post('/api/world4/manager/negotiate-role', ref({
    club: clubName,
    isNewJob: data.isNewJob,
    offerId: data.offerId,
    demands: counterDemands,
    managerName: data.candidateName
  })).then(res => {
    playSfx('deal');
    playSfx('applause');
    S = res.state || S;
    if (data.isNewJob) {
      if (!session) session = {};
      session.managerName = data.candidateName;
      session.userRole = 'manager';
      save();
    }
    document.getElementById('managerRoleNegotiationModal')?.remove();
    document.getElementById('managerOfficeModal')?.remove();
    alert(`${svgIcon('party', 14)}  CONTRACT RATIFIED ON COMPROMISE TERMS!\n\n${res.result?.message || 'New contract signed!'}`);
    renderGame();
  }).catch(err => alert(err.message || 'Error ratifying compromise.'));
}

function closeScoreHeroModal() {
  if (activeKeyMomentsSession?.animId) {
    cancelAnimationFrame(activeKeyMomentsSession.animId);
  }
  document.getElementById('scoreHeroModal')?.remove();
  activeKeyMomentsSession = null;
}

function resetCurrentScoreHeroLevel() {
  const ses = activeKeyMomentsSession;
  if (!ses) return;
  if (ses.animId) cancelAnimationFrame(ses.animId);
  ses.currentPhase = 0;
  renderScoreHeroModalHtml();
}

function rewindCurrentScoreHeroPhase() {
  resetCurrentScoreHeroLevel();
}

function skipScoreHeroPhase() {
  const ses = activeKeyMomentsSession;
  if (!ses) return;
  const currentScn = ses.scenarios[ses.chanceIndex];
  if (ses.currentPhase + 1 < currentScn.phases.length) {
    ses.currentPhase++;
    renderScoreHeroModalHtml();
  } else if (ses.chanceIndex + 1 < ses.totalChances) {
    ses.chanceIndex++;
    ses.currentPhase = 0;
    renderScoreHeroModalHtml();
  } else {
    renderScoreHeroFinalSummary();
  }
}

// Cubic Bézier Curve helper for silky-smooth Score! Hero trajectory
function getSmoothCurvePoints(rawPoints, segments = 30) {
  if (rawPoints.length < 3) return rawPoints;
  const smooth = [];
  for (let i = 0; i < rawPoints.length - 1; i++) {
    const p0 = i > 0 ? rawPoints[i - 1] : rawPoints[i];
    const p1 = rawPoints[i];
    const p2 = rawPoints[i + 1];
    const p3 = i < rawPoints.length - 2 ? rawPoints[i + 2] : p2;
    for (let t = 0; t < 1; t += 1 / segments) {
      const t2 = t * t;
      const t3 = t2 * t;
      const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
      const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
      smooth.push({ x, y });
    }
  }
  smooth.push(rawPoints[rawPoints.length - 1]);
  return smooth;
}

function initScoreHeroCanvas() {
  const canvas = document.getElementById('scoreHeroCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const ses = activeKeyMomentsSession;
  if (!ses) return;

  const currentScn = ses.scenarios[ses.chanceIndex];
  const phase = currentScn.phases[ses.currentPhase];

  let isDrawing = false;
  let rawDrawnPoints = [];
  let smoothTrajectory = [];
  let ballAnimating = false;
  let ballProgress = 0;
  let ballCurrentPos = { x: phase.ballPos.x, y: phase.ballPos.y, height: 0 };
  let chanceResolved = false;
  let netRippleEffect = 0;

  // Active actors
  const actor = { ...phase.actor };
  const targetTeammate = phase.targetTeammate ? { ...phase.targetTeammate } : null;
  const defenders = (phase.defenders || []).map(d => ({ ...d }));
  const gk = phase.gk ? { ...phase.gk, currentX: phase.gk.x, diveProgress: 0 } : { x: 320, y: 58, currentX: 320, r: 16, diveProgress: 0 };
  const goal = phase.goal || { left: 230, right: 410, y: 48 };

  // Score! Hero target corners (sweet spots)
  const targetCorners = [
    { name: 'TOP LEFT', x: goal.left + 25, y: goal.y + 10, r: 18 },
    { name: 'TOP RIGHT', x: goal.right - 25, y: goal.y + 10, r: 18 },
    { name: 'BOTTOM CORNER', x: goal.left + 25, y: goal.y + 32, r: 16 }
  ];

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function handleStart(e) {
    if (ballAnimating || chanceResolved) return;
    const pos = getCanvasPos(e);
    // Allow start near active ball carrier actor
    const dist = Math.hypot(pos.x - actor.x, pos.y - actor.y);
    if (dist < 65) {
      isDrawing = true;
      rawDrawnPoints = [{ x: actor.x, y: actor.y }, { x: pos.x, y: pos.y }];
      smoothTrajectory = rawDrawnPoints;
    }
  }

  function handleMove(e) {
    if (!isDrawing || ballAnimating || chanceResolved) return;
    const pos = getCanvasPos(e);
    const last = rawDrawnPoints[rawDrawnPoints.length - 1];
    if (!last || Math.hypot(pos.x - last.x, pos.y - last.y) > 8) {
      rawDrawnPoints.push(pos);
      smoothTrajectory = getSmoothCurvePoints(rawDrawnPoints, 6);
    }
  }

  function handleEnd() {
    if (!isDrawing || ballAnimating || chanceResolved) return;
    isDrawing = false;

    if (smoothTrajectory.length < 8) {
      rawDrawnPoints = [];
      smoothTrajectory = [];
      return;
    }

    // Launch Score! Hero ball flight
    ballAnimating = true;
    ballProgress = 0;
    playSfx('kick');
  }

  canvas.onmousedown = handleStart;
  window.onmousemove = handleMove;
  window.onmouseup = handleEnd;

  canvas.ontouchstart = (e) => { e.preventDefault(); handleStart(e); };
  window.ontouchmove = (e) => { if (isDrawing) e.preventDefault(); handleMove(e); };
  window.ontouchend = handleEnd;

  // Main Canvas Render Loop
  function loop() {
    // 1. Draw Vibrant Emerald Turf with Mower Stripes
    ctx.fillStyle = '#144128';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
    for (let y = 0; y < canvas.height; y += 42) {
      if ((y / 42) % 2 === 0) ctx.fillRect(0, y, canvas.width, 42);
    }

    // Chalk Field Markings
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.lineWidth = 2.5;

    // Penalty Area
    ctx.strokeRect(150, 48, 400, 245);
    // 6-Yard Box
    ctx.strokeRect(230, 48, 240, 80);
    // Penalty Spot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(350, 195, 3.5, 0, Math.PI * 2);
    ctx.fill();
    // Penalty Arc
    ctx.beginPath();
    ctx.arc(350, 195, 58, 0.23 * Math.PI, 0.77 * Math.PI, false);
    ctx.stroke();

    // 3D Goal Frame & Net Mesh
    const netYOffset = Math.sin(netRippleEffect) * 6;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(goal.left, 10, goal.right - goal.left, 38 + netYOffset);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    for (let gx = goal.left; gx <= goal.right; gx += 12) {
      ctx.beginPath(); ctx.moveTo(gx, 10); ctx.lineTo(gx, 48 + netYOffset); ctx.stroke();
    }
    for (let gy = 10; gy <= 48; gy += 8) {
      ctx.beginPath(); ctx.moveTo(goal.left, gy); ctx.lineTo(goal.right, gy); ctx.stroke();
    }

    // Heavy Goalposts & Crossbar
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.strokeRect(goal.left, 45, goal.right - goal.left, 6);

    // Goal Target Sweet-Spot Rings (Score! Hero Top Bins indicators)
    if (phase.isFinalShot && !chanceResolved) {
      targetCorners.forEach(tc => {
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(tc.x, tc.y, tc.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
        ctx.fill();
      });
    }

    // 2. Animate Teammate Movement Run
    if (targetTeammate && targetTeammate.runTarget && !chanceResolved) {
      targetTeammate.x += (targetTeammate.runTarget.x - targetTeammate.x) * 0.025;
      targetTeammate.y += (targetTeammate.runTarget.y - targetTeammate.y) * 0.025;
    }

    // 3. Draw Players
    // Goalkeeper
    if (phase.isFinalShot) {
      ctx.save();
      ctx.translate(gk.currentX, gk.y);
      if (gk.diveProgress > 0) {
        ctx.rotate((gk.diveTargetX > gk.x ? 0.35 : -0.35) * Math.sin(gk.diveProgress * Math.PI));
      }
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GK', 0, 3);
      ctx.restore();
    }

    // Opponent Defenders
    defenders.forEach(def => {
      ctx.fillStyle = ses.oppColor;
      ctx.beginPath();
      ctx.arc(def.x, def.y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    });

    // Target Teammate (If receiving pass)
    if (targetTeammate) {
      // Pulsing Receiving Ring
      const recvPulse = 22 + Math.sin(Date.now() * 0.01) * 3;
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(targetTeammate.x, targetTeammate.y, recvPulse, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = ses.clubColor;
      ctx.beginPath();
      ctx.arc(targetTeammate.x, targetTeammate.y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(targetTeammate.number, targetTeammate.x, targetTeammate.y + 3);

      // Name Tag over teammate
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText(targetTeammate.name, targetTeammate.x, targetTeammate.y - 18);
    }

    // Active Ball Carrier Actor
    const pulseRing = 18 + Math.sin(Date.now() * 0.008) * 4;
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(actor.x, actor.y, pulseRing, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = ses.clubColor;
    ctx.beginPath();
    ctx.arc(actor.x, actor.y, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(actor.number, actor.x, actor.y + 4);

    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 9.5px sans-serif';
    ctx.fillText(actor.name, actor.x, actor.y - 19);

    // 4. Draw Score! Hero Curved Trajectory with Glowing Bézier Line
    if (smoothTrajectory.length > 1) {
      ctx.save();
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 14;
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 3.8;
      ctx.setLineDash([8, 6]);
      ctx.lineDashOffset = -Date.now() * 0.02;

      ctx.beginPath();
      ctx.moveTo(smoothTrajectory[0].x, smoothTrajectory[0].y);
      for (let i = 1; i < smoothTrajectory.length; i++) {
        ctx.lineTo(smoothTrajectory[i].x, smoothTrajectory[i].y);
      }
      ctx.stroke();

      // Trajectory Arrowhead
      const lastPt = smoothTrajectory[smoothTrajectory.length - 1];
      const prevPt = smoothTrajectory[Math.max(0, smoothTrajectory.length - 4)];
      const tipAngle = Math.atan2(lastPt.y - prevPt.y, lastPt.x - prevPt.x);
      const arrowLen = 15;

      ctx.setLineDash([]);
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(lastPt.x, lastPt.y);
      ctx.lineTo(lastPt.x - arrowLen * Math.cos(tipAngle - Math.PI / 6), lastPt.y - arrowLen * Math.sin(tipAngle - Math.PI / 6));
      ctx.lineTo(lastPt.x - arrowLen * Math.cos(tipAngle + Math.PI / 6), lastPt.y - arrowLen * Math.sin(tipAngle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 5. Ball Flight Physics along Bézier Path
    if (ballAnimating && smoothTrajectory.length > 0) {
      ballProgress += 0.028;
      const totalPts = smoothTrajectory.length;
      const ptIdx = Math.min(totalPts - 1, Math.floor(ballProgress * totalPts));
      const curPt = smoothTrajectory[ptIdx] || smoothTrajectory[totalPts - 1];

      // 3D Parabolic elevation arc
      const arcHeight = Math.sin(ballProgress * Math.PI) * 32;
      ballCurrentPos.x = curPt.x;
      ballCurrentPos.y = curPt.y;
      ballCurrentPos.height = arcHeight;

      // Goalkeeper dive towards shot
      if (phase.isFinalShot) {
        const lastPt = smoothTrajectory[smoothTrajectory.length - 1];
        gk.diveTargetX = Math.max(goal.left + 20, Math.min(goal.right - 20, lastPt.x));
        gk.currentX += (gk.diveTargetX - gk.currentX) * 0.14;
        gk.diveProgress = ballProgress;
      }

      // Out of bounds check
      if ((curPt.x < 10 || curPt.x > canvas.width - 10 || curPt.y < 10 || curPt.y > canvas.height - 10) && !chanceResolved) {
        triggerScoreHeroReset(`${svgIcon('wind', 14)}  OUT OF PLAY!`, 'Ball curved out of the pitch!');
      }

      // Check Defender Interception
      defenders.forEach(def => {
        const dist = Math.hypot(ballCurrentPos.x - def.x, ballCurrentPos.y - def.y);
        if (dist < 18 && ballCurrentPos.height < 14 && !chanceResolved) {
          triggerScoreHeroReset(`${svgIcon('shield', 14)}  INTERCEPTED!`, 'Opponent defender cut out the curve!');
        }
      });

      // Flight Completion Check
      if (ballProgress >= 1.0 && !chanceResolved) {
        ballAnimating = false;
        const endPos = smoothTrajectory[smoothTrajectory.length - 1];

        if (!phase.isFinalShot && targetTeammate) {
          // Teammate pass reception check
          const distToTeammate = Math.hypot(endPos.x - targetTeammate.x, endPos.y - targetTeammate.y);
          if (distToTeammate < 55) {
            chanceResolved = true;
            showShFeedback(`${svgIcon('boot', 14)}  BEAUTIFUL PASS!`, 'Teammate controls on the move!');
            playSfx('kick');
            ses.starsEarned++;
            setTimeout(() => {
              ses.currentPhase++;
              renderScoreHeroModalHtml();
            }, 1100);
          } else {
            triggerScoreHeroReset(`${svgIcon('wind', 14)}  MISSED PASS!`, 'Pass sailed out of reach of teammate!');
          }
        } else if (phase.isFinalShot) {
          // Final Shot on Goal!
          const inGoalWidth = endPos.x >= goal.left + 8 && endPos.x <= goal.right - 8;
          const inGoalDepth = endPos.y <= goal.y + 12;
          const distToGk = Math.hypot(endPos.x - gk.currentX, endPos.y - gk.y);

          if (inGoalWidth && inGoalDepth && distToGk > 26) {
            // GOAL!!
            chanceResolved = true;
            netRippleEffect = 10;
            ses.goalsScored++;
            ses.starsEarned += 2;

            const scoreBox = document.getElementById('shScoreBox');
            if (scoreBox) {
              scoreBox.textContent = `${ses.goalsScored} - 0`;
              scoreBox.style.transform = 'scale(1.25)';
              setTimeout(() => { scoreBox.style.transform = 'scale(1)'; }, 400);
            }

            showShFeedback(`${svgIcon('ball', 14)}  GOOOOOOOAL!!`, 'Stunning curling finish into the corner!');
            playSfx('goal');
            playSfx('applause');

            setTimeout(() => {
              if (ses.chanceIndex + 1 < ses.totalChances) {
                ses.chanceIndex++;
                ses.currentPhase = 0;
                renderScoreHeroModalHtml();
              } else {
                renderScoreHeroFinalSummary();
              }
            }, 2300);
          } else if (inGoalWidth && inGoalDepth && distToGk <= 26) {
            triggerScoreHeroReset(`${svgIcon('glove', 14)}  LEAPING SAVE!`, 'Keeper tips it wide at full stretch!');
          } else {
            triggerScoreHeroReset(`${svgIcon('wind', 14)}  OFF TARGET!`, 'Shot missed the goal frame!');
          }
        }
      }
    }

    if (netRippleEffect > 0) netRippleEffect -= 0.5;

    // 6. Draw Ball with 3D Ground Shadow & Rotation
    const bx = ballCurrentPos.x;
    const by = ballCurrentPos.y;
    const bh = ballCurrentPos.height || 0;

    // Ground Shadow (Directly on grass)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.beginPath();
    ctx.ellipse(bx, by, Math.max(3, 8 - bh * 0.12), Math.max(2, 5 - bh * 0.08), 0, 0, Math.PI * 2);
    ctx.fill();

    // 3D Elevated Ball
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(bx, by - bh, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Classic Ball Pentagon Pattern
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(bx, by - bh, 3, 0, Math.PI * 2);
    ctx.fill();

    ses.animId = requestAnimationFrame(loop);
  }

  let autoResetTimer = null;

  function triggerScoreHeroReset(mainTitle, subTitle) {
    if (chanceResolved && autoResetTimer) return;
    chanceResolved = true;
    ballAnimating = false;
    playSfx('whistle');

    showShFeedback(mainTitle, subTitle + ' Resetting level...', true);

    const promptEl = document.getElementById('shDrawingPrompt');
    if (promptEl) {
      promptEl.style.borderColor = '#ef4444';
      promptEl.style.color = '#fca5a5';
      promptEl.style.background = 'rgba(239, 68, 68, 0.22)';
      promptEl.style.boxShadow = '0 0 20px rgba(239, 68, 68, 0.6)';
      promptEl.innerHTML = `${svgIcon('refresh', 13, '#fca5a5')}  <span style="font-weight:900;">${mainTitle} — RESETTING LEVEL...</span>`;
    }

    if (autoResetTimer) clearTimeout(autoResetTimer);
    autoResetTimer = setTimeout(() => {
      autoResetTimer = null;
      if (activeKeyMomentsSession) {
        activeKeyMomentsSession.currentPhase = 0;
        renderScoreHeroModalHtml();
      }
    }, 1300);
  }

  function showShFeedback(main, sub, isFailure = false) {
    const overlayEl = document.getElementById('shFeedbackOverlay');
    const mainEl = document.getElementById('shFeedbackText');
    const subEl = document.getElementById('shFeedbackSub');
    if (overlayEl && mainEl && subEl) {
      mainEl.innerHTML = replaceEmojisWithSvg(main, 20);
      subEl.innerHTML = replaceEmojisWithSvg(sub, 13);
      if (isFailure) {
        mainEl.style.color = '#ef4444';
        mainEl.style.textShadow = '0 0 25px rgba(239,68,68,0.95), 0 4px 10px #000';
      } else {
        mainEl.style.color = 'var(--accent-gold)';
        mainEl.style.textShadow = '0 0 25px rgba(245,158,11,0.95), 0 4px 10px #000';
      }
      overlayEl.style.opacity = '1';
      overlayEl.style.transform = 'translate(-50%, -50%) scale(1.1)';
      setTimeout(() => {
        overlayEl.style.opacity = '0';
        overlayEl.style.transform = 'translate(-50%, -50%) scale(0.8)';
      }, 1600);
    }
  }

  ses.animId = requestAnimationFrame(loop);
}

function submitSoccerChampsMatchdayResult() {
  const ses = activeKeyMomentsSession;

    goalsScored: ses.goalsScored,
    chancesPlayed: ses.totalChances
  })).then(res => {
    closeScoreHeroModal();
    S = res.state || S;
    const r = res.result;
    if (r?.matchResult) {
      openMatchModal(r.matchResult);
    } else {

    }
    renderGame();
  }).catch(err => {
    alert(err.message || 'Error recording match result.');

function hireScoutFromUI(scoutId) {
  post('/api/world4/youth/hire-scout', ref({ club: S.selectedClub, scoutId })).then(res => {
    if (res.error) return alert(res.error);
    S = res.state || S;
    alert(res.result?.message || 'Scout appointed!');
    openYouthScoutWonderkidModal();
    renderGame();
  }).catch(err => alert(err.message || 'Error hiring scout.'));
}

function dispatchExpeditionFromUI(scoutId, region) {
  post('/api/world4/youth/dispatch', ref({ club: S.selectedClub, scoutId, region })).then(res => {
    if (res.error) return alert(res.error);
    S = res.state || S;
    alert(res.result?.message || 'Expedition completed!');
    openYouthScoutWonderkidModal();
    renderGame();
  }).catch(err => alert(err.message || 'Error dispatching expedition.'));
}

function signWonderkidFromUI(wonderkidId, destination) {
  post('/api/world4/youth/sign', ref({ club: S.selectedClub, wonderkidId, destination })).then(res => {
    if (res.error) return alert(res.error);
    S = res.state || S;
    alert(res.result?.message || 'Wonderkid signed!');
    openYouthScoutWonderkidModal();
    renderGame();
  }).catch(err => alert(err.message || 'Error signing wonderkid.'));
}

function promoteAcademyWonderkidFromUI(academyPlayerId) {
  post('/api/world4/youth/promote', ref({ club: S.selectedClub, academyPlayerId })).then(res => {
    if (res.error) return alert(res.error);
    S = res.state || S;
    alert(res.result?.message || 'Promoted to first team squad!');
    openYouthScoutWonderkidModal();
    renderGame();
  }).catch(err => alert(err.message || 'Error promoting player.'));
}

function signOwnershipDeed() {
  const signActionBox = document.getElementById('signActionBox');
  const sigLine = document.getElementById('sigLine');
  const stage = document.getElementById('signatureStage');
  if (!signActionBox || !sigLine) return;

  signActionBox.innerHTML = `<span style="font-size:12.5px;color:#8b6b3e;font-weight:700;">Executing Deed...</span>`;
  playSfx('pen');

  // Trigger Signature Path Drawing Animation
  sigLine.style.animation = 'inkDraw 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards';

  // Drop Wax Seal after signature completes
  setTimeout(() => {
    playSfx('stamp');
    document.getElementById('ownershipCinematicModal')?.classList.add('screen-shake');
    setTimeout(() => document.getElementById('ownershipCinematicModal')?.classList.remove('screen-shake'), 400);

    const waxStamp = document.createElement('div');
    waxStamp.className = 'wax-seal-stamp';
    waxStamp.innerHTML = `
      <div style="font-size:8px;letter-spacing:0.12em;opacity:0.8;">OFFICIAL DEED</div>
      <div style="font-size:11px;margin:2px 0;">EXECUTED</div>
      <div style="font-size:7px;opacity:0.8;">100% CONFERRED</div>
    `;
    stage.appendChild(waxStamp);
    playSfx('deal');

    // Chairman congratulates and transitions to Crest & Kit Studio on the desk
    setTimeout(() => {
      renderClubIdentityStudio();
    }, 1200);
  }, 1100);
}

function applyPresetClub(indexStr) {
  if (indexStr === '' || !AUTHENTIC_PRESETS[+indexStr]) return;
  const p = AUTHENTIC_PRESETS[+indexStr];
  cinematicState.name = p.name;
  cinematicState.country = p.country;
  cinematicState.division = 3; // Enforce Division 3 entry point for all clubs!
  cinematicState.home = p.home;
  cinematicState.away = p.away;
  cinematicState.third = p.third;
  cinematicState.crest = p.crest;
  cinematicState.pattern = p.pattern;
  renderClubIdentityStudio();
}

function liveUpdateDeedJersey() {
  const container = document.getElementById('deedJerseyContainer');
  const crestBadge = document.getElementById('deedCrestBadge');
  const namePreview = document.getElementById('deedClubNamePreview');

  const name = document.getElementById('newClubName')?.value || cinematicState.name;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;

  if (crestBadge) crestBadge.innerHTML = renderCrest(cinematicState.crest, 36);
  if (namePreview) namePreview.innerText = name;

  if (container) {
    container.innerHTML = generateJerseySVG({
      home,
      away,
      collar: away,
      pattern
    }, name, 'EMIRATES');
  }
}

function submitNewClubFromStudio() {
  const name = document.getElementById('newClubName')?.value.trim() || cinematicState.name;
  if (!name) return alert('Please enter a club name');
  const country = document.getElementById('newCountry')?.value || cinematicState.country;
  const division = 3; // Enforce Division 3 starting tier!
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const third = document.getElementById('newThirdColor')?.value || cinematicState.third;

  post('/api/world4/club/create', ref({
    name,
    country,
    division,
    pattern,
    home,
    away,
    third,
    crest: cinematicState.crest,
    quality: 75
  })).then(data => {
    playSfx('applause');
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function switchTab(t, sub = null) {
  if (t === 'wonderkids' || t === 'youth_academy' || t === 'academy') {
    openYouthScoutWonderkidModal();
    return;
  }
  if (t === 'national' || t === 'international') {
    openNationalTeamModal();
    return;
  }
  if (['pitch', 'squad', 'setpieces', 'chemistry', 'youth', 'roster', 'tactics', 'medical', 'loans'].includes(t)) {
    currentTab = 'squad';
    subTabs.squad = t === 'squad' ? 'roster' : t;
  } else if (['transfers', 'scouting', 'bids', 'market', 'deadline', 'contracts', 'swap'].includes(t)) {
    currentTab = 'transfers';
    subTabs.transfers = t === 'scouting' ? 'scout' : (sub || t);
  } else if (['league', 'tournament', 'awards', 'competitions', 'ucl', 'europa', 'cup', 'playoffs', 'preseason', 'hall_of_fame'].includes(t)) {
    currentTab = 'competitions';
    subTabs.competitions = t === 'tournament' ? 'global_cup' : (['ucl', 'europa', 'cup', 'playoffs', 'awards', 'trophies', 'preseason', 'hall_of_fame'].includes(t) ? t : (sub || 'ucl'));
  } else if (['stadium', 'facilities', 'sponsors', 'ffp', 'staff', 'managers', 'manager', 'trophies', 'kit', 'club', 'takeovers'].includes(t)) {
    currentTab = 'club';
    subTabs.club = t === 'managers' ? 'manager' : (t === 'club' ? 'stadium' : t);
  } else {
    currentTab = t;
  }
  if (sub) {
    if (currentTab === 'matchday') subTabs.matchday = sub;
    if (currentTab === 'squad') subTabs.squad = sub;
    if (currentTab === 'transfers') subTabs.transfers = sub;
    if (currentTab === 'competitions') subTabs.competitions = sub;
    if (currentTab === 'club') subTabs.club = sub;
  }
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  renderGame();
}

function renderTabContent() {
  const container = document.getElementById('gameContent');
  if (!container) return;

  switch (currentTab) {
    case 'matchday': return renderMatchday(container);
    case 'home': return renderDashboard(container);
    case 'squad': return renderSquadSection(container);
    case 'transfers': return renderTransfersSection(container);
    case 'competitions': return renderCompetitionsSection(container);
    case 'club': return renderClubFinanceSection(container);
    // Legacy direct fallbacks
    case 'pitch': return renderTacticalPitch(container);
    case 'scouting': return renderScoutingAndAcademy(container);
    case 'managers': return renderManagerMarket(container);
    case 'stadium': return renderStadiumEconomy(container);
    case 'kit': return renderKitStudio(container);
    case 'league': return renderLeagueStandings(container);
    case 'news': return renderNewsFeed(container);
    case 'awards': return renderAwardsGala(container);
    case 'tournament': return renderGlobalTournament(container);
    default: return renderMatchday(container);
  }
}
