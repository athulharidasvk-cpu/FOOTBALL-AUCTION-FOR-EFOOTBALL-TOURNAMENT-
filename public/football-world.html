<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Football World - Ultimate Club Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d18;
      --bg-card: #0d1728;
      --bg-card-hover: #122038;
      --bg-card-subtle: #0a1322;
      --border-subtle: #1a2c47;
      --border-accent: #2c4a75;
      --pitch-grass: #164024;
      --pitch-stripe: #12361e;
      --pitch-lines: rgba(255, 255, 255, 0.45);
      --accent-neon: #00e599;
      --accent-blue: #2a8bf2;
      --accent-gold: #ffb830;
      --text-main: #f0f6fc;
      --text-muted: #8b9eb5;
      --text-dim: #5c708a;
      --danger: #ff4757;
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; outline: none; }
    button { cursor: pointer; border: 0; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    button:active { transform: scale(0.98); }
    
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -10%, #152744 0%, #080f1e 50%, #040810 100%);
    }

    /* Top HUD Navigation */
    .hud-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 17, 31, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .club-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .crest-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.25);
      flex-shrink: 0;
    }
    .club-title {
      display: flex;
      flex-direction: column;
    }
    .club-title h1 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.15;
    }
    .club-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .pill {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-div { background: rgba(42, 139, 242, 0.2); color: #6db4ff; border: 1px solid rgba(42, 139, 242, 0.4); }
    .pill-season { background: rgba(0, 229, 153, 0.15); color: var(--accent-neon); border: 1px solid rgba(0, 229, 153, 0.35); }
    .pill-manager { background: rgba(255, 184, 48, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 184, 48, 0.35); }
    
    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 6px 14px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }
    .hud-stat .label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-dim); text-transform: uppercase; }
    .hud-stat .value { font-family: var(--font-display); font-size: 17px; font-weight: 800; color: #fff; }
    .hud-stat .value.cash { color: var(--accent-neon); }

    .nav-tabs {
      background: #091322;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      padding: 0 24px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 14px 18px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent-blue);
      background: rgba(42, 139, 242, 0.1);
    }

    /* Main Container */
    .game-body {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Tactical Football Pitch */
    .pitch-container {
      background: linear-gradient(135deg, var(--pitch-grass) 0%, var(--pitch-stripe) 100%);
      border: 2px solid #235c34;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 0 100px rgba(0,0,0,0.4);
      padding: 30px 20px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pitch-lines {
      position: absolute;
      inset: 12px;
      border: 2px solid var(--pitch-lines);
      border-radius: 12px;
      pointer-events: none;
    }
    .pitch-halfway {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--pitch-lines);
      transform: translateY(-50%);
    }
    .pitch-center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      border: 2px solid var(--pitch-lines);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .pitch-penalty-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-top: none;
      border-radius: 0 0 10px 10px;
    }
    .pitch-penalty-bottom {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 80px;
      border: 2px solid var(--pitch-lines);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }

    /* Pitch Player Nodes */
    .pitch-line {
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 4px 0;
    }
    .pitch-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .pitch-player:hover { transform: scale(1.1); z-index: 20; }
    .player-jersey-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #112239;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      position: relative;
    }
    .player-ovr-tag {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .ovr-elite { color: #00e599; border-color: #00e599; }
    .ovr-gold { color: #ffb830; border-color: #ffb830; }
    .ovr-silver { color: #a1c4fd; border-color: #a1c4fd; }
    
    .player-name-plate {
      margin-top: 6px;
      background: rgba(6, 13, 24, 0.88);
      backdrop-filter: blur(8px);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .pos-label {
      font-size: 9px;
      font-weight: 800;
      color: #ffca3a;
      text-transform: uppercase;
    }

    /* Cards & Grids */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; }
    .col-5 { grid-column: span 5; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

    .game-card {
      background: linear-gradient(165deg, var(--bg-card) 0%, var(--bg-card-subtle) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .card-header h2 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1282e8 0%, #0b5fb0 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(18, 130, 232, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2293fa 0%, #106fcc 100%);
      box-shadow: 0 6px 20px rgba(18, 130, 232, 0.6);
    }
    .btn-success {
      background: linear-gradient(135deg, #00d287 0%, #00a669 100%);
      color: #032112;
      box-shadow: 0 4px 14px rgba(0, 210, 135, 0.35);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #05ea97 0%, #00bf79 100%);
    }
    .btn-secondary {
      background: #13243c;
      color: #d1e2f7;
      border: 1px solid var(--border-accent);
    }
    .btn-secondary:hover {
      background: #1a3254;
      color: #fff;
    }
    .btn-danger {
      background: rgba(255, 71, 87, 0.15);
      color: #ff6b7a;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 6px 12px; font-size: 11.5px; border-radius: 7px; }

    /* Forms & Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-control {
      background: #091322;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13.5px;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent-blue);
      background: #0d1b30;
    }

    /* Roster & Table Styles */
    .roster-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }
    .roster-table th {
      padding: 8px 14px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
    }
    .roster-row {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      transition: transform 0.15s, background 0.15s;
    }
    .roster-row td {
      padding: 12px 14px;
      font-size: 13px;
    }
    .roster-row td:first-child { border-radius: 10px 0 0 10px; }
    .roster-row td:last-child { border-radius: 0 10px 10px 0; }
    .roster-row:hover {
      background: var(--bg-card-hover);
      transform: translateX(3px);
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pos-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: #172d47;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .pos-badge.att { background: #5c1825; color: #ff7b92; border-color: #ff7b92; }
    .pos-badge.mid { background: #1c4228; color: #73e69b; border-color: #73e69b; }
    .pos-badge.def { background: #183354; color: #76b6ff; border-color: #76b6ff; }
    .pos-badge.gk { background: #4f3b14; color: #ffd166; border-color: #ffd166; }

    /* Jersey Studio */
    .kit-preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle, #162640 0%, #091322 100%);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      width: min(540px, 100%);
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      position: relative;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
      .hud-metrics { display: none; }
      .game-body { padding: 16px; }
    }

    /* ============================================================
       ANIMATIONS & CINEMATIC SUITE
       ============================================================ */
    @keyframes penGlide {
      0% { transform: translate(-20px, -40px) rotate(-15deg); opacity: 0; }
      20% { opacity: 1; }
      85% { transform: translate(140px, 8px) rotate(-5deg); opacity: 1; }
      100% { transform: translate(160px, -15px) rotate(0deg); opacity: 0; }
    }
    @keyframes inkDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes stampDrop {
      0% { transform: scale(3) rotate(-25deg); opacity: 0; }
      70% { transform: scale(0.95) rotate(-5deg); opacity: 1; }
      85% { transform: scale(1.05) rotate(-8deg); }
      100% { transform: scale(1) rotate(-8deg); opacity: 0.95; }
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -1px); }
    }
    @keyframes flashBurst {
      0% { opacity: 0; }
      15% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(520px) rotate(720deg); opacity: 0; }
    }
    @keyframes searchlightSweep {
      0% { transform: rotate(-35deg); }
      50% { transform: rotate(35deg); }
      100% { transform: rotate(-35deg); }
    }
    @keyframes charBreathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes charTalk {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.92); }
    }
    @keyframes agentShakeHead {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    @keyframes agentNodHead {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes pulseCrisis {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255, 71, 87, 0); }
    }

    /* First-Person Penthouse Boardroom Stage */
    .pov-boardroom {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #030712;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      perspective: 1200px;
    }
    .pov-skyline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: radial-gradient(ellipse at 50% 20%, #152c4e 0%, #081224 60%, #030712 100%);
      overflow: hidden;
      pointer-events: none;
    }
    .stadium-lights-glow {
      position: absolute;
      bottom: 12%;
      left: 10%;
      right: 10%;
      height: 90px;
      background: radial-gradient(ellipse at 50% 100%, rgba(80, 165, 255, 0.35) 0%, rgba(0, 229, 153, 0.15) 50%, transparent 80%);
      filter: blur(20px);
    }
    .stadium-searchlight {
      position: absolute;
      bottom: 20%;
      width: 140px;
      height: 380px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.2), transparent 90%);
      clip-path: polygon(45% 100%, 55% 100%, 100% 0%, 0% 0%);
      transform-origin: bottom center;
      filter: blur(4px);
    }
    .pov-desk {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52%;
      background: linear-gradient(180deg, #1b120c 0%, #0f0a06 40%, #080503 100%);
      border-top: 4px solid #3d2616;
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 30px;
      z-index: 10;
      overflow-y: auto;
    }
    .desk-hands {
      position: absolute;
      bottom: -15px;
      left: 0;
      right: 0;
      height: 90px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 0 10%;
    }
    .hand-cuff {
      width: 130px;
      height: 70px;
      background: linear-gradient(135deg, #121e33 0%, #080d17 100%);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .hand-watch {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #e5b958;
      box-shadow: 0 0 8px rgba(229, 185, 88, 0.4);
    }
    .chairman-container {
      position: absolute;
      bottom: 44%;
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, 90vw);
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 5;
      animation: charBreathe 4s ease-in-out infinite;
    }
    .cinematic-hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(780px, 94vw);
      z-index: 30;
    }
    .cinematic-dialogue-card {
      background: rgba(13, 23, 40, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-accent);
      border-radius: 18px;
      padding: 24px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
    }

    /* Contract Parchment Document */
    .parchment-doc {
      background: #fdfbf7;
      color: #1a1a1a;
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 0 40px rgba(212, 175, 55, 0.15);
      border: 2px solid #d4af37;
      font-family: 'Times New Roman', Georgia, serif;
      position: relative;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .parchment-header {
      text-align: center;
      border-bottom: 2px double #8a6d25;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .parchment-header h2 {
      font-size: 20px;
      letter-spacing: 0.08em;
      color: #2b1f07;
      text-transform: uppercase;
      font-weight: 700;
    }

const money = n => Number(n || 0).toLocaleString('en-IN');

function save() { localStorage.setItem('fw4', JSON.stringify(session)); }

// Web Audio synthesizer for atmospheric animations
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSfx(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if (type === 'pen') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(540, now + 0.12);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'stamp') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.28);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'flash') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.04);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'deal' || type === 'applause') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.1, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.35);
      });
    } else if (type === 'crisis') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(95, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.4);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.45);
    }
  } catch(e) {}
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(async res => {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  });
}

function ref(extra = {}) {
  return Object.assign({}, extra,
    session?.roomCode ? { room: session.roomCode } : {},
    session?.soloId ? { soloId: session.soloId } : {},
    session?.managerId ? { managerId: session.managerId } : {}
  );
}

function refresh() {
  const q = session?.roomCode ? `?room=${session.roomCode}` : `?soloId=${session.soloId}`;
  fetch('/api/world4/state' + q)
    .then(r => r.json())
    .then(data => {
      S = data;
      renderGame();
    })
    .catch(err => console.error('[State Error]', err));
}

socket.on('world4:session', d => {
  session = { ...session, ...d };
  save();
  S = d.state;
  renderGame();
});
socket.on('world4:state', d => { S = d; renderGame(); });
socket.on('world4:error', e => alert(e.error || 'World error'));

function signOwnershipDeed() {
  const signActionBox = document.getElementById('signActionBox');
  const sigLine = document.getElementById('sigLine');
  const stage = document.getElementById('signatureStage');
  if (!signActionBox || !sigLine) return;

  signActionBox.innerHTML = `<span style="font-size:12.5px;color:#8b6b3e;font-weight:700;">Executing Deed...</span>`;
  playSfx('pen');

  // Trigger Signature Path Drawing Animation
  sigLine.style.animation = 'inkDraw 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards';

  // Drop Wax Seal after signature completes
  setTimeout(() => {
    playSfx('stamp');
    document.getElementById('ownershipCinematicModal')?.classList.add('screen-shake');
    setTimeout(() => document.getElementById('ownershipCinematicModal')?.classList.remove('screen-shake'), 400);

    const waxStamp = document.createElement('div');
    waxStamp.className = 'wax-seal-stamp';
    waxStamp.innerHTML = `
      <div style="font-size:8px;letter-spacing:0.12em;opacity:0.8;">OFFICIAL DEED</div>
      <div style="font-size:11px;margin:2px 0;">EXECUTED</div>
      <div style="font-size:7px;opacity:0.8;">100% CONFERRED</div>
    `;
    stage.appendChild(waxStamp);
    playSfx('deal');

    // Chairman congratulates and transitions to Crest & Kit Studio on the desk
    setTimeout(() => {
      renderClubIdentityStudio();
    }, 1200);
  }, 1100);
}

function liveUpdateDeedJersey() {
  const container = document.getElementById('deedJerseyContainer');
  const crestBadge = document.getElementById('deedCrestBadge');
  const namePreview = document.getElementById('deedClubNamePreview');

  const name = document.getElementById('newClubName')?.value || cinematicState.name;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;

  if (crestBadge) crestBadge.innerText = cinematicState.crest;
  if (namePreview) namePreview.innerText = name;

  if (container) {
    container.innerHTML = generateJerseySVG({
      home,
      away,
      collar: away,
      pattern
    }, name, 'EMIRATES');
  }
}

function submitNewClubFromStudio() {
  const name = document.getElementById('newClubName')?.value.trim() || cinematicState.name;
  if (!name) return alert('Please enter a club name');
  const country = document.getElementById('newCountry')?.value || cinematicState.country;
  const division = +(document.getElementById('newDivision')?.value || cinematicState.division);
  const pattern = document.getElementById('newPattern')?.value || cinematicState.pattern;
  const home = document.getElementById('newHomeColor')?.value || cinematicState.home;
  const away = document.getElementById('newAwayColor')?.value || cinematicState.away;
  const third = document.getElementById('newThirdColor')?.value || cinematicState.third;

  post('/api/world4/club/create', ref({
    name,
    country,
    division,
    pattern,
    home,
    away,
    third,
    crest: cinematicState.crest,
    quality: 75
  })).then(data => {
    playSfx('applause');
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function switchTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  renderGame();
}

function renderTabContent() {
  const container = document.getElementById('gameContent');
  if (!container) return;

  switch (currentTab) {
    case 'home': return renderDashboard(container);
    case 'pitch': return renderTacticalPitch(container);
    case 'squad': return renderSquadRoster(container);
    case 'transfers': return renderTransferMarket(container);
    case 'managers': return renderManagerMarket(container);
    case 'stadium': return renderStadiumEconomy(container);
    case 'kit': return renderKitStudio(container);
    case 'league': return renderLeagueStandings(container);
    case 'news': return renderNewsFeed(container);
  }
}

function renderTacticalPitch(container) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const myPlayers = S.market.filter(p => p.ownerClub === c.name);

  // Group players by position
  const gks = myPlayers.filter(p => p.position === 'GK');
  const defs = myPlayers.filter(p => ['CB', 'LB', 'RB'].includes(p.position));
  const mids = myPlayers.filter(p => ['CMF', 'DMF', 'AMF'].includes(p.position));
  const fwds = myPlayers.filter(p => ['CF', 'LWF', 'RWF'].includes(p.position));

  // Build starting XI (4-3-3 default)
  const startingGK = gks[0] || myPlayers[0];
  const startingDef = defs.slice(0, 4);
  const startingMid = mids.slice(0, 3);
  const startingFwd = fwds.slice(0, 3);

  // Fillers if positions are scarce
  const bench = myPlayers.filter(p => ![startingGK?.id, ...startingDef.map(d=>d.id), ...startingMid.map(m=>m.id), ...startingFwd.map(f=>f.id)].includes(p.id));

  const makePlayerNode = (p, fallbackPos) => {
    if (!p) return `<div class="pitch-player"><div class="player-jersey-icon" style="background:#222;color:#666;">-</div><div class="player-name-plate">Vacant</div></div>`;
    const ovrClass = p.rating >= 85 ? 'ovr-elite' : p.rating >= 80 ? 'ovr-gold' : 'ovr-silver';
    return `
      <div class="pitch-player" onclick="viewPlayerCard('${p.id}')">
        <div class="player-jersey-icon" style="background:${c.jersey?.home || '#0b2545'};">
          ${p.position || fallbackPos}
          <span class="player-ovr-tag ${ovrClass}">${p.rating}</span>
        </div>
        <div class="player-name-plate">
          <span class="pos-label">${p.position || fallbackPos}</span>
          ${esc(p.name.split(' ').pop())}
        </div>
      </div>
    `;
  };

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div class="card-kicker">TACTICAL BOARD · FORMATION 4-3-3</div>
        <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;">First Team Starting XI</h2>
      </div>
      <div style="display:flex;gap:10px;">
        <span class="pill pill-div">Squad: ${myPlayers.length} Players</span>
        <button class="btn btn-secondary btn-sm" onclick="switchTab('squad')">MANAGE FULL ROSTER &rarr;</button>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- 2D Visual Pitch -->
      <div class="col-8">
        <div class="pitch-container">
          <div class="pitch-lines"></div>
          <div class="pitch-halfway"></div>
          <div class="pitch-center-circle"></div>
          <div class="pitch-penalty-top"></div>
          <div class="pitch-penalty-bottom"></div>

          <!-- Attack Line -->
          <div class="pitch-line" style="margin-top:10px;">
            ${makePlayerNode(startingFwd[0], 'LWF')}
            ${makePlayerNode(startingFwd[1], 'CF')}
            ${makePlayerNode(startingFwd[2], 'RWF')}
          </div>

          <!-- Midfield Line -->
          <div class="pitch-line">
            ${makePlayerNode(startingMid[0], 'CMF')}
            ${makePlayerNode(startingMid[1], 'DMF')}
            ${makePlayerNode(startingMid[2], 'AMF')}
          </div>

          <!-- Defense Line -->
          <div class="pitch-line">
            ${makePlayerNode(startingDef[0], 'LB')}
            ${makePlayerNode(startingDef[1], 'CB')}
            ${makePlayerNode(startingDef[2], 'CB')}
            ${makePlayerNode(startingDef[3], 'RB')}
          </div>

          <!-- Goalkeeper Line -->
          <div class="pitch-line" style="margin-bottom:10px;">
            ${makePlayerNode(startingGK, 'GK')}
          </div>
        </div>
      </div>

      <!-- Bench & Reserves Panel -->
      <div class="col-4">
        <div class="game-card" style="height:100%;display:flex;flex-direction:column;">
          <div class="card-kicker">RESERVES & BENCH</div>
          <div class="card-header">
            <h2>Substitutes (${bench.length})</h2>
          </div>
          <p style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">Click any player to inspect attributes, sell, or release.</p>
          <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:450px;">
            ${bench.map(p => `
              <div onclick="viewPlayerCard('${p.id}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-card-subtle);border:1px solid var(--border-subtle);border-radius:10px;cursor:pointer;transition:all 0.15s;" onmouseenter="this.style.background='var(--bg-card-hover)'" onmouseleave="this.style.background='var(--bg-card-subtle)'">
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="pos-badge ${p.position === 'GK' ? 'gk' : ['CB','LB','RB'].includes(p.position) ? 'def' : ['CMF','DMF','AMF'].includes(p.position) ? 'mid' : 'att'}">${p.position}</span>
                  <div>
                    <b style="font-size:13px;color:#fff;">${esc(p.name)}</b>
                    <div style="font-size:11px;color:var(--text-muted);">Age ${p.age} · Form ${p.form}%</div>
                  </div>
                </div>
                <div style="text-align:right;">
                  <b style="font-size:14px;color:var(--accent-gold);">${p.rating}</b>
                  <div style="font-size:10px;color:var(--text-dim);">OVR</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

                        <b style="color:#fff;font-size:14px;">${esc(p.name)}</b>

function refreshTalksUI(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!p) return;

  const minFee = Math.round((p.askingPrice || 10) * 0.9);
  const minSal = Math.round((p.contract?.salary || 2) * 1.05);

  let prob = 50;
  if (activeTalksState.fee >= p.askingPrice * 1.25) prob += 35;
  else if (activeTalksState.fee >= p.askingPrice) prob += 20;
  else if (activeTalksState.fee < minFee) prob -= 40;

  if (activeTalksState.salary >= minSal * 1.3) prob += 25;
  else if (activeTalksState.salary >= minSal) prob += 15;
  else if (activeTalksState.salary < minSal) prob -= 30;

  prob = Math.max(5, Math.min(98, prob));

  const fill = document.getElementById('talksGaugeFill');
  const pct = document.getElementById('talksGaugePct');
  const bubble = document.getElementById('talksAgentBubble');
  const feeDsp = document.getElementById('talksFeeDisplay');
  const salDsp = document.getElementById('talksSalDisplay');

  if (feeDsp) feeDsp.textContent = `₹${money(activeTalksState.fee)}M`;
  if (salDsp) salDsp.textContent = `₹${money(activeTalksState.salary)}M / yr`;

  if (fill && pct) {
    fill.style.width = prob + '%';
    pct.textContent = prob + '%';

    if (prob >= 75) {
      fill.style.background = 'linear-gradient(90deg, #f59e0b, #00f0ff)';
      pct.style.color = '#00f0ff';
      if (bubble) bubble.innerHTML = `Agent: "Now we're talking business, Chairman! This lucrative valuation matches ${p.name}'s pedigree. We are ready to put pen to paper!"`;
    } else if (prob >= 45) {
      fill.style.background = 'linear-gradient(90deg, #ff4757, #f59e0b)';
      pct.style.color = '#f59e0b';
      if (bubble) bubble.innerHTML = `Agent: "The offer is respectable, but ${p.name} has competing suitors. Sweeten the terms slightly and we're done."`;
    } else {
      fill.style.background = '#ff4757';
      pct.style.color = '#ff4757';
      if (bubble) bubble.innerHTML = `Agent: "Are you serious, sir? This bid is below our client's market valuation. Increase your bid or we walk away."`;
    }
  }
}

function finalizeTransferNegotiation(pid) {
  const p = S.market.find(x => x.id === pid);
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!p || !c) return;

  if (c.cash < activeTalksState.fee) {
    return alert(`Insufficient treasury funds! Club has ₹${money(c.cash)}M, but transfer fee requires ₹${money(activeTalksState.fee)}M.`);
  }

  const actionBox = document.getElementById('talksActionBox');
  if (actionBox) {
    actionBox.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;background:rgba(0,240,255,0.1);border:1px solid var(--accent-neon);border-radius:10px;color:var(--accent-neon);font-weight:700;">
        ✍️ Agent drafting official paperwork and contract clauses...
      </div>
    `;
  }

  post('/api/world4/transfer/offer', ref({
    club: S.selectedClub,
    playerId: pid,
    fee: activeTalksState.fee,
    salary: activeTalksState.salary,
    years: activeTalksState.years,
    type: 'buy'
  })).then(battle => {
    post('/api/world4/transfer/decide', ref({
      battleId: battle.id,
      club: S.selectedClub
    })).then(() => {
      // Trigger media flashbulbs and audio celebration
      playSfx('flash');
      playSfx('deal');
      playSfx('applause');

      const flash = document.createElement('div');
      flash.className = 'camera-flash-overlay active';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 600);

      const cele = document.getElementById('talksCelebration');
      const det = document.getElementById('talksSuccessDetail');
      const sFee = document.getElementById('sealedFeeVal');
      const sSal = document.getElementById('sealedSalVal');

      if (sFee) sFee.textContent = `₹${money(activeTalksState.fee)}M`;
      if (sSal) sSal.textContent = `₹${money(activeTalksState.salary)}M/yr`;
      if (det) det.textContent = `${p.name} has officially signed for ${c.name} on a ${activeTalksState.years}-year contract! Press conference scheduled.`;
      if (cele) cele.style.display = 'flex';
    }).catch(err => {
      alert(`Transfer negotiation collapsed: ${err.message}`);
      document.getElementById('transferTalksModal')?.remove();
      refresh();
    });
  }).catch(err => {
    alert(`Transfer offer rejected: ${err.message}`);
    document.getElementById('transferTalksModal')?.remove();
  });
}

function makeTransferBid(pid, defaultFee) {
  openPlayerTransferTalks(pid);
}

function loanPlayer(pid) {
  post('/api/world4/transfer/loan', ref({
    club: S.selectedClub,
    playerId: pid,
    months: 12,
    fee: 2,
    salaryShare: 50
  })).then(() => {
    playSfx('deal');
    alert('Player successfully signed on a 1-year loan deal!');
    refresh();
  }).catch(err => alert(err.message));
}

function listForSale(pid, currentVal) {
  const asking = prompt('Enter your asking price in ₹M:', currentVal);
  if (asking === null) return;
  post('/api/world4/transfer/sell', ref({
    club: S.selectedClub,
    playerId: pid,
    asking: +asking
  })).then(() => {
    alert('Player successfully listed on the global transfer list.');
    refresh();
  }).catch(err => alert(err.message));
}

function releasePlayerPrompt(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!confirm(`Are you sure you want to release ${p?.name || 'this player'}? They will become a free agent.`)) return;
  post('/api/world4/transfer/release', ref({
    club: S.selectedClub,
    playerId: pid
  })).then(() => {
    refresh();
  }).catch(err => alert(err.message));
}

function confirmHireManager(id, name, salary) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (c.cash < salary) {
    return alert(`Insufficient funds! Need ₹${salary}M for ${name}'s salary, but club treasury has ₹${money(c.cash)}M.`);
  }

  const area = document.getElementById('managerActionArea');
  if (area) {
    area.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;color:var(--accent-neon);font-weight:700;">
        📸 Convening press conference and sealing head coach contract...
      </div>
    `;
  }

  post('/api/world4/manager/hire', ref({
    club: S.selectedClub,
    managerId: id
  })).then(data => {
    playSfx('flash');
    playSfx('applause');
    playSfx('stamp');

    const flash = document.createElement('div');
    flash.className = 'camera-flash-overlay active';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    alert(`Press Announcement: ${name} is officially appointed Head Coach of ${S.selectedClub}!`);
    document.getElementById('managerInterviewModal')?.remove();
    S = data;
    renderGame();
  }).catch(err => {
    alert(err.message);
    document.getElementById('managerInterviewModal')?.remove();
  });
}

function hireManagerAction(id, name, salary) {
  openManagerInterview(id);
}

function updateExpansionCostPreview() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  const diff = Math.max(0, target - currentCap);
  const cost = Math.max(1, Math.round(diff / 1000));
  const el = document.getElementById('expansionCostPreview');
  if (target <= currentCap) {
    el.innerHTML = `<span style="color:var(--text-dim)">Capacity cannot be reduced below current size.</span>`;
  } else {
    const canAfford = c.cash >= cost;
    el.innerHTML = `<span style="color:${canAfford ? 'var(--accent-gold)' : 'var(--danger)'}">
      Project Cost: ₹${cost}M (+${diff.toLocaleString()} seats) · Club Cash: ₹${money(c.cash)}M
    </span>`;
  }
}

function expandStadiumTier(addedSeats, cost) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding by ${addedSeats.toLocaleString()} seats costs ₹${cost}M, but club only has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Expand stadium by ${addedSeats.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: currentCap + addedSeats
  })).then(data => {
    alert(`Success! Stadium capacity expanded to ${(currentCap + addedSeats).toLocaleString()} seats!`);
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function submitCustomExpansion() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  if (target <= currentCap) return alert('Target capacity must be greater than current capacity.');
  const diff = target - currentCap;
  const cost = Math.max(1, Math.round(diff / 1000));

  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding to ${target.toLocaleString()} seats costs ₹${cost}M, but your club has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Authorize stadium expansion of +${diff.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: target
  })).then(data => {
    alert(`Stadium expansion complete! Capacity is now ${target.toLocaleString()} seats!`);
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function saveTicketPrice() {
  const ticket = +document.getElementById('ticketPriceInput').value;
  post('/api/world4/economy', ref({
    club: S.selectedClub,
    ticketPrice: ticket
  })).then(data => {
    alert('Ticket pricing updated successfully.');
    S = data;

function openSponsorMarket() {

function signSponsorDeal(offerId, name) {
  post('/api/world4/sponsor/sign', ref({

    alert(`Congratulations! ${name} is now your official club sponsor!`);
    S = data;
    renderGame();

}

function generateJerseySVG(kit, clubName, sponsorName) {
  const primary = kit.home || '#0b2545';
  const secondary = kit.away || '#ffffff';
  const collar = kit.collar || '#ffffff';
  const pattern = kit.pattern || 'stripes';

  let patternSVG = '';
  if (pattern === 'stripes') {
    patternSVG = `
      <rect x="55" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="95" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="135" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'hoops') {
    patternSVG = `
      <rect x="35" y="65" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="105" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="145" width="140" height="20" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'sash') {
    patternSVG = `
      <polygon points="40,40 70,40 170,180 140,180" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'halves') {
    patternSVG = `
      <rect x="105" y="45" width="70" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  }

  return `
    <svg width="220" height="240" viewBox="0 0 210 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="jerseyClip">
          <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" />
        </clipPath>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
        </filter>
      </defs>

      <!-- Jersey Body Outline with Clip -->
      <g filter="url(#dropShadow)">
        <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" fill="${primary}" />
        <g clip-path="url(#jerseyClip)">
          ${patternSVG}
        </g>
      </g>

      <!-- Collar detail -->
      <path d="M85,42 C95,49 115,49 125,42 C120,56 90,56 85,42 Z" fill="${collar}" />

      <!-- Left Crest Badge -->
      <circle cx="80" cy="80" r="10" fill="#fff" opacity="0.9" />
      <text x="80" y="83" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">${esc(clubName.slice(0, 2).toUpperCase())}</text>

      <!-- Sponsor Logo on Chest -->
      <text x="105" y="125" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-family="sans-serif">
        ${esc((sponsorName || 'FOOTBALL').slice(0, 10).toUpperCase())}
      </text>

      <!-- Shorts Below -->
      <path d="M68,195 L142,195 L148,225 L112,225 L105,208 L98,225 L62,225 Z" fill="${kit.shorts || primary}" filter="url(#dropShadow)" />
    </svg>
  `;
}

function liveUpdateKitPreview() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const updatedKit = {
    home: document.getElementById('kitHome').value,
    away: document.getElementById('kitAway').value,
    collar: document.getElementById('kitCollar').value,
    shorts: document.getElementById('kitShorts').value,
    pattern: document.getElementById('kitPattern').value
  };
  document.getElementById('svgKitPreview').innerHTML = generateJerseySVG(updatedKit, c.name, c.sponsor?.name);
}

function saveKitDesign() {
  const kitData = {
    home: document.getElementById('kitHome').value,
    away: document.getElementById('kitAway').value,
    collar: document.getElementById('kitCollar').value,
    shorts: document.getElementById('kitShorts').value,
    pattern: document.getElementById('kitPattern').value,
    quality: +document.getElementById('kitQualityRange').value
  };

  post('/api/world4/jersey/update', ref({
    club: S.selectedClub,
    jersey: kitData
  })).then(data => {
    alert('Kit design successfully saved and updated in the club repository!');
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

function renderLeagueStandings(container) {
  const myClub = S.clubs.find(x => x.name === S.selectedClub);
  const divisionClubs = S.clubs
    .filter(c => c.country === myClub.country && c.division === myClub.division)
    .sort((a, b) => (b.stats.points - a.stats.points) || ((b.stats.wins * 3) - (a.stats.wins * 3)));

  container.innerHTML = `
    <div class="game-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <div>
          <div class="card-kicker">${esc(myClub.country.toUpperCase())} FOOTBALL PYRAMID</div>
          <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;">
            Division ${myClub.division} Standings · Season ${S.season}
          </h2>
        </div>
        <button class="btn btn-success btn-sm" onclick="simulateMatch()">⚽ PLAY FIXTURE</button>
      </div>

      <div style="overflow-x:auto;">
        <table class="roster-table">
          <thead>
            <tr>
              <th style="width:40px;">#</th>
              <th>Club</th>
              <th>P</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>Reputation</th>
              <th>Points</th>
            </tr>
          </thead>
          <tbody>
            ${divisionClubs.map((c, i) => {
              const isUser = c.name === myClub.name;
              const isPromoted = i === 0;
              const isRelegated = i >= divisionClubs.length - 2;
              return `
                <tr class="roster-row" style="${isUser ? 'background:rgba(42, 139, 242, 0.15);border:1px solid var(--accent-blue);' : ''}">
                  <td>
                    <b style="color:${isPromoted ? 'var(--accent-neon)' : isRelegated ? 'var(--danger)' : '#fff'}">
                      ${i + 1}
                    </b>
                  </td>
                  <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div class="crest-badge" style="width:30px;height:30px;font-size:12px;background:${c.jersey?.home || '#0b2545'};">
                        ${esc(c.name.slice(0, 2).toUpperCase())}
                      </div>
                      <b style="color:${isUser ? 'var(--accent-neon)' : '#fff'};">${esc(c.name)}</b>
                      ${isUser ? '<span class="pill pill-season" style="font-size:9px;">YOU</span>' : ''}
                    </div>
                  </td>
                  <td>${c.stats.wins + c.stats.draws + c.stats.losses}</td>
                  <td>${c.stats.wins}</td>
                  <td>${c.stats.draws}</td>
                  <td>${c.stats.losses}</td>
                  <td>${c.reputation} OVR</td>
                  <td>
                    <b style="font-family:var(--font-display);font-size:16px;color:${isUser ? 'var(--accent-neon)' : '#fff'};">
                      ${c.stats.points}
                    </b>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// -------------------------------------------------------------
// MATCH SIMULATION ENGINE & CELEBRATION MODAL
// -------------------------------------------------------------
function simulateMatch() {
  post('/api/world4/match/simulate', ref({})).then(m => {
    openMatchModal(m);
    refresh();
  }).catch(err => alert(err.message));
}

function openMatchModal(m) {
  const isWin = m.homeGoals > m.awayGoals;
  const isDraw = m.homeGoals === m.awayGoals;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'matchSimModal';
  overlay.innerHTML = `
    <div class="modal-box" style="text-align:center;">
      <div class="card-kicker">${isWin ? 'VICTORY' : isDraw ? 'DRAW' : 'FULL TIME'}</div>
      
      <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0;">
        <div style="flex:1;">
          <h3 style="font-family:var(--font-display);font-size:18px;font-weight:800;color:#fff;">${esc(m.home)}</h3>
        </div>
        <div style="font-family:var(--font-display);font-size:42px;font-weight:900;color:var(--accent-neon);padding:0 18px;background:var(--bg-card-subtle);border-radius:12px;border:1px solid var(--border-subtle);">
          ${m.homeGoals} - ${m.awayGoals}
        </div>
        <div style="flex:1;">
          <h3 style="font-family:var(--font-display);font-size:18px;font-weight:800;color:#fff;">${esc(m.away)}</h3>
        </div>
      </div>

      <div style="background:var(--bg-card-subtle);border-radius:12px;padding:14px;font-size:13px;color:var(--text-muted);margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>Stadium Attendance: <b style="color:#fff;">${money(m.attendance)} fans</b></div>
        <div>Matchday Gate Revenue: <b style="color:var(--accent-neon);">₹${money(m.revenue)}M</b></div>
      </div>

      <button class="btn btn-primary" style="width:100%;" onclick="document.getElementById('matchSimModal').remove()">
        CONTINUE
      </button>
    </div>
  `;
  document.body.appendChild(overlay);
}

// -------------------------------------------------------------
// INDIVIDUAL PLAYER INSPECTION MODAL
// -------------------------------------------------------------
function viewPlayerCard(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!p) return;
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const isMine = p.ownerClub === c.name;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'playerInspectionModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
        <div>
          <span class="card-kicker">${esc(p.position)} · ${p.age} YEARS OLD</span>
          <h2 style="font-family:var(--font-display);font-size:24px;font-weight:900;color:#fff;">${esc(p.name)}</h2>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Contracted to ${esc(p.ownerClub || 'Free Agent')}</div>
        </div>
        <div style="text-align:right;">
          <span style="font-family:var(--font-display);font-size:32px;font-weight:900;color:var(--accent-gold);">${p.rating}</span>
          <div style="font-size:10px;color:var(--text-dim);">RATING</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;margin-bottom:20px;font-size:13px;">
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:8px;">Form: <b style="color:var(--accent-neon);">${p.form}%</b></div>
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:8px;">Mentality: <b>${esc(p.mentality)}</b></div>
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:8px;">Annual Wage: <b>₹${money(p.contract?.salary || 2)}M</b></div>
        <div style="background:var(--bg-card-subtle);padding:10px;border-radius:8px;">Market Value: <b style="color:var(--accent-gold);">₹${money(p.askingPrice)}M</b></div>
      </div>

      <div style="display:flex;gap:10px;">
        ${isMine ? `
          <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="document.getElementById('playerInspectionModal').remove(); listForSale('${p.id}', ${p.askingPrice})">LIST FOR SALE</button>
          <button class="btn btn-danger btn-sm" onclick="document.getElementById('playerInspectionModal').remove(); releasePlayerPrompt('${p.id}')">RELEASE</button>
        ` : `
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="document.getElementById('playerInspectionModal').remove(); openPlayerTransferTalks('${p.id}')">⚡ NEGOTIATE (₹${money(p.askingPrice)}M)</button>
        `}
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('playerInspectionModal').remove()">CLOSE</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function advanceSeason() {
  if (!confirm('Are you sure you want to advance to the next season? League tables will reset and contracts will tick forward.')) return;
  post('/api/world4/season/advance', ref({})).then(data => {
    alert(`Season ${data.season} has commenced! Summer transfer window is open!`);
    S = data;
    renderGame();
  }).catch(err => alert(err.message));
}

// Initial Boot
if (session?.soloId || session?.roomCode) {
  resumeSession();
} else {
  modeScreen();
}
