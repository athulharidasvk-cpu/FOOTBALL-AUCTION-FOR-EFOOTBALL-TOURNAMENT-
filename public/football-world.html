// TAB 5: MANAGER MARKET (REAL & CREATED FICTIONAL MANAGERS)
// -------------------------------------------------------------
let mgrMarketFilter = {
  tier: 'all',
  style: 'all',
  search: ''
};

function renderManagerMarket(container) {
  const c = S.clubs.find(x => x.name === S.selectedClub);

  fetch('/api/world4/managers?' + (session.roomCode ? 'room=' + session.roomCode : 'soloId=' + session.soloId))
    .then(res => res.json())
    .then(managersList => {
      const allAvailable = (managersList || []).filter(m => m.available !== false && (m.status === 'available' || !m.status));

      // Calculate counts
      const countTotal = allAvailable.length;
      const countDiv34 = allAvailable.filter(m => (m.salary <= 2.8 || (m.minDivision && m.minDivision >= 3))).length;
      const countDiv2 = allAvailable.filter(m => (m.salary > 2.8 && m.salary <= 7)).length;
      const countDiv1 = allAvailable.filter(m => (m.salary > 7 || m.minDivision === 1)).length;
      const countFictional = allAvailable.filter(m => m.isFictional).length;
      const countAffordable = allAvailable.filter(m => m.salary <= c.cash).length;

      // Filter managers
      const filtered = allAvailable.filter(m => {
        const minDiv = m.minDivision || (m.rating >= 90 ? 1 : m.rating >= 80 ? 2 : m.rating >= 72 ? 3 : 4);
        
        // Tier filter
        if (mgrMarketFilter.tier === 'div34' && !(m.salary <= 2.8 || minDiv >= 3)) return false;
        if (mgrMarketFilter.tier === 'div2' && !(m.salary > 2.8 && m.salary <= 7)) return false;
        if (mgrMarketFilter.tier === 'div1' && !(m.salary > 7 || minDiv === 1)) return false;
        if (mgrMarketFilter.tier === 'fictional' && !m.isFictional) return false;
        if (mgrMarketFilter.tier === 'affordable' && m.salary > c.cash) return false;

        // Style filter
        if (mgrMarketFilter.style !== 'all' && m.style !== mgrMarketFilter.style) return false;

        // Search filter
        if (mgrMarketFilter.search) {
          const q = mgrMarketFilter.search.toLowerCase();
          const matchName = (m.name || '').toLowerCase().includes(q);
          const matchTitle = (m.title || '').toLowerCase().includes(q);
          const matchStyle = (m.style || '').toLowerCase().includes(q);
          if (!matchName && !matchTitle && !matchStyle) return false;
        }

        return true;
      });

      const styleIcons = {
        'Possession': '🧠',
        'High Press': '⚡',
        'Counter Attack': '🦅',
        'Direct Football': '🎯',
        'Defensive Block': '🛡️'
      };

      container.innerHTML = `
        <div class="game-card">
          <div class="card-kicker">TACTICAL DIRECTORY & RECRUITMENT</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
            <div>
              <h2 style="font-family:var(--font-display);font-size:24px;font-weight:800;color:#fff;margin:0;">
                Manager Catalog (${allAvailable.length} Tacticians Available)
              </h2>
              <p style="color:var(--text-muted);font-size:13.5px;margin-top:4px;">
                Affordable grassroots managers for lower divisions, hungry promotion specialists, and world-class elite head coaches.
              </p>
            </div>
            ${c.manager ? `
              <div style="background:var(--bg-card-subtle);border:1px solid var(--border-subtle);padding:8px 14px;border-radius:10px;text-align:right;">
                <span style="font-size:11px;color:var(--text-dim);">CURRENT MANAGER:</span>
                <b style="font-size:13px;color:var(--accent-gold);display:block;">${esc(c.manager.name)} (${c.manager.style})</b>
              </div>
            ` : `
              <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);padding:8px 14px;border-radius:10px;text-align:right;">
                <span style="font-size:11px;color:var(--accent-gold);font-weight:700;">VACANCY: NO MANAGER HIRED</span>
                <div style="font-size:11px;color:#e2e8f0;">Club Cash: ₹${money(c.cash)}M (Division ${c.division})</div>
              </div>
            `}
          </div>

          <!-- Division Guidance Notice for Lower Leagues -->
          ${c.division >= 3 ? `
            <div style="background:rgba(0,240,255,0.06);border:1px solid rgba(0,240,255,0.2);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <div>
                <b style="color:var(--accent-neon);font-size:13px;">🛡️ Division ${c.division} Manager Guide:</b>
                <span style="color:#e2e8f0;font-size:12.5px;margin-left:6px;">
                  Elite managers like Pep and Ancelotti demand ₹14M+ and Division 1 football. Hire budget-friendly created specialists (from ₹0.8M) to lead ${esc(c.name)} through promotions!
                </span>
              </div>
              <button class="btn btn-primary btn-xs" onclick="mgrMarketFilter.tier='div34'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
                VIEW DIV 3 & 4 BUDGET MANAGERS
              </button>
            </div>
          ` : ''}

          <!-- Filter Navigation Tabs -->
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <button class="btn btn-xs ${mgrMarketFilter.tier==='all'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='all'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              🌟 All (${countTotal})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div34'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div34'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              🛡️ Div 3 & 4 Budget (₹0.8M - ₹2.8M) (${countDiv34})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div2'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div2'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ⚔️ Div 2 Challengers (₹3M - ₹7M) (${countDiv2})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div1'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div1'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              🏆 Div 1 Elite (Pep, Carlo, Klopp) (${countDiv1})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='fictional'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='fictional'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ✨ Created Specialists (${countFictional})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='affordable'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='affordable'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              💰 Affordable for ${esc(c.name)} (${countAffordable})
            </button>
          </div>

          <!-- Secondary Filters: Tactical Style & Search -->
          <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
            <div style="flex:1;min-width:220px;">
              <input type="text" class="input-field" placeholder="🔎 Search manager by name, title, or style..." value="${esc(mgrMarketFilter.search)}" style="width:100%;padding:8px 12px;font-size:13px;" oninput="mgrMarketFilter.search=this.value; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
            </div>
            <div style="width:200px;">
              <select class="input-field" style="width:100%;padding:8px 12px;font-size:13px;" onchange="mgrMarketFilter.style=this.value; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
                <option value="all" ${mgrMarketFilter.style==='all'?'selected':''}>All Philosophies</option>
                <option value="Possession" ${mgrMarketFilter.style==='Possession'?'selected':''}>🧠 Possession</option>
                <option value="High Press" ${mgrMarketFilter.style==='High Press'?'selected':''}>⚡ High Press</option>
                <option value="Counter Attack" ${mgrMarketFilter.style==='Counter Attack'?'selected':''}>🦅 Counter Attack</option>
                <option value="Direct Football" ${mgrMarketFilter.style==='Direct Football'?'selected':''}>🎯 Direct Football</option>
                <option value="Defensive Block" ${mgrMarketFilter.style==='Defensive Block'?'selected':''}>🛡️ Defensive Block</option>
              </select>
            </div>
          </div>

          <!-- Manager Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:18px;">
            ${filtered.length === 0 ? `
              <div style="grid-column:1/-1;text-align:center;padding:40px;background:var(--bg-card-subtle);border-radius:14px;border:1px dashed var(--border-subtle);color:var(--text-muted);">
                No managers found matching current filters. Try selecting "All Managers" or clearing your search.
              </div>
            ` : filtered.map(m => {
              const minDiv = m.minDivision || (m.rating >= 90 ? 1 : m.rating >= 80 ? 2 : m.rating >= 72 ? 3 : 4);
              const isAffordable = c.cash >= m.salary;
              const canCoachDivision = c.division <= minDiv || m.rating < 88 || c.reputation >= 82;
              const icon = styleIcons[m.style] || '👔';

              return `
                <div style="background:var(--bg-card-subtle);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.2s;" onmouseenter="this.style.transform='translateY(-3px)'" onmouseleave="this.style.transform='none'">
                  <div>
                    <!-- Header with Icon, Name & Rating -->
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                      <div style="display:flex;gap:12px;align-items:flex-start;">
                        <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.4));display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid rgba(255,255,255,0.1);">
                          ${icon}
                        </div>
                        <div>
                          <h3 style="font-family:var(--font-display);font-size:17px;font-weight:800;color:#fff;margin:0;">
                            ${esc(m.name)}
                          </h3>
                          <div style="font-size:12px;color:var(--accent-gold);font-weight:600;margin-top:2px;">
                            ${esc(m.title || m.style + ' Specialist')}
                          </div>
                        </div>
                      </div>
                      <div style="text-align:right;">
                        <span style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--accent-neon);">${m.rating}</span>
                        <div style="font-size:10px;color:var(--text-dim);">OVR</div>
                      </div>
                    </div>

                    <!-- Tags & Division Suitability -->
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
                      <span class="pill pill-div">${icon} ${esc(m.style)}</span>
                      ${m.isFictional ? `
                        <span class="pill" style="background:rgba(0,240,255,0.12);color:var(--accent-neon);border:1px solid rgba(0,240,255,0.3);font-size:10px;">✨ CREATED</span>
                      ` : `
                        <span class="pill" style="background:rgba(245,158,11,0.12);color:var(--accent-gold);border:1px solid rgba(245,158,11,0.3);font-size:10px;">🏆 REAL-WORLD</span>
                      `}
                      ${minDiv === 4 ? `
                        <span class="pill" style="background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:10px;">🌱 Div 3 & 4 Ready</span>
                      ` : minDiv === 3 ? `
                        <span class="pill" style="background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:10px;">📈 Div 3 Specialist</span>
                      ` : minDiv === 2 ? `
                        <span class="pill" style="background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);font-size:10px;">⚔️ Min Div 2</span>
                      ` : `
                        <span class="pill" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.3);font-size:10px;">🏆 Requires Div 1</span>
                      `}
                    </div>

                    <!-- Bio -->
                    ${m.bio ? `
                      <p style="font-size:12px;color:var(--text-muted);line-height:1.4;margin:0 0 12px 0;">
                        ${esc(m.bio)}
                      </p>
                    ` : ''}

                    <!-- Financial & Formation Details -->
                    <div style="font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;background:rgba(0,0,0,0.25);padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);">
                      <div style="display:flex;justify-content:space-between;">
                        <span>Annual Salary:</span>
                        <b style="color:#fff;font-family:var(--font-display);">₹${money(m.salary)}M / season</b>
                      </div>
                      <div style="display:flex;justify-content:space-between;">
                        <span>Formations:</span>
                        <b style="color:var(--accent-neon);">${(m.preferredFormations || ['4-3-3']).join(', ')}</b>
                      </div>
                      <!-- Affordability status -->
                      <div style="margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.08);font-size:11.5px;">
                        ${!isAffordable ? `
                          <span style="color:#f87171;font-weight:700;">❌ Exceeds Treasury (Need ₹${money(m.salary - c.cash)}M more)</span>
                        ` : !canCoachDivision ? `
                          <span style="color:#fbbf24;font-weight:700;">⚠️ Demands Div ${minDiv} Football</span>
                        ` : `
                          <span style="color:#4ade80;font-weight:700;">✅ Affordable for ${esc(c.name)}</span>
                        `}
                      </div>
                    </div>
                  </div>

                  <!-- Action Button -->
                  <button class="btn ${isAffordable && canCoachDivision ? 'btn-primary' : 'btn-secondary'} btn-sm" style="width:100%;" onclick="openManagerInterview('${m.id}')">
                    ${!canCoachDivision ? `🔍 VIEW PRESTIGE TERMS (Requires Div ${minDiv})` : `👔 INTERVIEW & SIGN (₹${money(m.salary)}M)`}

              `;
            }).join('')}
          </div>
        </div>
      `;
    })
    .catch(err => {
      container.innerHTML = `<p style="color:var(--danger)">Error loading managers: ${err.message}</p>`;
    });
}

    .then(res => res.json())
    .then(managersList => {
      const m = (managersList || []).find(x => x.id === mid);
      if (!m) return alert('Manager not found.');
      const c = S.clubs.find(x => x.name === S.selectedClub);

      const minDiv = m.minDivision || (m.rating >= 90 ? 1 : m.rating >= 80 ? 2 : m.rating >= 72 ? 3 : 4);
      const isAffordable = c.cash >= m.salary;
      const canCoachDivision = c.division <= minDiv || m.rating < 88 || c.reputation >= 82;

      // Realistic tactical quote based on tier
      let quote = '';

        quote = `"${m.name}: 'Chairman, I know what it takes to grind out dirty, hard-fought victories in Division ${c.division}. Back me with honest, hungry players and my signature ${m.style} setup, and we will build a fortress and win promotion!'`;

        quote = `"${m.name}: 'I specialize in taking ambitious clubs out of Division ${c.division}. With my ${m.style} philosophy and targeted additions, we will establish dominance on the pitch.'`;
      } else if (m.isFictional && minDiv === 2) {
        quote = `"${m.name}: 'The project at ${c.name} has huge promise. My ${m.style} methods will bring continental-level tactical sophistication and discipline to your squad from day one.'`;

      const overlay = document.createElement('div');

      overlay.innerHTML = `

            <div style="width:68px;height:68px;border-radius:14px;background:linear-gradient(135deg, #183254, #0b1a2d);display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid rgba(0,240,255,0.3);box-shadow:0 8px 24px rgba(0,0,0,0.5);">
              👔
            </div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;">
                <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:#fff;margin:0;">
                  ${esc(m.name)}
                </h2>
                ${m.isFictional ? `
                  <span class="pill" style="background:rgba(0,240,255,0.15);color:var(--accent-neon);font-size:10px;">✨ CREATED SPECIALIST</span>
                ` : `
                  <span class="pill" style="background:rgba(245,158,11,0.15);color:var(--accent-gold);font-size:10px;">🏆 WORLD-CLASS</span>
                `}
              </div>
              <div style="font-size:13px;color:var(--accent-neon);font-weight:700;margin-top:2px;">

              </div>
              <div class="dialogue-bubble" style="margin-top:10px;font-size:13px;line-height:1.5;color:#e2e8f0;background:rgba(11,26,45,0.85);border:1px solid rgba(0,240,255,0.2);padding:10px 14px;border-radius:10px;">

          </div>

          <!-- Prestige or Affordability Advisories -->
          ${!canCoachDivision ? `
            <div style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#fca5a5;font-size:12.5px;line-height:1.5;">

              <div style="margin-top:8px;color:#fff;">

              🤝 CONFIRM & HIRE AS HEAD COACH (₹${money(m.salary)}M)

            <button class="btn btn-secondary" style="padding:12px 18px;" onclick="document.getElementById('managerInterviewModal').remove()">
              CLOSE
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    })
    .catch(err => alert(err.message));
}

function confirmHireManager(id, name, salary) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (c.cash < salary) {
    return alert(`Insufficient funds! Need ₹${salary}M for ${name}'s salary, but club treasury has ₹${money(c.cash)}M.`);
  }

  const area = document.getElementById('managerActionArea');
  if (area) {
    area.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;color:var(--accent-neon);font-weight:700;">
        📸 Convening press conference and sealing head coach contract...
      </div>
    `;
  }

  post('/api/world4/manager/hire', ref({
    club: S.selectedClub,
    managerId: id
  })).then(data => {
    playSfx('flash');
    playSfx('applause');
    playSfx('stamp');

    const flash = document.createElement('div');
    flash.className = 'camera-flash-overlay active';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    alert(`Press Announcement: ${name} is officially appointed Head Coach of ${S.selectedClub}!`);
    document.getElementById('managerInterviewModal')?.remove();
    S = data;
    triggerLiveBudgetUpdate(`👔 Manager Appointed: ${name} (₹${salary}M/yr)`, 'salary');
    renderGame();
  }).catch(err => {
    alert(err.message);
    document.getElementById('managerInterviewModal')?.remove();
  });
}

function hireManagerAction(id, name, salary) {
  openManagerInterview(id);
}

  if (!c.manager) {
    alert('You have not hired a manager yet! Visit the Manager Market tab to hire an elite head coach.');
    return switchTab('managers');
  }

  playSfx('crisis');

  fetch(`/api/world4/manager/meeting?club=${encodeURIComponent(c.name)}&` + (session.roomCode ? 'room=' + session.roomCode : 'soloId=' + session.soloId))
    .then(res => res.json())
    .then(data => {
      const excuses = data.excuses || (data.excuse ? [data.excuse] : []);
      const managerDemands = data.demands || '';
      const demandPositions = data.demandPositions || data.neededPositions || ['CB', 'ST'];
      const targets = data.recommendedTargets || data.targets || [];

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'boardroomMeetingModal';

      overlay.innerHTML = `

function submitBoardroomExpectations() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const exp = document.getElementById('meetingExpectation')?.value || 'top4';
  const stance = document.getElementById('meetingStance')?.value || 'supportive';

  post('/api/world4/manager/expectation', ref({
    club: S.selectedClub,
    expectation: exp,
    ownerStance: stance
  })).then(res => {
    playSfx('stamp');
    alert(`Boardroom Directive Enforced!\n\nExpectation: ${exp.toUpperCase()}\nOwner Stance: ${stance.toUpperCase()}\n\nSquad Morale: ${res.morale}% | Manager Confidence: ${res.managerConfidence}%`);
    document.getElementById('boardroomMeetingModal')?.remove();
    refresh();
  }).catch(err => alert(err.message));
}

function updateExpansionCostPreview() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  const diff = Math.max(0, target - currentCap);
  const cost = Math.max(1, Math.round(diff / 1000));
  const el = document.getElementById('expansionCostPreview');
  if (target <= currentCap) {
    el.innerHTML = `<span style="color:var(--text-dim)">Capacity cannot be reduced below current size.</span>`;
  } else {
    const canAfford = c.cash >= cost;
    el.innerHTML = `<span style="color:${canAfford ? 'var(--accent-gold)' : 'var(--danger)'}">
      Project Cost: ₹${cost}M (+${diff.toLocaleString()} seats) · Club Cash: ₹${money(c.cash)}M
    </span>`;
  }
}

function expandStadiumTier(addedSeats, cost) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding by ${addedSeats.toLocaleString()} seats costs ₹${cost}M, but club only has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Expand stadium by ${addedSeats.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: currentCap + addedSeats
  })).then(data => {
    alert(`Success! Stadium capacity expanded to ${(currentCap + addedSeats).toLocaleString()} seats!`);
    S = data;
    triggerLiveBudgetUpdate(`🏟️ Stadium Expanded: +${addedSeats.toLocaleString()} seats (-₹${cost}M)`, 'revenue');
    renderGame();
  }).catch(err => alert(err.message));
}

function submitCustomExpansion() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  if (target <= currentCap) return alert('Target capacity must be greater than current capacity.');
  const diff = target - currentCap;
  const cost = Math.max(1, Math.round(diff / 1000));

  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding to ${target.toLocaleString()} seats costs ₹${cost}M, but your club has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Authorize stadium expansion of +${diff.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: target
  })).then(data => {
    alert(`Stadium expansion complete! Capacity is now ${target.toLocaleString()} seats!`);
    S = data;
    triggerLiveBudgetUpdate(`🏟️ Stadium Expanded: ${target.toLocaleString()} seats (-₹${cost}M)`, 'revenue');
    renderGame();
  }).catch(err => alert(err.message));
}

function generateJerseySVG(kit, clubName, sponsorName) {
  const primary = kit.home || '#0b2545';
  const secondary = kit.away || '#ffffff';
  const collar = kit.collar || '#ffffff';
  const pattern = kit.pattern || 'stripes';

  let patternSVG = '';
  if (pattern === 'stripes') {
    patternSVG = `
      <rect x="55" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="95" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="135" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'hoops') {
    patternSVG = `
      <rect x="35" y="65" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="105" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="145" width="140" height="20" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'sash') {
    patternSVG = `
      <polygon points="40,40 70,40 170,180 140,180" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'halves') {
    patternSVG = `
      <rect x="105" y="45" width="70" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  }

  return `
    <svg width="220" height="240" viewBox="0 0 210 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="jerseyClip">
          <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" />
        </clipPath>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
        </filter>
      </defs>

      <!-- Jersey Body Outline with Clip -->
      <g filter="url(#dropShadow)">
        <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" fill="${primary}" />
        <g clip-path="url(#jerseyClip)">
          ${patternSVG}
        </g>
      </g>

      <!-- Collar detail -->
      <path d="M85,42 C95,49 115,49 125,42 C120,56 90,56 85,42 Z" fill="${collar}" />

      <!-- Left Crest Badge -->
      <circle cx="80" cy="80" r="10" fill="#fff" opacity="0.9" />
      <text x="80" y="83" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">${esc((clubName || 'FC').slice(0, 2).toUpperCase())}</text>

      <!-- Sponsor Logo on Chest -->
      <text x="105" y="125" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-family="sans-serif">
        ${esc((sponsorName || 'FOOTBALL').slice(0, 10).toUpperCase())}
      </text>

      <!-- Shorts Below -->
      <path d="M68,195 L142,195 L148,225 L112,225 L105,208 L98,225 L62,225 Z" fill="${kit.shorts || primary}" filter="url(#dropShadow)" />
    </svg>
  `;
}

function liveUpdateKitPreview() {

function saveKitDesign(showNotification = true) {
  const kitData = {
    home: document.getElementById('kitHome')?.value || '#0b2545',
    away: document.getElementById('kitAway')?.value || '#ffffff',
    collar: document.getElementById('kitCollar')?.value || '#ffffff',
    shorts: document.getElementById('kitShorts')?.value || '#0b2545',
    pattern: document.getElementById('kitPattern')?.value || 'stripes',
    quality: +(document.getElementById('kitQualityRange')?.value || 75)
  };

  return post('/api/world4/jersey/update', ref({
    club: S.selectedClub,
    jersey: kitData
  })).then(data => {
    S = data;
    if (showNotification) {
      playSfx('stamp');
      alert('Kit template updated in official club design archive.');
      renderGame();
    }
    return data;
  }).catch(err => {
    alert(err.message);
    throw err;
  });
}

function launchKitToSupporters() {
  // First persist the current design parameters
  saveKitDesign(false)
    .then(() => {
      return post('/api/world4/jersey/launch', ref({ club: S.selectedClub }));
    })
    .then(data => {
      const res = data.result;
      if (res.verdict === 'hit') {
        playSfx('deal');
      } else {
        playSfx('crisis');
      }
      S = data.state;
      renderGame();
      openKitLaunchCelebrationModal(res);
    })
    .catch(err => alert('Kit launch failed: ' + err.message));
}

function openKitLaunchCelebrationModal(res) {

function saveGame(showAlert = true) {
  const saveBtn = document.getElementById('hudSaveBtn');
  if (saveBtn) {
    saveBtn.innerHTML = `<span>⏳ SAVING...</span>`;
    saveBtn.style.opacity = '0.7';
  }

  post('/api/world4/save', ref({ club: S?.selectedClub }))
    .then(data => {
      if (data.state) S = data.state;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      session = {
        ...session,
        savedClub: S?.selectedClub || session?.savedClub,
        savedTime: now
      };
      save();
      playSfx('stamp');

      if (saveBtn) {
        saveBtn.innerHTML = `💾 <span>SAVED!</span>`;
        saveBtn.style.opacity = '1';
        saveBtn.style.borderColor = 'var(--accent-neon)';
        saveBtn.style.color = 'var(--accent-neon)';
        setTimeout(() => {
          if (saveBtn) {
            saveBtn.innerHTML = `💾 <span>SAVE GAME</span>`;
            saveBtn.style.borderColor = 'var(--accent-gold)';
            saveBtn.style.color = 'var(--accent-gold)';
          }
        }, 2200);
      }

      if (showAlert) {
        openSaveConfirmationModal(now);
      }
    })
    .catch(err => {
      if (saveBtn) {
        saveBtn.innerHTML = `💾 <span>SAVE GAME</span>`;
        saveBtn.style.opacity = '1';
      }
      alert('Save failed: ' + err.message);
    });
}

// -------------------------------------------------------------
// MATCH SIMULATION ENGINE & CELEBRATION MODAL
// -------------------------------------------------------------
function simulateMatch(fastMode = false) {
  if (matchSimulationInProgress) return;
  matchSimulationInProgress = true;

  const btn = document.getElementById('kickoffBtn') || document.getElementById('hudKickoffBtn');
  if (btn) {
    btn.classList.add('btn-loading');
    btn.disabled = true;
  }

  playSfx('kickoff');

  post('/api/world4/match/simulate', ref({ club: S.selectedClub, mentality: clientSelectedMentality }))
    .then(data => {
      matchSimulationInProgress = false;
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
      if (data.state) S = data.state;
      if (data.nextFixture) cachedNextFixture = data.nextFixture;
      triggerLiveBudgetUpdate(`⚽ Matchday Revenue: +₹${money(data.revenue || data.match?.revenue)}M Gate Receipts`, 'revenue');

      if (fastMode) {
        activeLiveMatch = null;
        openMatchModal(data.match || data);
        renderGame();
      } else {
        startInteractiveLiveMatch(data.match || data);
      }
    })
    .catch(err => {
      matchSimulationInProgress = false;
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
      alert(err.message || 'Match simulation error');
    });
}

function advanceSeason() {
  if (!confirm('Are you sure you want to conclude the current season? Final standings will be sealed, promotions & relegations executed, prize money distributed, and contract years advanced.')) return;
  
  post('/api/world4/season/advance', ref({})).then(data => {
    if (data.state) S = data.state;
    else S = data;
    triggerLiveBudgetUpdate(`🏆 Season ${data.season || S.season} Advanced: Prize pool & salary ledger rolled over`, 'revenue');
    renderGame();
    openSeasonGalaModal(data.verdict, data.season || S.season);
  }).catch(err => alert(err.message));
}

let activeAwardsCountry = null;
let activeAwardsDivision = 1;

function renderAwardsGala(container) {
  const myClub = S.clubs.find(x => x.name === S.selectedClub) || {};
  const country = activeAwardsCountry || myClub.country || 'England';
  const division = activeAwardsDivision || 1;

  // Retrieve awards record from S.awardsHistory
  let awardsRecord = S.awardsHistory && S.awardsHistory[activeAwardsSeasonIndex];

  // If no awards exist yet, synthesize a real-time preview of projected awards based on current stats!
  if (!awardsRecord) {
    const contractedPlayers = [];
    S.clubs.forEach(c => {
      (c.players || []).forEach(pid => {
        const p = S.market.find(m => m.id === pid);
        if (p) contractedPlayers.push({ p, club: c });
      });
    });

    const getScore = (item) => {
      const { p, club: c } = item;
      return (p.rating || 70) * 1.5 + ((p.form || 75) - 60) * 0.4 + (p.goalsScored || 0) * 3.5 + (p.assists || 0) * 2.5 + (c.division === 1 ? 14 : c.division === 2 ? 8 : 4);
    };

    const ranked = [...contractedPlayers].sort((a, b) => getScore(b) - getScore(a));
    const top5 = ranked.slice(0, 5).map((x, idx) => ({
      rank: idx + 1,
      id: x.p.id,
      name: x.p.name,
      rating: x.p.rating,
      position: x.p.position,
      nationality: x.p.nationality || 'International',
      club: x.club.name,
      country: x.club.country,
      division: x.club.division,
      goals: x.p.goalsScored || 0,
      assists: x.p.assists || 0,
      votes: 520 - (idx * 65),
      points: Math.round(getScore(x))
    }));

    const w = top5[0] || { name: 'Superstar Striker', club: 'City FC', rating: 91, votes: 520, points: 198, position: 'CF' };
    const scorers = [...contractedPlayers].filter(x => (x.p.goalsScored || 0) > 0).sort((a, b) => (b.p.goalsScored || 0) - (a.p.goalsScored || 0));
    const gb = scorers[0] ? { name: scorers[0].p.name, club: scorers[0].club.name, goals: scorers[0].p.goalsScored || 14, rating: scorers[0].p.rating } : { name: w.name, club: w.club, goals: 12, rating: w.rating };
    const gks = contractedPlayers.filter(x => x.p.position === 'GK').sort((a, b) => getScore(b) - getScore(a));
    const gg = gks[0] ? { name: gks[0].p.name, club: gks[0].club.name, cleanSheets: gks[0].p.cleanSheets || 5, rating: gks[0].p.rating } : { name: 'Thibaut Courtois', club: 'Real Madrid', cleanSheets: 7, rating: 90 };

    awardsRecord = {
      season: S.season,
      isLivePreview: true,
      global: {
        ballonDor: { winner: w, podium: top5 },
        goldenBoot: gb,
        goldenGlove: gg,
        playmaker: { name: ranked.find(x => ['AMF','CMF'].includes(x.p.position))?.p.name || 'Kevin De Bruyne', club: 'Manchester City', position: 'AMF', rating: 91 },

  const ballon = awardsRecord.global?.ballonDor;
  const winner = ballon?.winner;
  const podium = ballon?.podium || [];

  // Filter or generate league awards for selected country & division
  const countries = [...new Set(S.clubs.map(c => c.country))];
  const targetLeagueAwards = awardsRecord.leagues?.find(l => l.country === country && l.division === division);

  // Fallback league calculation if not in archive or live preview
  const divClubs = S.clubs.filter(c => c.country === country && c.division === division);
  const divPlayers = [];
  divClubs.forEach(c => {
    (c.players || []).forEach(pid => {

      if (p) divPlayers.push({ p, club: c });

  divPlayers.sort((a, b) => ((b.p.rating || 70) * 1.5 + (b.p.goalsScored || 0) * 3) - ((a.p.rating || 70) * 1.5 + (a.p.goalsScored || 0) * 3));

    name: divPlayers[0].p.name,
    club: divPlayers[0].club.name,
    rating: divPlayers[0].p.rating,
    position: divPlayers[0].p.position
  } : null);

  const leagueGB = targetLeagueAwards?.goldenBoot || (divPlayers[0] ? {

    club: [...divPlayers].sort((a, b) => (b.p.goalsScored || 0) - (a.p.goalsScored || 0))[0]?.club.name || divPlayers[0].club.name,
    goals: [...divPlayers].sort((a, b) => (b.p.goalsScored || 0) - (a.p.goalsScored || 0))[0]?.p.goalsScored || 0

function launchGlobalTournamentNow() {
  post('/api/world4/tournament', ref({})).then(data => {
    if (data.tournament) S.globalTournament = data.tournament;
    renderGame();
    switchTab('tournament');
  }).catch(err => {
    // Call GET fallback
    get('/api/world4/tournament').then(d => {
      if (d.tournament) S.globalTournament = d.tournament;
      renderGame();
      switchTab('tournament');
    }).catch(e => alert(e.message));
  });
}

function simulateTournamentRoundUI() {
  post('/api/world4/tournament/simulate', ref({})).then(data => {
    if (data.error) return alert(data.error);
    if (data.tournament) S.globalTournament = data.tournament;
    playSfx('deal');
    renderGame();
    switchTab('tournament');
  }).catch(err => alert(err.message));
}

function respondToIncomingOfferUI(offerId, decision, currentFee = 10) {
  let counterFee = null;
  if (decision === 'counter') {
    const suggested = Math.round(currentFee * 1.25 * 10) / 10;
    const input = prompt(`Enter your counter-offer price in ₹ Millions (Current offer is ₹${currentFee}M):`, String(suggested));
    if (!input) return;
    counterFee = Number(input);
    if (isNaN(counterFee) || counterFee <= 0) return alert('Invalid counter price.');
  }

  post('/api/world4/offers/respond', ref({ offerId, decision, counterFee })).then(res => {
    if (res.error) return alert(res.error);

    if (res.status === 'accepted') {
      playSfx('deal');
      triggerLiveBudgetUpdate(`🤝 Transfer Complete: Sold player for ₹${money(res.cashGained)}M!`, 'revenue');
    } else if (res.status === 'rejected') {
      playSfx('kick');
    }

    alert(res.message);
    document.getElementById('incomingOffersModal')?.remove();
    renderGame();
  }).catch(err => alert(err.message));
}

function solicitMarketInterest() {
  post('/api/world4/offers/generate', ref({ count: 2 })).then(res => {
    playSfx('deal');
    alert(`📢 Scouts from ${res.offers?.length || 2} rival clubs responded to your inquiry! Review incoming transfer bids in your inbox.`);
    renderGame();
    openIncomingOffersModal();
  }).catch(err => alert(err.message));
}

function calculateClientBudget(c) {
  if (!c) return null;
  const myPlayers = (S?.market || []).filter(p => p.ownerClub === c.name);
  const totalSquadSalary = myPlayers.reduce((sum, p) => sum + (p.contract?.salary || 0.45), 0);
  const managerSalary = c.manager?.salary || 0.4;
  const wageBillAnnual = Math.round((totalSquadSalary + managerSalary) * 10) / 10;
  const wageBillPerMatch = Math.round((wageBillAnnual / 24) * 100) / 100;

  const stadiumCap = c.stadium?.capacity || 20000;
  const projectedAttendance = c.lastProjectedAttendance || Math.round(stadiumCap * ((c.popularity || 60) / 100));
  const ticketPrice = c.ticketPrice || 350;
  const ticketRevPerMatch = Math.round(((projectedAttendance * ticketPrice) / 1000000) * 100) / 100;

  const merchUnit = c.merchandise || 60;
  const merchRevPerMatch = Math.round(((projectedAttendance * merchUnit * 0.35) / 1000000) * 100) / 100;

  const sponsorAnnual = c.sponsor ? (c.sponsor.value || 2.5) : 1.5;
  const sponsorPerMatch = Math.round((sponsorAnnual / 24) * 100) / 100;

  const projectedRevPerMatch = Math.round((ticketRevPerMatch + merchRevPerMatch + sponsorPerMatch) * 100) / 100;
  const netCashflowPerMatch = Math.round((projectedRevPerMatch - wageBillPerMatch) * 100) / 100;
  const projectedTurnoverAnnual = Math.round((projectedRevPerMatch * 24) * 10) / 10;
  const ffpRatio = projectedTurnoverAnnual > 0 ? Math.round((wageBillAnnual / projectedTurnoverAnnual) * 100) : 65;

  let ffpGrade = 'A';
  let ffpStatus = 'EXCELLENT';
  let ffpColor = '#00e599'; // Emerald
  if (ffpRatio > 85 || (c.cash || 0) < 1.0) {
    ffpGrade = 'D';
    ffpStatus = 'FFP RISK';
    ffpColor = '#ef4444'; // Red
  } else if (ffpRatio > 70) {
    ffpGrade = 'C';
    ffpStatus = 'MONITORED';
    ffpColor = '#eab308'; // Amber
  } else if (ffpRatio > 52) {
    ffpGrade = 'B';
    ffpStatus = 'HEALTHY';
    ffpColor = '#00f0ff'; // Cyan
  }

  const transferWarChest = Math.max(0, Math.round(((c.cash || 0) * 0.6) * 10) / 10);
  const wageReserve = Math.max(0, Math.round(((c.cash || 0) * 0.3) * 10) / 10);
  const emergencyReserve = Math.max(0, Math.round(((c.cash || 0) * 0.1) * 10) / 10);

  const budgetObj = {
    cash: Math.round((c.cash || 0) * 10) / 10,
    wageBillAnnual,
    wageBillPerMatch,
    projectedRevPerMatch,
    ticketRevPerMatch,
    merchRevPerMatch,
    sponsorPerMatch,
    sponsorAnnual,
    netCashflowPerMatch,
    projectedTurnoverAnnual,
    ffpRatio,
    ffpGrade,
    ffpStatus,
    ffpColor,
    transferWarChest,
    wageReserve,
    emergencyReserve
  };

  c.budget = budgetObj;
  return budgetObj;
}

function triggerLiveBudgetUpdate(feedbackText = null, feedbackType = 'info') {
  if (!S) return;
  const c = S.clubs?.find(x => x.name === S.selectedClub);
  if (!c) return;

  const b = calculateClientBudget(c);
  const container = document.getElementById('headerLiveBudgetTracker');
  if (container) {
    container.outerHTML = renderHeaderBudgetTrackerHtml(c, b);
  }

  const pulseTag = document.getElementById('budgetTrackerPulseTag');
  if (pulseTag && feedbackText) {
    pulseTag.textContent = feedbackText;
    pulseTag.style.display = 'inline-block';
    pulseTag.style.background = feedbackType === 'error' ? '#ef4444' : feedbackType === 'salary' ? '#06b6d4' : feedbackType === 'transfer' ? '#10b981' : feedbackType === 'revenue' ? '#f59e0b' : '#0284c7';
    clearTimeout(window._budgetPulseTimeout);
    window._budgetPulseTimeout = setTimeout(() => {
      const t = document.getElementById('budgetTrackerPulseTag');
      if (t) t.style.display = 'none';
    }, 4000);
  }

  // Save session state to ensure full persistence
  save();
}

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div>
            <div class="card-kicker" style="color:var(--accent-neon);">SQUAD FINANCIAL GOVERNANCE</div>
            <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:#fff;margin:2px 0 0 0;">
              Contract &amp; Salary Renegotiation
            </h2>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('contractRenewalModal').remove()">✕</button>
        </div>

        <!-- Player Header Brief -->
        <div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:12px;padding:12px 16px;margin-bottom:18px;">
          <div class="pos-badge ${p.position === 'GK' ? 'gk' : ['CB','LB','RB'].includes(p.position) ? 'def' : ['CMF','DMF','AMF'].includes(p.position) ? 'mid' : 'att'}" style="font-size:12px;width:38px;height:38px;">
            ${esc(p.position || 'CF')}
          </div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;">
              <b style="font-size:16px;color:#fff;">${esc(p.name)}</b>
              <span style="font-size:11px;color:var(--accent-gold);font-weight:700;">★ ${p.rating} OVR</span>
              <span class="pill" style="font-size:9.5px;background:rgba(255,255,255,0.06);">${p.age} yrs</span>
            </div>
            <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">
              Current Terms: <b>₹${money(curSalary)}M / season</b> · ${curYears} years remaining
            </div>
          </div>
        </div>

        <!-- Controls for Salary & Extensions -->
        <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:20px;">
          <!-- Salary Slider -->
          <div class="form-group" style="background:var(--bg-card-subtle);padding:14px;border-radius:10px;border:1px solid var(--border-subtle);">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
              <label style="font-size:12px;font-weight:800;color:#fff;">PROPOSED ANNUAL SALARY</label>
              <span style="font-family:var(--font-display);font-size:18px;font-weight:900;color:var(--accent-gold);">
                ₹${money(newSalary)}M / yr
              </span>
            </div>
            <input id="renewSalarySlider" type="range" min="0.3" max="30" step="0.1" value="${newSalary}" style="width:100%;accent-color:var(--accent-gold);" oninput="updateRenewalDraft()">
            <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-top:4px;">
              <span>Min: ₹0.3M/yr</span>
              <span>Wage Delta: <b style="color:${wageDelta>=0?'var(--accent-gold)':'var(--accent-neon)'};">${wageDelta>=0?'+':''}₹${money(wageDelta)}M/yr</b></span>
              <span>Max: ₹30.0M/yr</span>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <!-- Contract Extension Length -->
            <div class="form-group" style="background:var(--bg-card-subtle);padding:12px;border-radius:10px;border:1px solid var(--border-subtle);">
              <label style="font-size:11px;font-weight:800;color:#fff;">EXTENSION DURATION</label>
              <select id="renewYearsSelect" class="form-control" style="margin-top:6px;" onchange="updateRenewalDraft()">
                <option value="1" ${extYears===1?'selected':''}>+1 Year Extension (${curYears+1} yrs total)</option>
                <option value="2" ${extYears===2?'selected':''}>+2 Years Extension (${curYears+2} yrs total)</option>
                <option value="3" ${extYears===3?'selected':''}>+3 Years Extension (${curYears+3} yrs total)</option>
                <option value="4" ${extYears===4?'selected':''}>+4 Years Extension (${curYears+4} yrs total)</option>
              </select>
            </div>

            <!-- Signing Loyalty Bonus -->
            <div class="form-group" style="background:var(--bg-card-subtle);padding:12px;border-radius:10px;border:1px solid var(--border-subtle);">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <label style="font-size:11px;font-weight:800;color:#fff;">SIGNING BONUS</label>
                <span id="bonusDisplay" style="font-size:13px;font-weight:900;color:var(--accent-neon);">₹${money(signingBonus)}M</span>
              </div>
              <input id="renewBonusSlider" type="range" min="0" max="${Math.min(10, Math.floor(c.cash))}" step="0.5" value="${signingBonus}" style="width:100%;accent-color:var(--accent-neon);margin-top:8px;" oninput="updateRenewalDraft()">
              <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">Paid upfront from Treasury</div>
            </div>
          </div>
        </div>

        <!-- Live Impact Feedback Grid -->
        <div style="background:rgba(0,240,255,0.04);border:1px solid rgba(0,240,255,0.25);border-radius:12px;padding:14px;margin-bottom:20px;">
          <div style="font-size:11px;font-weight:800;color:var(--accent-neon);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
            <span>⚡ REAL-TIME FINANCIAL HEALTH AUDIT PREVIEW</span>
          </div>

          <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;text-align:center;">
            <div style="background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;">
              <div style="font-size:10px;color:var(--text-dim);font-weight:700;">ANNUAL WAGE BILL</div>
              <div style="font-size:15px;font-weight:900;color:#fff;margin-top:2px;">₹${money(newAnnualWage)}M</div>
              <div style="font-size:10px;color:${wageDelta>0?'#fca5a5':'#86efac'};">${wageDelta>=0?'+':''}₹${money(wageDelta)}M delta</div>
            </div>
            <div style="background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;">
              <div style="font-size:10px;color:var(--text-dim);font-weight:700;">MATCHDAY CASHFLOW</div>
              <div style="font-size:15px;font-weight:900;color:${newCashflow>=0?'var(--accent-neon)':'#ff4757'};margin-top:2px;">
                ${newCashflow>=0?'+':''}₹${money(newCashflow)}M/m
              </div>
              <div style="font-size:10px;color:var(--text-muted);">vs ₹${money(b.netCashflowPerMatch)}M now</div>
            </div>
            <div style="background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;">
              <div style="font-size:10px;color:var(--text-dim);font-weight:700;">FFP WAGE RATIO</div>
              <div style="font-size:15px;font-weight:900;color:${newFfpRatio>70?'#fca5a5':'#86efac'};margin-top:2px;">
                ${newFfpRatio}%
              </div>
              <div style="font-size:10px;color:${newFfpRatio>70?'#ef4444':'#22c55e'};font-weight:700;">
                ${newFfpRatio>85?'FFP Risk':newFfpRatio>70?'Monitored':'Healthy'}
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" style="flex:1;padding:12px;font-weight:800;background:linear-gradient(90deg, #0284c7, #06b6d4);" onclick="submitContractRenewal('${p.id}')">
            ✍️ SEAL CONTRACT TERMS (₹${money(newSalary)}M/yr)
          </button>
          <button class="btn btn-secondary" style="padding:12px 18px;" onclick="document.getElementById('contractRenewalModal').remove()">
            CANCEL
          </button>
        </div>
      </div>
    `;
  }

  window.updateRenewalDraft = function() {
    const sEl = document.getElementById('renewSalarySlider');
    const yEl = document.getElementById('renewYearsSelect');
    const bEl = document.getElementById('renewBonusSlider');
    if (sEl) newSalary = +sEl.value;
    if (yEl) extYears = +yEl.value;
    if (bEl) signingBonus = +bEl.value;
    overlay.innerHTML = renderRenewalContent();
  };

  window.submitContractRenewal = function(playerId) {
    post('/api/world4/contract/update', ref({
      club: S.selectedClub,
      playerId,
      salary: newSalary,
      signingBonus
    })).then(res => {
      if (res.state) S = res.state;
      document.getElementById('contractRenewalModal')?.remove();
      playSfx('deal');
      playSfx('applause');
      triggerLiveBudgetUpdate(`⚡ Wage Updated: ${p.name} (₹${money(newSalary)}M/yr)`, 'salary');
      renderGame();
      switchTab('squad');
    }).catch(err => alert(err.message));
  };

  overlay.innerHTML = renderRenewalContent();
  document.body.appendChild(overlay);
}

function openLiveBudgetTrackerModal() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;

  const b = calculateClientBudget(c) || {
    cash: c.cash || 0,
    wageBillAnnual: 12.5,
    wageBillPerMatch: 0.52,
    projectedRevPerMatch: 1.25,
    ticketRevPerMatch: 0.85,
    merchRevPerMatch: 0.25,
    sponsorPerMatch: 0.15,
    sponsorAnnual: 3.6,
    netCashflowPerMatch: 0.73,
    projectedTurnoverAnnual: 30.0,
    ffpRatio: 42,
    ffpGrade: 'A',
    ffpStatus: 'HEALTHY',
    transferWarChest: Math.max(0, Math.round((c.cash * 0.6) * 10) / 10),
    wageReserve: Math.max(0, Math.round((c.cash * 0.3) * 10) / 10),
    emergencyReserve: Math.max(0, Math.round((c.cash * 0.1) * 10) / 10)
  };

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'liveBudgetModal';

  overlay.innerHTML = `
    <div class="modal-box" style="width:min(680px, 96vw);max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div>
          <div class="card-kicker" style="color:var(--accent-neon);">TREASURY &amp; FINANCIAL FAIR PLAY</div>
          <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:#fff;margin:2px 0 0 0;">
            Live Club Budget Tracker
          </h2>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('liveBudgetModal').remove()">✕ CLOSE</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:16px;">
        <div style="background:var(--bg-card-subtle);padding:12px;border-radius:10px;border:1px solid var(--border-subtle);text-align:center;">
          <div style="font-size:10px;color:var(--text-dim);font-weight:800;">TRANSFER WAR CHEST</div>
          <div style="font-size:20px;font-weight:900;color:var(--accent-gold);margin-top:2px;">₹${money(b.transferWarChest)}M</div>
          <div style="font-size:10px;color:var(--text-muted);">60% Available</div>
        </div>
        <div style="background:var(--bg-card-subtle);padding:12px;border-radius:10px;border:1px solid var(--border-subtle);text-align:center;">
          <div style="font-size:10px;color:var(--text-dim);font-weight:800;">WAGE RESERVE</div>
          <div style="font-size:20px;font-weight:900;color:var(--accent-neon);margin-top:2px;">₹${money(b.wageReserve)}M</div>
          <div style="font-size:10px;color:var(--text-muted);">30% Committed</div>
        </div>
        <div style="background:var(--bg-card-subtle);padding:12px;border-radius:10px;border:1px solid var(--border-subtle);text-align:center;">
          <div style="font-size:10px;color:var(--text-dim);font-weight:800;">EMERGENCY CUSHION</div>
          <div style="font-size:20px;font-weight:900;color:#38bdf8;margin-top:2px;">₹${money(b.emergencyReserve)}M</div>
          <div style="font-size:10px;color:var(--text-muted);">10% Liquidity</div>
        </div>
      </div>

      <div style="background:rgba(0,0,0,0.25);border-radius:12px;padding:14px;border:1px solid var(--border-subtle);margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;color:#fff;font-weight:700;">Net Matchday Cashflow:</span>
          <b style="font-size:16px;color:${b.netCashflowPerMatch>=0?'var(--accent-neon)':'#ff4757'};">
            ${b.netCashflowPerMatch>=0?'+':''}₹${money(b.netCashflowPerMatch)}M / match
          </b>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;color:#fff;font-weight:700;">FFP Compliance Rating:</span>
          <span class="pill" style="font-size:10px;font-weight:900;background:${b.ffpGrade==='D'?'rgba(239,68,68,0.2)':'rgba(34,197,94,0.2)'};color:${b.ffpGrade==='D'?'#fca5a5':'#86efac'};border:1px solid ${b.ffpGrade==='D'?'#ef4444':'#22c55e'};">
            Grade ${b.ffpGrade} · ${b.ffpStatus}
          </span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:#fff;font-weight:700;">Wage-to-Turnover Ratio:</span>
          <b style="font-size:14px;color:#fff;">${b.ffpRatio}% (Cap: 70%)</b>
        </div>
      </div>

      <!-- Recent Audit Snippet -->
      <div style="margin-bottom:20px;">
        <div style="font-size:11px;color:var(--text-dim);font-weight:800;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;">
          RECENT AUDIT LEDGER ENTRIES
        </div>
        <div style="max-height:160px;overflow-y:auto;background:var(--bg-card-subtle);border-radius:10px;padding:8px;border:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:6px;">
          ${(c.transactions && c.transactions.length ? c.transactions.slice(0, 5) : [
            { date: `Season ${S.season}`, description: 'Owner Treasury Initial Allocation', amount: c.cash, type: 'income' }
          ]).map(tx => `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,0.03);">
              <div>
                <b style="color:#fff;">${esc(tx.description)}</b>
                <div style="font-size:10.5px;color:var(--text-dim);">${esc(tx.date || 'Season 1')}</div>
              </div>
              <b style="font-weight:800;color:${tx.type==='income'?'var(--accent-neon)':'#ff4757'};">
                ${tx.type==='income'?'+':'-'}₹${money(tx.amount)}M
              </b>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" style="flex:1;padding:12px;font-weight:800;" onclick="document.getElementById('liveBudgetModal').remove(); switchTab('stadium');">
          📊 OPEN FULL FINANCIAL DASHBOARD &amp; LEDGER
        </button>
        <button class="btn btn-secondary" style="padding:12px 18px;" onclick="document.getElementById('liveBudgetModal').remove()">
          CLOSE
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);
}

// Initial Boot
if (session?.soloId || session?.roomCode) {
  resumeSession();
} else {
  modeScreen();
}
</script>
</body>
</html>
