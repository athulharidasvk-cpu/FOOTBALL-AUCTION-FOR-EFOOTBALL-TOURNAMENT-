
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Auction</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #183b2a 0%, #07110d 45%, #030605 100%);
  color: white;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  background: rgba(0,255,120,.12);
  border: 1px solid #22c55e;
  padding: 8px 13px;
  border-radius: 20px;
  font-size: 13px;
}

/* PANELS */

.panel {
  background: rgba(10,20,16,.85);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h2 {
  margin-top: 0;
}

/* INPUTS */

input {
  width: 100%;
  max-width: 300px;
  padding: 13px;
  margin: 5px;
  border: 1px solid #334155;
  border-radius: 9px;
  background: #0f172a;
  color: white;
  font-size: 15px;
}

button {
  border: none;
  padding: 13px 18px;
  margin: 5px;
  border-radius: 9px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: scale(.97);
}

/* AUCTION AREA */

.auction {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* PLAYER CARD */

.player-card {

  width: min(370px, 92vw);
  min-height: 540px;

  position: relative;
  overflow: hidden;

  border-radius: 25px;

  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,.2), transparent 25%),
    linear-gradient(145deg,#0f5132,#06321f 45%,#020b07);

  border: 2px solid #d7b85c;

  box-shadow:
    0 0 20px rgba(255,205,70,.25),
    0 25px 70px rgba(0,0,0,.7);

  transition: .35s;
}

.player-card.active {
  animation: cardPulse 1.5s infinite alternate;
}

@keyframes cardPulse {

  from {
    box-shadow:
      0 0 15px rgba(255,215,70,.25),
      0 25px 70px rgba(0,0,0,.7);
  }

  to {
    box-shadow:
      0 0 35px rgba(255,215,70,.8),
      0 25px 70px rgba(0,0,0,.8);
  }

}

/* CARD SHINE */

.player-card::before {
  content: "";
  position: absolute;
  width: 180%;
  height: 100%;
  top: -50%;
  left: -120%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );

  transform: rotate(20deg);
  animation: shine 5s infinite;
}

@keyframes shine {

  0% {
    left: -120%;
  }

  40%,100% {
    left: 130%;
  }

}

/* CARD TOP */

.card-top {
  position: relative;
  z-index: 2;

  display: flex;
  justify-content: space-between;

  padding: 20px;
}

.rating {
  font-size: 50px;
  font-weight: 900;
  line-height: .8;
}

.position {
  font-size: 14px;
  margin-top: 8px;
  color: #d6d6d6;
}

.style {
  text-align: right;
  font-size: 12px;
  color: #f5d76e;
  font-weight: bold;
}

/* PLAYER IMAGE */

.player-photo {

  position: relative;
  z-index: 2;

  height: 220px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 110px;
  font-weight: 900;

  color: rgba(255,255,255,.9);

  text-shadow:
    0 5px 15px black;
}

.player-photo span {
  background:
    linear-gradient(180deg,#ffffff,#b7b7b7);

  -webkit-background-clip: text;
  color: transparent;
}

/* CARD INFO */

.card-info {

  position: relative;
  z-index: 2;

  padding: 0 22px;
}

.player-name {
  font-size: 28px;
  font-weight: 900;
  text-transform: uppercase;
}

.club {
  margin-top: 5px;
  color: #cbd5e1;
  font-size: 14px;
}

/* STATS */

.stats {

  display: grid;
  grid-template-columns: repeat(3,1fr);

  gap: 8px;

  margin-top: 20px;
}

.stat {

  background: rgba(0,0,0,.3);
  border: 1px solid rgba(255,255,255,.08);

  border-radius: 10px;

  padding: 9px;

  text-align: center;
}

.stat strong {
  display: block;
  font-size: 20px;
}

.stat span {
  font-size: 9px;
  color: #94a3b8;
}

/* BID */

.bid-box {

  position: relative;
  z-index: 2;

  margin: 20px;

  padding: 14px;

  text-align: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      rgba(255,215,80,.2),
      rgba(0,0,0,.3)
    );

  border: 1px solid #b8963e;
}

.bid-label {
  font-size: 11px;
  color: #cbd5e1;
}

.bid-value {
  font-size: 32px;
  font-weight: 900;
  color: #facc15;
}

/* TIMER */

.timer {

  font-size: 40px;
  font-weight: 900;

  margin: 15px;

  color: #4ade80;
}

/* BIDDING */

.bid-button {
  width: min(350px,90vw);
  font-size: 20px;
  padding: 17px;

  background:
    linear-gradient(135deg,#facc15,#eab308);

  color: #111827;
}

.bid-button:hover {
  box-shadow: 0 0 25px rgba(250,204,21,.5);
}

/* HISTORY */

.history {
  max-height: 250px;
  overflow-y: auto;
}

.history-item {

  padding: 10px;

  margin: 6px 0;

  border-radius: 8px;

  background: #111c17;

  border-left: 3px solid #22c55e;
}

/* SOLD */

.sold {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.8);

  z-index: 100;
}

.sold-box {

  text-align: center;

  background: #101b15;

  border: 2px solid #facc15;

  border-radius: 20px;

  padding: 40px;

  animation: soldPop .4s ease;
}

@keyframes soldPop {

  from {
    transform: scale(.5);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}

.sold-title {

  font-size: 50px;
  font-weight: 900;
  color: #facc15;
}

/* RESPONSIVE */

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .player-card {
    min-height: 510px;
  }

  .rating {
    font-size: 45px;
  }

  .player-name {
    font-size: 24px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      ⚽ FOOTBALL AUCTION
    </div>

    <div id="connection" class="status">
      Connecting...
    </div>

  </div>


  <!-- ROOM -->

  <div class="panel">

    <h2>🏟️ Join Auction</h2>

    <input
      id="name"
      placeholder="Your Team Name"
    >

    <input
      id="room"
      placeholder="Room Code"
    >

    <br>

    <button onclick="createRoom()">
      CREATE ROOM
    </button>

    <button onclick="joinRoom()">
      JOIN ROOM
    </button>

    <button onclick="startAuction()">
      ▶ START AUCTION
    </button>

    <p id="roomStatus">
      Create a room or join an existing room.
    </p>

  </div>


  <!-- AUCTION -->

  <div class="panel auction">

    <h2>🔥 LIVE AUCTION</h2>

    <div id="playerCard" class="player-card">

      <div class="card-top">

        <div>

          <div id="rating" class="rating">
            --
          </div>

          <div id="position" class="position">
            --
          </div>

        </div>

        <div>

          <div id="style" class="style">
            WAITING
          </div>

        </div>

      </div>


      <div class="player-photo">

        <span id="playerInitial">
          ⚽
        </span>

      </div>


      <div class="card-info">

        <div id="playerName" class="player-name">
          WAITING FOR PLAYER
        </div>

        <div id="club" class="club">
          --
        </div>


        <div class="stats">

          <div class="stat">
            <strong id="stat1">--</strong>
            <span>ATTACK</span>
          </div>

          <div class="stat">
            <strong id="stat2">--</strong>
            <span>PACE</span>
          </div>

          <div class="stat">
            <strong id="stat3">--</strong>
            <span>OVERALL</span>
          </div>

        </div>

      </div>


      <div class="bid-box">

        <div class="bid-label">
          CURRENT BID
        </div>

        <div id="bid" class="bid-value">
          €0M
        </div>

      </div>

    </div>


    <div id="timer" class="timer">
      20
    </div>


    <button
      class="bid-button"
      onclick="bid()"
    >
      💰 BID +€5M
    </button>

  </div>


  <!-- HISTORY -->

  <div class="panel">

    <h2>📜 Auction History</h2>

    <div
      id="history"
      class="history"
    >
      No auction activity yet.
    </div>

  </div>

</div>


<!-- SOLD POPUP -->

<div
  id="soldPopup"
  class="sold"
>

  <div class="sold-box">

    <div class="sold-title">
      🔨 SOLD!
    </div>

    <h2 id="soldPlayer">
      PLAYER
    </h2>

    <p id="soldBid">
      €0M
    </p>

  </div>

</div>


<script>

/* SOCKET */

const socket = io();

let roomCode = "";


/* PLAYING STYLES */

const playingStyles = {

  "Kylian Mbappé": "Goal Poacher",

  "Vinícius Júnior": "Prolific Winger",

  "Jude Bellingham": "Box-to-Box",

  "Federico Valverde": "Box-to-Box",

  "Lamine Yamal": "Creative Playmaker",

  "Pedri": "Creative Playmaker",

  "Raphinha": "Prolific Winger",

  "Robert Lewandowski": "Goal Poacher",

  "Erling Haaland": "Goal Poacher",

  "Phil Foden": "Creative Playmaker",

  "Rodri": "Anchor Man",

  "Bernardo Silva": "Creative Playmaker",

  "Mohamed Salah": "Prolific Winger",

  "Alessandro Bastoni": "Build Up",

  "Rafael Leão": "Prolific Winger",

  "Theo Hernández": "Offensive Full-back",

  "Mike Maignan": "Offensive Goalkeeper",

  "Christian Pulisic": "Prolific Winger",

  "Dušan Vlahović": "Goal Poacher",

  "Kenan Yıldız": "Creative Playmaker",

  "Nico Williams": "Prolific Winger",

  "Antoine Griezmann": "Deep-Lying Forward"

};


/* CONNECTION */

socket.on("connect", () => {

  document.getElementById("connection").innerText =
    "🟢 CONNECTED";

});


socket.on("disconnect", () => {

  document.getElementById("connection").innerText =
    "🔴 DISCONNECTED";

});


/* CREATE ROOM */

function createRoom() {

  const name =
    document.getElementById("name").value.trim()
    || "Team";

  socket.emit(
    "create",
    { name },
    response => {

      if (!response || !response.ok) {

        alert(
          response?.error ||
          "Could not create room"
        );

        return;
      }

      roomCode = response.code;

      document.getElementById("room").value =
        roomCode;

      document.getElementById("roomStatus").innerText =
        "Room created: " + roomCode;

    }
  );

}


/* JOIN ROOM */

function joinRoom() {

  const name =
    document.getElementById("name").value.trim()
    || "Team";

  const code =
    document
      .getElementById("room")
      .value
      .trim()
      .toUpperCase();

  if (!code) {

    alert("Enter a room code");

    return;
  }

  socket.emit(
    "join",
    { code, name },
    response => {

      if (!response || !response.ok) {

        alert(
          response?.error ||
          "Could not join room"
        );

        return;
      }

      roomCode = code;

      document.getElementById("roomStatus").innerText =
        "Joined room: " + code;

    }
  );

}


/* START */

function startAuction() {

  if (!roomCode) {

    alert(
      "Create or join a room first."
    );

    return;
  }

  socket.emit(
    "start",
    { code: roomCode }
  );

}


/* BID */

function bid() {

  if (!roomCode) {

    alert(
      "Create or join a room first."
    );

    return;
  }

  socket.emit(
    "bid",
    { code: roomCode }
  );

}


/* UPDATE CARD */

function updateCard(current) {

  if (!current) {

    document.getElementById("playerName").innerText =
      "WAITING FOR PLAYER";

    document.getElementById("club").innerText =
      "--";

    document.getElementById("rating").innerText =
      "--";

    document.getElementById("position").innerText =
      "--";

    document.getElementById("style").innerText =
      "WAITING";

    document.getElementById("bid").innerText =
      "€0M";

    document.getElementById("playerInitial").innerText =
      "⚽";

    return;
  }


  const player = current.player;

  const name = player[0];

  const club = player[1];

  const position = player[2];

  const rating = player[3];

  const baseBid = player[4];


  /* PLAYER */

  document.getElementById("playerName").innerText =
    name;

  document.getElementById("club").innerText =
    "🏟️ " + club;

  document.getElementById("rating").innerText =
    rating;

  document.getElementById("position").innerText =
    position;

  document.getElementById("style").innerText =
    playingStyles[name] ||
    "Standard Player";


  /* INITIALS */

  const initials =
    name
      .split(" ")
      .map(x => x[0])
      .slice(0,2)
      .join("");

  document.getElementById("playerInitial").innerText =
    initials;


  /* STATS */

  let attack = rating + 2;
  let pace = rating;

  if (
    playingStyles[name] ===
    "Prolific Winger"
  ) {

    pace = rating + 6;
    attack = rating + 4;

  }

  if (
    playingStyles[name] ===
    "Goal Poacher"
  ) {

    attack = rating + 7;

  }

  if (
    playingStyles[name] ===
    "Anchor Man"
  ) {

    attack = rating - 2;

    pace = rating - 3;

  }

  document.getElementById("stat1").innerText =
    attack;

  document.getElementById("stat2").innerText =
    pace;

  document.getElementById("stat3").innerText =
    rating;


  /* BID */

  document.getElementById("bid").innerText =
    "€" + current.bid + "M";


  /* CARD */

  document
    .getElementById("playerCard")
    .classList.add("active");

}


/* STATE */

socket.on("state", data => {

  if (!data) return;

  updateCard(data.current);


  /* TIMER */

  if (data.current) {

    document.getElementById("timer").innerText =
      data.current.time;

  }


  /* HISTORY */

  if (data.history && data.history.length) {

    document.getElementById("history").innerHTML =
      data.history
        .map(item =>
          `<div class="history-item">${item}</div>`
        )
        .join("");

  }

});


/* TIMER */

socket.on("tick", data => {

  if (!data) return;

  document.getElementById("timer").innerText =
    data.time;

});


/* SOLD */

socket.on("sold", data => {

  if (!data) return;

  document.getElementById("soldPlayer").innerText =
    data.player[0];

  document.getElementById("soldBid").innerText =
    "Sold for €" + data.bid + "M";

  const popup =
    document.getElementById("soldPopup");

  popup.style.display = "flex";

  setTimeout(() => {

    popup.style.display = "none";

  }, 2200);

});


</script>

</body>
</html>
