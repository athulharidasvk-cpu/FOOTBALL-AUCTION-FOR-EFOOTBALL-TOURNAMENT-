function computeClientNextFixture(s) {
  if (cachedNextFixture && cachedNextFixture.matchday === ((s?.matchday || 0) + 1)) {
    return cachedNextFixture;
  }
  const user = s?.clubs?.find(c => c.name === s?.selectedClub);
  if (!user) return null;
  const matchday = (s.matchday || 0) + 1;

  let isGlobalCup = false;
  let gtOpponent = null;
  let gtStage = '';

  if (s.globalTournament && s.globalTournament.status !== 'completed' && matchday % 3 === 0) {
    const gt = s.globalTournament;
    if (gt.status === 'groups') {
      ['A', 'B', 'C', 'D'].forEach(k => {
        if (gt.groups[k]?.standings?.some(x => x.clubName === user.name)) {
          isGlobalCup = true;
          gtStage = `Group ${k} · Matchday ${gt.currentRound || 1}`;
          const oppClub = gt.groups[k].standings.find(x => x.clubName !== user.name);
          if (oppClub) gtOpponent = s.clubs.find(c => c.name === oppClub.clubName);
        }
      });
    } else if (gt.status === 'knockout') {
      const ko = gt.knockout;
      const koMatch = ko.quarterFinals?.find(m => !m.completed && (m.home === user.name || m.away === user.name))
        || ko.semiFinals?.find(m => !m.completed && (m.home === user.name || m.away === user.name))
        || (ko.final && !ko.final.completed && (ko.final.home === user.name || ko.final.away === user.name) ? ko.final : null);
      if (koMatch) {
        isGlobalCup = true;
        gtStage = 'Knockout Elimination';
        const oppName = koMatch.home === user.name ? koMatch.away : koMatch.home;
        gtOpponent = s.clubs.find(c => c.name === oppName);
      }
    }
  }

  let compType = 'league';
  let compLabel = 'REGULAR LEAGUE MATCH';
  let compBadgeColor = '#38bdf8';
  let compIcon = `${svgIcon('shield', 14)} ️`;
  let compStage = `Division ${user.division} · Matchday ${Math.ceil(matchday * 0.75)}`;
  let opp = null;
  let stakes = '+3 Points towards Division Title & Promotion';
  let winBonus = 0.5;

  if (isGlobalCup && gtOpponent) {
    compType = 'global_cup';
    compLabel = 'GLOBAL CLUB WORLD CUP';
    compBadgeColor = '#f59e0b';
    compIcon = `${svgIcon('globe', 14)} `;
    compStage = gtStage || 'Tournament Matchday';
    opp = gtOpponent;
    winBonus = 12.5;
    stakes = `Global Cup Group Progression · ₹${winBonus}M Bonus`;
  } else if ((user.division === 1 || (user.reputation || 60) >= 80) && (matchday % 4 === 0)) {
    compType = 'champions_league';
    compLabel = 'UEFA CHAMPIONS LEAGUE';
    compBadgeColor = '#818cf8';
    compIcon = '⭐';
    compStage = `Continental Fixture · MD ${Math.ceil(matchday / 4)}`;
    winBonus = 8.0;
    stakes = 'European Prestige & Continental Progression';
    const foreignPool = s.clubs.filter(c => c.name !== user.name && c.country !== user.country && c.division === 1);
    opp = foreignPool[matchday % (foreignPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else if (user.division === 2 && (matchday % 4 === 0)) {
    compType = 'conference_league';
    compLabel = 'UEFA CONFERENCE LEAGUE';
    compBadgeColor = '#10b981';
    compIcon = `${svgIcon('medal', 14)} `;
    compStage = `Knockout Playoff · Matchday ${matchday}`;
    winBonus = 4.0;
    stakes = 'Continental Conference Advancement';
    const foreignPool = s.clubs.filter(c => c.name !== user.name && c.country !== user.country && c.division <= 2);
    opp = foreignPool[matchday % (foreignPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else if (matchday % 4 === 0) {
    compType = 'domestic_cup';
    compLabel = 'DOMESTIC FA CUP';
    compBadgeColor = '#ef4444';
    compIcon = `${svgIcon('trophy', 14)} `;
    compStage = matchday === 4 ? 'Round of 16' : matchday === 8 ? 'Quarter-Final' : matchday === 12 ? 'Semi-Final' : 'Cup Final';
    winBonus = 2.0;
    stakes = 'Knockout Cup Tie · Single-Leg Elimination';
    const cupPool = s.clubs.filter(c => c.name !== user.name && c.country === user.country);
    opp = cupPool[matchday % (cupPool.length || 1)] || s.clubs.find(c => c.name !== user.name);
  } else {
    const leagueClubs = s.clubs.filter(c => c.country === user.country && c.division === user.division && c.name !== user.name);
    const rival = leagueClubs.find(c => c.name === user.rivalName);
    if (rival && (matchday === 3 || matchday === 7 || matchday === 11)) {
      opp = rival;
      stakes = `${svgIcon('flame', 14)}  HEATED LOCAL DERBY vs ${rival.name} (+3 Pts & Fan Pride)`;
    } else {
      opp = leagueClubs[matchday % (leagueClubs.length || 1)] || s.clubs.find(c => c.name !== user.name);
    }
  }

  if (!opp) opp = s.clubs.find(c => c.name !== user.name) || { name: 'Rival FC', country: user.country, division: user.division, reputation: 60 };

  const isHome = matchday % 2 !== 0;
  const oppPlayers = s.market.filter(p => p.ownerClub === opp.name);
  const oppOvr = oppPlayers.length ? Math.round(oppPlayers.reduce((a, b) => a + b.rating, 0) / oppPlayers.length) : (opp.reputation || 60);
  const oppKeyPlayer = oppPlayers.sort((a, b) => b.rating - a.rating)[0];

  const userPlayers = s.market.filter(p => p.ownerClub === user.name);
  const userOvr = userPlayers.length ? Math.round(userPlayers.reduce((a, b) => a + b.rating, 0) / userPlayers.length) : 64;

  return {
    matchday,
    compType,
    compLabel,
    compBadgeColor,
    compIcon,
    compStage,
    fullTitle: `${compLabel} · ${compStage}`,
    isHome,
    stadium: isHome ? (user.stadium?.name || `${user.name} Ground`) : (opp.stadium?.name || `${opp.name} Arena`),
    homeTeam: isHome ? user.name : opp.name,
    awayTeam: isHome ? opp.name : user.name,
    userTeam: {
      name: user.name,
      division: user.division,
      rating: userOvr,
      crest: user.crest || 'crest_lion',
      jersey: user.jersey || { home: '#0f172a' }
    },
    opponent: {
      name: opp.name,
      country: opp.country,
      division: opp.division,
      reputation: opp.reputation || 60,
      crest: opp.crest || 'crest_lion',
      jersey: opp.jersey || { home: '#1e293b' },
      rating: oppOvr,
      keyPlayer: oppKeyPlayer ? { name: oppKeyPlayer.name, rating: oppKeyPlayer.rating, position: oppKeyPlayer.position } : null
    },
    stakes,
    winBonus
  };
}

function startInteractiveLiveMatch(m) {
  const isHome = m.home === S.selectedClub;

  activeLiveMatch = {
    result: m,
    minute: 0,
    currentHomeGoals: 0,
    currentAwayGoals: 0,
    events: [],
    ballX: 50,
    ballY: 50,
    possession: { home: 52, away: 48 },
    shots: { home: 1, away: 1 },
    timer: null,
    finished: false,
    mentality: clientSelectedMentality || 'balanced',
    tacticalStyle: 'tiki_taka',
    stamina: 100,
    isHalftime: false,
    halftimeTalkGiven: false,
    halftimeTalk: null,
    step: 0
  };

  currentTab = 'matchday';
  renderGame();

  resumeInteractiveMatch();
}

function resumeInteractiveMatch() {
  if (!activeLiveMatch) return;
  const m = activeLiveMatch.result;
  const minutes = [15, 30, 45, 60, 75, 90];

  activeLiveMatch.timer = setInterval(() => {
    if (!activeLiveMatch) {
      clearInterval(activeLiveMatch?.timer);
      return;
    }
    const step = activeLiveMatch.step;
    const min = minutes[step];
    activeLiveMatch.minute = min;

    activeLiveMatch.ballX = 25 + Math.floor(Math.random() * 50);
    activeLiveMatch.ballY = 25 + Math.floor(Math.random() * 50);
    activeLiveMatch.shots.home += Math.random() > 0.4 ? 1 : 0;
    activeLiveMatch.shots.away += Math.random() > 0.4 ? 1 : 0;

    // Stamina decay based on style
    const fatigueRate = activeLiveMatch.tacticalStyle === 'gegenpress' ? 7 : activeLiveMatch.tacticalStyle === 'park_bus' ? 3 : 5;
    activeLiveMatch.stamina = Math.max(35, (activeLiveMatch.stamina || 100) - fatigueRate);

    // Halftime Pause at Minute 45
    if (min === 45 && !activeLiveMatch.halftimeTalkGiven) {
      clearInterval(activeLiveMatch.timer);
      activeLiveMatch.isHalftime = true;
      playSfx('whistle');
      activeLiveMatch.events.unshift({
        min: 45,
        icon: '⏸️',
        text: `HALFTIME: The referee sounds the whistle for the interval. Both teams head to the dressing room.`
      });
      renderGame();
      return;
    }

    // Dramatic VAR check around minute 75
    if (min === 75 && !activeLiveMatch.varTriggered && Math.random() > 0.3) {
      activeLiveMatch.varTriggered = true;
      triggerLiveVarIncident();
      return;
    }

    if (min >= 30 && activeLiveMatch.currentHomeGoals < m.homeGoals && Math.random() > 0.25) {
      activeLiveMatch.currentHomeGoals++;
      activeLiveMatch.events.unshift({
        min,
        icon: `${svgIcon('ball', 14)} `,
        text: `GOAL! ${m.home} hits the target with power!`
      });
      playSfx('goal');
    } else if (min >= 30 && activeLiveMatch.currentAwayGoals < m.awayGoals && Math.random() > 0.25) {
      activeLiveMatch.currentAwayGoals++;
      activeLiveMatch.events.unshift({
        min,
        icon: `${svgIcon('ball', 14)} `,
        text: `GOAL! ${m.away} breaks through the defensive line!`
      });
      playSfx('goal');
    } else {
      const commentary = [
        `High pressing in midfield, maintaining tactical shape.`,
        `Fierce strike on goal! Excellent save by the goalkeeper.`,
        `Dangerous cross into the box cleared by defense.`,
        `Clean interception and quick counter-attack launched.`,
        `Solid midfield duel won, recycling possession.`
      ];
      activeLiveMatch.events.unshift({
        min,
        icon: `${svgIcon('lightning', 14)} `,
        text: commentary[step % commentary.length]
      });
    }

    activeLiveMatch.step++;
    if (activeLiveMatch.step >= minutes.length) {
      activeLiveMatch.currentHomeGoals = m.homeGoals;
      activeLiveMatch.currentAwayGoals = m.awayGoals;
      clearInterval(activeLiveMatch.timer);
      activeLiveMatch.finished = true;
      playSfx('whistle');
    }

    const scoreBox = document.getElementById('liveScoreBox');
    const clockBox = document.getElementById('liveClockBox');
    const ballInd = document.getElementById('liveBallIndicator');
    const feedBox = document.getElementById('liveEventsFeed');
    if (scoreBox && clockBox && ballInd && feedBox && !activeLiveMatch.isHalftime) {
      scoreBox.innerHTML = `${activeLiveMatch.currentHomeGoals} - ${activeLiveMatch.currentAwayGoals}`;
      clockBox.innerHTML = `${activeLiveMatch.minute}' ${activeLiveMatch.finished ? '(FULL TIME)' : ''}`;
      ballInd.style.left = `${activeLiveMatch.ballX}%`;
      ballInd.style.top = `${activeLiveMatch.ballY}%`;
      feedBox.innerHTML = activeLiveMatch.events.map(e => `
        <div class="live-event-pill">
          <b style="color:var(--accent-gold);">${e.min}'</b> <span>${e.icon}</span> <span>${esc(e.text)}</span>
        </div>
      `).join('');
      if (activeLiveMatch.finished) {
        renderGame();
        if (window.autoSaveManager) window.autoSaveManager.triggerEventSave('match', 'Live Match Full Time');
      }
    } else {
      renderGame();
    }
  }, 350);
}

function deliverHalftimeTalk(talkType) {
  if (!activeLiveMatch) return;
  activeLiveMatch.halftimeTalk = talkType;
  activeLiveMatch.halftimeTalkGiven = true;
  activeLiveMatch.isHalftime = false;
  activeLiveMatch.step++; // advance past 45' to 60'

  let talkText = '';
  if (talkType === 'hairdryer') {
    talkText = `${svgIcon('flame', 14)}  "THAT FIRST HALF WAS UNACCEPTABLE! WAKE UP OR FACE THE BENCH!" Teacups flew in the dressing room!`;
    playSfx('whistle');
  } else if (talkType === 'demand_more') {
    talkText = `${svgIcon('flame', 14)}  "Show our true grit! Attack with courage and fight for every inch!"`;
  } else if (talkType === 'tighten_defense') {
    talkText = `${svgIcon('shield', 14)} ️ "Stay compact, tighten the backline and eliminate careless errors!"`;
  } else {
    talkText = `${svgIcon('lightning', 14)}  "Suffocate them with aggressive high-pressing and fast transitions!"`;
  }

  post('/api/world4/match/halftime-talk', ref({ talkType })).catch(()=>{});

  activeLiveMatch.events.unshift({
    min: 45,
    icon: talkType === 'hairdryer' ? `${svgIcon('flame', 14)} ` : `${svgIcon('chat', 14)} `,
    text: `HALFTIME TALK: Manager rallied squad: ${talkText} The players re-enter the pitch fired up!`
  });
  playSfx('applause');
  renderGame();
  resumeInteractiveMatch();
}

function triggerLiveTouchlineShout(shout) {
  if (!activeLiveMatch) return;
  const shouts = {
    demand_more: { icon: `${svgIcon('flame', 14)} `, label: 'DEMAND MORE!', desc: 'Manager bellows from the touchline urging players to attack with fire and fury!' },
    focus: { icon: `${svgIcon('brain', 14)} `, label: 'FOCUS & CONCENTRATE!', desc: 'Manager commands defensive compactness and relentless concentration!' },
    encourage: { icon: `${svgIcon('applause', 14)} `, label: 'ENCOURAGE!', desc: 'Manager applauds and inspires the squad to stay resolute and confident!' },
    tighten_up: { icon: `${svgIcon('shield', 14)} ️`, label: 'TIGHTEN UP!', desc: 'Manager orders central channels sealed to deny opposition transition paths!' },
    berate: { icon: `${svgIcon('flame', 14)} `, label: 'BERATE!', desc: 'Fierce fiery outburst from technical area! Player determination surging.' }
  };
  const s = shouts[shout] || shouts.demand_more;
  playSfx('whistle');
  activeLiveMatch.events.unshift({
    min: activeLiveMatch.minute || 1,
    icon: s.icon,
    text: `TOUCHLINE SHOUT [${s.label}]: ${s.desc}`
  });
  if (shout === 'demand_more') {
    activeLiveMatch.shots.home += 1;
    activeLiveMatch.stamina = Math.max(25, (activeLiveMatch.stamina || 100) - 5);
  } else if (shout === 'focus' || shout === 'tighten_up') {
    activeLiveMatch.shots.away = Math.max(0, (activeLiveMatch.shots.away || 1) - 1);
  }
  const feedBox = document.getElementById('liveEventsFeed');
  if (feedBox) {
    feedBox.innerHTML = activeLiveMatch.events.map(e => `
      <div class="live-event-pill">
        <b style="color:var(--accent-gold);">${e.min}'</b> <span>${e.icon}</span> <span>${esc(e.text)}</span>
      </div>
    `).join('');
  }
}

function executeLiveMatchSub(pid) {
  const p = S.market.find(x => x.id === pid);
  const modal = document.getElementById('quickSubModal');
  if (modal) modal.remove();
  if (!p || !activeLiveMatch) return;

  activeLiveMatch.events.unshift({
    min: activeLiveMatch.minute || 60,
    icon: `${svgIcon('refresh', 14)} `,
    text: `SUBSTITUTION: ${esc(p.name)} (${p.position} · ${p.rating} OVR) enters the pitch with fresh legs and high energy!`
  });
  playSfx('whistle');
  renderGame();
}

function finishInteractiveMatch() {
  if (!activeLiveMatch) return;
  if (activeLiveMatch.timer) clearInterval(activeLiveMatch.timer);
  const m = activeLiveMatch.result;
  activeLiveMatch = null;
  openMatchModal(m);
  renderGame();
}

function conductSquadBonding() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;
  if ((c.cash || 0) < 0.15) return alert('Insufficient treasury funds! Retreat costs ₹0.15M.');

  c.cash = Math.round((c.cash - 0.15) * 100) / 100;
  if (S.chemistry) {
    S.chemistry.chemistryScore = Math.min(100, (S.chemistry.chemistryScore || 75) + 6);
    S.chemistry.harmonyScore = Math.min(100, (S.chemistry.harmonyScore || 80) + 8);
    S.chemistry.dressingRoomMorale = Math.min(100, (S.chemistry.dressingRoomMorale || 85) + 6);
  }
  playSfx('applause');
  triggerLiveBudgetUpdate(`${svgIcon('handshake', 14)}  Squad Bonding Retreat Held (-₹0.15M)`, 'transfer');
  alert(`${svgIcon('handshake', 14)}  TEAM RETREAT COMPLETED!\n\nThe squad bonded over an off-site tactical retreat. Dressing room morale increased by +8% and pitch synergy improved by +6%!`);
  renderSquadSection(document.getElementById('gameContent'));
}

function setTrophyFilter(filter) {
  trophyFilter = filter;
  const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
  if (subContainer) renderTrophyCabinetAndCareer(subContainer);
}

function setMilestoneFilter(filter) {
  milestoneFilter = filter;
  const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
  if (subContainer) renderTrophyCabinetAndCareer(subContainer);
}

function refreshJobOffers() {
  get('/api/world4/trophy-career?club=' + encodeURIComponent(S.selectedClub)).then(data => {
    if (data.jobOffers) S.jobOffers = data.jobOffers;
    if (data.milestones) S.managerMilestones = data.milestones;
    if (data.career) S.managerCareer = data.career;
    playSfx('click');
    const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
    if (subContainer) renderTrophyCabinetAndCareer(subContainer);
  }).catch(err => {
    console.error(err);
  });
}

function acceptJobOffer(jobId, targetName, type) {
  const isNat = type === 'national';
  const promptText = isNat 
    ? `Accept the prestigious appointment as Head Coach of ${targetName}? You will lead them into international tournaments alongside your club duties!`
    : `Are you sure you want to conclude your reign at ${S.selectedClub} and accept managerial appointment at ${targetName}?`;

  if (!confirm(promptText)) return;

  post('/api/world4/job/accept', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    playSfx('applause');
    playSfx('deal');
    alert(`${svgIcon('party', 14)}  CONTRACT SIGNED!\n\n${data.message || `Welcome to ${targetName}!`}`);
    renderGame();
  }).catch(err => {
    alert(err.message || 'Failed to accept job offer.');
  });
}

function declineJobOffer(jobId) {
  post('/api/world4/job/decline', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    playSfx('whistle');
    alert(`${svgIcon('handshake', 14)}  Total Loyalty Pledged!\n\n${data.message}`);
    const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
    if (subContainer) renderTrophyCabinetAndCareer(subContainer);
  }).catch(err => {
    alert(err.message || 'Failed to decline offer.');
  });
}

function negotiateJobOffer(jobId) {
  post('/api/world4/job/negotiate', ref({ offerId: jobId })).then(data => {
    if (data.state) S = data.state;
    if (data.success) {
      playSfx('deal');
      alert(`${svgIcon('briefcase', 14)}  TERMS ACCEPTED!\n\n${data.message}`);
    } else {
      alert(`${svgIcon('briefcase', 14)}  COUNTER-TERMS DECLINED\n\n${data.message}`);
    }
    const subContainer = document.getElementById('competitionsSubContent') || document.getElementById('clubSubContent');
    if (subContainer) renderTrophyCabinetAndCareer(subContainer);
  }).catch(err => {
    alert(err.message || 'Negotiation failed.');
  });
}

function executeBoardPetition(type) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const confidence = S.boardStatus?.confidence || 82;
  const modal = document.getElementById('boardPetitionModal');

  if (confidence < 55) {
    playSfx('whistle');
    alert(`${svgIcon('x', 14)}  PETITION REJECTED BY THE BOARD\n\nChairman Response: "Given our inconsistent recent results, the Board cannot justify additional capital expenditures at this moment. Win the upcoming matches first."`);
    if (modal) modal.remove();
    return;
  }

  if (type === 'transfer_funds') {
    c.cash = Math.round((c.cash + 10) * 10) / 10;
    playSfx('deal');
    playSfx('applause');
    alert(`${svgIcon('check', 14)}  PETITION APPROVED BY THE CLUB OWNER!\n\nChairman Response: "We have reviewed your request. An extra ₹10.0M has been transferred into the club transfer budget. Deliver results on the pitch."`);
  } else if (type === 'wage_increase') {
    c.cash = Math.round((c.cash + 5) * 10) / 10;
    playSfx('deal');
    alert(`${svgIcon('check', 14)}  PETITION APPROVED BY THE BOARD!\n\nChairman Response: "Wage allocation expanded by ₹2.0M/yr with ₹5.0M immediate buffer capital authorized."`);
  } else if (type === 'training_upgrade') {
    c.morale = Math.min(100, c.morale + 10);
    playSfx('applause');
    alert(`${svgIcon('check', 14)}  PETITION APPROVED BY THE BOARD!\n\nChairman Response: "The executive committee has greenlit the training complex renovation! Squad morale has jumped to ` + c.morale + '%."');
  }

  if (modal) modal.remove();
  renderGame();
}

  const c = S.clubs.find(x => x.name === S.selectedClub);
  get('/api/world4/player/meetings?club=' + encodeURIComponent(c.name)).then(data => {
    const meetings = data.meetings || [];
    if (!meetings.length) return alert('No pending player meetings. The dressing room is currently peaceful.');

    const m = meetings[0];
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'playerMeetingModal';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:700px;padding:26px;position:relative;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);padding-bottom:12px;margin-bottom:16px;">
          <div>
            <div class="card-kicker" style="color:var(--danger);">DRESSING ROOM CONFRONTATION</div>
            <h2 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:#fff;margin:0;">
              ${esc(m.title)}
            </h2>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('playerMeetingModal').remove()">&times;</button>
        </div>

        <div style="display:flex;align-items:center;gap:14px;background:var(--bg-card-subtle);padding:14px;border-radius:12px;border:1px solid var(--border-subtle);margin-bottom:16px;">
          <div style="width:48px;height:48px;border-radius:12px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:24px;">
            ${svgIcon('user', 14)} 
          </div>
          <div>
            <b style="color:#fff;font-size:16px;">${esc(m.player?.name)}</b>
            <div style="font-size:12px;color:var(--accent-gold);">${m.player?.rating || 80} OVR · ${esc(m.player?.position || 'MF')}</div>
          </div>
        </div>

        <div style="background:rgba(255,255,255,0.04);border-left:3px solid var(--accent-gold);padding:14px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.6;color:#e2e8f0;margin-bottom:20px;font-style:italic;">
          ${esc(m.issue)}
        </div>

        <div style="font-size:11.5px;font-weight:900;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;">CHOOSE MANAGERIAL RESPONSE:</div>
        <div style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px;">
          ${m.choices.map(ch => `
            <button class="btn btn-secondary" onclick="resolveMeetingChoice('${m.id}', '${ch.id}')" style="padding:12px 16px;text-align:left;font-weight:700;display:flex;justify-content:space-between;align-items:center;">
              <span>${esc(ch.text)}</span>
              <span style="font-size:11px;opacity:0.8;">CHOOSE &rarr;</span>
            </button>
          `).join('')}
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('playerMeetingModal').remove()">LEAVE OFFICE</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  }).catch(err => alert(err.message));
}

function resolveMeetingChoice(meetingId, choiceId) {
  post('/api/world4/player/resolve-meeting', ref({
    club: S.selectedClub,
    meetingId: meetingId,
    choiceId: choiceId
  })).then(res => {
    if (res.result?.moraleDelta > 0) playSfx('applause');
    else playSfx('whistle');
    alert(`${svgIcon('speech', 14)} ️ MEETING CONCLUDED\n\n${res.result?.feedback || 'Player meeting resolved.'}`);
    document.getElementById('playerMeetingModal')?.remove();
    renderGame();
  }).catch(err => alert(err.message));
}

function issueDugoutShout(shout, boost) {
  playSfx('whistle');
  alert(`${svgIcon('speech', 14)} ️ TOUCHLINE SHOUT ISSUED: "${shout}"\n\nThe players heard you loud and clear from the technical area. In-match focus boosted by +${boost}%.`);
}

function protestFourthOfficial() {
  playSfx('whistle');
  alert(`${svgIcon('alert', 14)} ️ PROTEST LODGED WITH 4TH OFFICIAL!\n\nYou stepped to the edge of the technical area to dispute a referee decision. The referee waved play on and warned you.`);
}

function requestVARCheck() {
  playSfx('whistle');
  alert(`${svgIcon('tv', 14)}  VAR MONITOR REVIEW!\n\nThe match officials inspected the pitchside monitor. Decision confirmed!`);
}

function hypeHomeCrowd() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  c.morale = Math.min(100, c.morale + 3);
  playSfx('applause');
  alert(`${svgIcon('applause', 14)}  HOME CROWD HYPED!\n\nYou turned to the stands and waved your arms. The fans roared in appreciation! Squad morale +3%.`);
}

// TAB 2: TACTICAL PITCH (INTERACTIVE 2D FORMATION)

function renderTacticalPitch(container) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const myPlayers = S.market.filter(p => p.ownerClub === c.name);

  // Group players by position
  const gks = myPlayers.filter(p => p.position === 'GK');
  const defs = myPlayers.filter(p => ['CB', 'LB', 'RB'].includes(p.position));
  const mids = myPlayers.filter(p => ['CMF', 'DMF', 'AMF'].includes(p.position));
  const fwds = myPlayers.filter(p => ['CF', 'LWF', 'RWF'].includes(p.position));

  // Build starting XI (4-3-3 default)
  const startingGK = gks[0] || myPlayers[0];
  const startingDef = defs.slice(0, 4);
  const startingMid = mids.slice(0, 3);
  const startingFwd = fwds.slice(0, 3);

  // Fillers if positions are scarce
  const bench = myPlayers.filter(p => ![startingGK?.id, ...startingDef.map(d=>d.id), ...startingMid.map(m=>m.id), ...startingFwd.map(f=>f.id)].includes(p.id));

  const makePlayerNode = (p, fallbackPos) => {
    if (!p) return `<div class="pitch-player"><div class="player-jersey-icon" style="background:#222;color:#666;">-</div><div class="player-name-plate">Vacant</div></div>`;
    const ovrClass = p.rating >= 85 ? 'ovr-elite' : p.rating >= 80 ? 'ovr-gold' : 'ovr-silver';
    return `
      <div class="pitch-player" onclick="viewPlayerCard('${p.id}')">
        <div class="player-jersey-icon" style="background:${c.jersey?.home || '#0b2545'};">
          ${p.position || fallbackPos}
          <span class="player-ovr-tag ${ovrClass}">${p.rating}</span>
        </div>
        <div class="player-name-plate">
          <span class="pos-label">${p.position || fallbackPos}</span>
          ${esc(p.name.split(' ').pop())}
        </div>
      </div>
    `;
  };

  const chem = S.chemistry || {
    chemistryScore: 78,
    harmonyScore: 82,
    chemistryTier: 'High',
    dressingRoomMorale: 85,
    tacticalFamiliarity: 80,
    boosts: { passAccuracyBonus: '+6%', defensiveSolidity: '+5%', moraleModifier: '+4%' }
  };

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <div class="card-kicker">TACTICAL BOARD · FORMATION 4-3-3</div>
        <h2 style="font-family:var(--font-display);font-size:22px;font-weight:800;color:#fff;">First Team Starting XI</h2>

function refreshTalksUI(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!p) return;

  const minFee = Math.round((p.askingPrice || 10) * 0.9);
  const minSal = Math.round((p.contract?.salary || 2) * 1.05);

  let prob = 50;
  if (activeTalksState.fee >= p.askingPrice * 1.25) prob += 35;
  else if (activeTalksState.fee >= p.askingPrice) prob += 20;
  else if (activeTalksState.fee < minFee) prob -= 40;

  if (activeTalksState.salary >= minSal * 1.3) prob += 25;
  else if (activeTalksState.salary >= minSal) prob += 15;
  else if (activeTalksState.salary < minSal) prob -= 30;

  if (activeTalksState.dealType === 'loan_to_buy') prob -= 5;
  if (activeTalksState.sellOnClause >= 15) prob += 8;

  prob = Math.max(5, Math.min(98, prob));

  const fill = document.getElementById('talksGaugeFill');
  const pct = document.getElementById('talksGaugePct');
  const bubble = document.getElementById('talksAgentBubble');
  const feeDsp = document.getElementById('talksFeeDisplay');
  const salDsp = document.getElementById('talksSalDisplay');

  if (feeDsp) feeDsp.textContent = `₹${money(activeTalksState.fee)}M`;
  if (salDsp) salDsp.textContent = `₹${money(activeTalksState.salary)}M / yr`;

  if (fill && pct) {
    fill.style.width = prob + '%';
    pct.textContent = prob + '%';

    if (prob >= 75) {
      fill.style.background = 'linear-gradient(90deg, #f59e0b, #00f0ff)';
      pct.style.color = '#00f0ff';
      if (bubble) bubble.innerHTML = `Agent: "Now we're talking business, Chairman! This lucrative valuation matches ${p.name}'s pedigree. We are ready to put pen to paper!"`;
    } else if (prob >= 45) {
      fill.style.background = 'linear-gradient(90deg, #ff4757, #f59e0b)';
      pct.style.color = '#f59e0b';
      if (bubble) bubble.innerHTML = `Agent: "The offer is respectable, but ${p.name} has competing suitors. Sweeten the terms slightly and we're done."`;
    } else {
      fill.style.background = '#ff4757';
      pct.style.color = '#ff4757';
      if (bubble) bubble.innerHTML = `Agent: "Are you serious, sir? This bid is below our client's market valuation. Increase your bid or we walk away."`;
    }
  }

  // Live Budget & FFP Health Forecast calculation
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (c) {
    const b = calculateClientBudget(c);
    const remCash = Math.max(0, Math.round((c.cash - activeTalksState.fee) * 10) / 10);
    const remWarChest = Math.max(0, Math.round(((c.cash * 0.6) - activeTalksState.fee) * 10) / 10);
    const newAnnualWage = Math.round((b.wageBillAnnual + activeTalksState.salary) * 10) / 10;
    const newPerMatchWage = Math.round((newAnnualWage / 24) * 100) / 100;
    const newCashflow = Math.round((b.projectedRevPerMatch - newPerMatchWage) * 100) / 100;
    const newRatio = b.projectedTurnoverAnnual > 0 ? Math.round((newAnnualWage / b.projectedTurnoverAnnual) * 100) : 55;

    const elCash = document.getElementById('talksProjCash');
    const elChest = document.getElementById('talksProjWarChest');
    const elFlow = document.getElementById('talksProjCashflow');
    const elRatio = document.getElementById('talksProjFfpRatio');
    const elFfpTag = document.getElementById('talksFfpHealthTag');

    if (elCash) {
      elCash.textContent = `₹${money(remCash)}M`;
      elCash.style.color = remCash <= 1.0 ? '#ff4757' : 'var(--accent-neon)';
    }
    if (elChest) {
      elChest.textContent = `₹${money(remWarChest)}M`;
      elChest.style.color = remWarChest === 0 ? '#ff4757' : 'var(--accent-gold)';
    }
    if (elFlow) {
      elFlow.textContent = `${newCashflow>=0?'+':''}₹${money(newCashflow)}M/m`;
      elFlow.style.color = newCashflow < 0 ? '#ff4757' : 'var(--accent-neon)';
    }
    if (elRatio) {
      elRatio.textContent = `${newRatio}%`;
      elRatio.style.color = newRatio > 70 ? '#ff4757' : 'var(--accent-gold)';
    }
    if (elFfpTag) {
      if (newRatio > 85 || remCash < 1.0) {
        elFfpTag.textContent = '● FFP RISK';
        elFfpTag.style.color = '#ef4444';
      } else if (newRatio > 70) {
        elFfpTag.textContent = '● MONITORED';
        elFfpTag.style.color = '#eab308';
      } else {
        elFfpTag.textContent = '● HEALTHY';
        elFfpTag.style.color = '#00e599';
      }
    }
  }
}

function finalizeTransferNegotiation(pid) {
  const p = S.market.find(x => x.id === pid);
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!p || !c) return;

  const isPreContract = activeTalksState.dealType === 'pre_contract';
  const actualFee = isPreContract ? 0 : activeTalksState.fee;

  if (c.cash < actualFee) {
    return alert(`Insufficient treasury funds! Club has ₹${money(c.cash)}M, but transfer fee requires ₹${money(actualFee)}M.`);
  }

  const actionBox = document.getElementById('talksActionBox');
  if (actionBox) {
    actionBox.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;background:rgba(0,240,255,0.1);border:1px solid var(--accent-neon);border-radius:10px;color:var(--accent-neon);font-weight:700;">
        ${svgIcon('pen', 14)} ️ Submitting formal bid & negotiating terms with representatives...
      </div>
    `;
  }

  post('/api/world4/transfer/negotiate', ref({
    club: S.selectedClub,
    playerId: pid,
    offer: {
      fee: actualFee,
      salary: activeTalksState.salary,
      years: activeTalksState.years,
      dealType: activeTalksState.dealType,
      releaseClause: activeTalksState.releaseClause,
      sellOnClause: activeTalksState.sellOnClause,
      sellOnPct: activeTalksState.sellOnClause,
      goalBonus: activeTalksState.goalBonus || 0,
      cleanSheetBonus: activeTalksState.cleanSheetBonus || 0,
      isPreContract: isPreContract
    }
  })).then(res => {
    const data = res.result;
    if (res.state) S = res.state;

    if (data.status === 'accepted') {
      playSfx('flash');
      playSfx('deal');
      playSfx('applause');

      const flash = document.createElement('div');
      flash.className = 'camera-flash-overlay active';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 600);

      const cele = document.getElementById('talksCelebration');
      const det = document.getElementById('talksSuccessDetail');
      const sFee = document.getElementById('sealedFeeVal');
      const sSal = document.getElementById('sealedSalVal');

      if (sFee) sFee.textContent = `₹${money(data.fee)}M`;
      if (sSal) sSal.textContent = `₹${money(data.salary)}M/yr`;
      if (det) det.textContent = data.message || `${p.name} has officially signed for ${c.name} on a ${data.years}-year contract!`;
      if (cele) cele.style.display = 'flex';
      triggerLiveBudgetUpdate(`${svgIcon('pen', 14)} ️ Signed: ${p.name} (-₹${money(data.fee)}M | ₹${money(data.salary)}M/yr)`, 'transfer');
      return;
    }

    if (data.status === 'countered') {
      playSfx('crisis');
      const bubble = document.getElementById('talksAgentBubble');
      if (bubble) {
        bubble.innerHTML = `
          <div style="color:#ffb86c;font-weight:800;margin-bottom:4px;">${svgIcon('alert', 14)}  SELLING CLUB & AGENT COUNTER-BID:</div>
          <div>${esc(data.message)}</div>
        `;
      }

      if (actionBox) {
        actionBox.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px;width:100%;">
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" style="flex:1;font-weight:800;background:linear-gradient(90deg,#00b09b,#96c93d);" onclick="acceptCounterOffer('${pid}', ${data.counterFee}, ${data.counterSalary})">
                ${svgIcon('handshake', 14)}  ACCEPT COUNTER (₹${data.counterFee}M Fee · ₹${data.counterSalary}M/yr)
              </button>
              <button class="btn btn-warning" style="flex:1;font-weight:800;" onclick="compromiseOffer('${pid}', ${data.counterFee}, ${data.counterSalary})">
                ${svgIcon('scales', 14)} ️ COMPROMISE (₹${Math.round((activeTalksState.fee + data.counterFee)/2)}M)
              </button>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('transferTalksModal').remove()">
              ${svgIcon('exit', 14)}  REJECT & WALK AWAY
            </button>
          </div>
        `;
      }
      return;
    }

    if (data.status === 'hijacked') {
      playSfx('crisis');
      const bubble = document.getElementById('talksAgentBubble');
      if (bubble) {
        bubble.innerHTML = `
          <div style="color:#ff4757;font-weight:900;font-size:13.5px;margin-bottom:6px;">${svgIcon('alert', 14)}  11TH-HOUR TRANSFER HIJACK ALERT!</div>
          <div style="color:#fff;line-height:1.5;">${esc(data.message)}</div>
        `;
      }
      if (actionBox) {
        actionBox.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:10px;width:100%;">

function counterHijackOffer(pid, hijackFee, hijackSalary, hijacker) {
  post('/api/world4/transfer/negotiate', ref({
    club: S.selectedClub,
    playerId: pid,
    offer: {
      fee: hijackFee + 1,
      salary: hijackSalary,
      years: activeTalksState.years,
      isCounterHijack: true,
      hijacker: hijacker
    }
  })).then(res => {
    const data = res.result;
    if (res.state) S = res.state;
    if (data.status === 'accepted') {
      playSfx('flash');
      playSfx('deal');
      playSfx('applause');
      triggerLiveBudgetUpdate(`${svgIcon('shield', 14)} ️ Hijack Thwarted: Deal Signed!`, 'transfer');
      alert(`Transfer Hijack Thwarted! ${data.message}`);
      document.getElementById('transferTalksModal')?.remove();
      refresh();
    } else {
      alert(data.message || 'Counter-bid was unsuccessful.');
      document.getElementById('transferTalksModal')?.remove();
      refresh();
    }
  }).catch(err => alert(err.message));
}

function acceptCounterOffer(pid, fee, salary) {
  activeTalksState.fee = fee;
  activeTalksState.salary = salary;
  finalizeTransferNegotiation(pid);
}

function compromiseOffer(pid, counterFee, counterSalary) {
  activeTalksState.fee = Math.round((activeTalksState.fee + counterFee) / 2);
  activeTalksState.salary = Math.round((activeTalksState.salary + counterSalary) / 2);
  refreshTalksUI(pid);
  finalizeTransferNegotiation(pid);
}

function makeTransferBid(pid, defaultFee) {
  openPlayerTransferTalks(pid);
}

function loanPlayer(pid) {
  const p = S.market.find(x => x.id === pid);
  post('/api/world4/transfer/loan', ref({
    club: S.selectedClub,
    playerId: pid,
    months: 12,
    fee: 2,
    salaryShare: 50
  })).then(res => {
    if (res.state) S = res.state;
    playSfx('deal');
    triggerLiveBudgetUpdate(`${svgIcon('handshake', 14)}  Loan Deal Active: ${p?.name || 'Player'} (-₹2M fee)`, 'transfer');
    alert('Player successfully signed on a 1-year loan deal!');
    refresh();
  }).catch(err => alert(err.message));
}

function exerciseLoanBuyoutAction(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!p) return;
  const buyoutPrice = p.contract?.purchaseOption || Math.round(p.askingPrice || 10);
  if (!confirm(`Exercise permanent purchase option for ${p.name} for ₹${buyoutPrice}M? This will permanently secure him on a 3-year contract.`)) return;

  post('/api/world4/transfer/exercise-buyout', ref({
    club: S.selectedClub,
    playerId: pid
  })).then(res => {
    if (res.state) S = res.state;
    playSfx('deal');
    playSfx('applause');
    alert(`⭐ PERMANENT SIGNING COMPLETED!\n\n${res.result?.message || 'Player buyout exercised.'}`);
    refresh();
  }).catch(err => alert(err.message));
}

function listForSale(pid, currentVal) {
  const p = S.market.find(x => x.id === pid);
  const asking = prompt('Enter your asking price in ₹M:', currentVal);
  if (asking === null) return;
  post('/api/world4/transfer/sell', ref({
    club: S.selectedClub,
    playerId: pid,
    asking: +asking
  })).then(res => {
    if (res.state) S = res.state;
    triggerLiveBudgetUpdate(`${svgIcon('tag', 14)} ️ Listed for Sale: ${p?.name || 'Player'} (₹${asking}M)`, 'transfer');
    alert('Player successfully listed on the global transfer list.');
    refresh();
  }).catch(err => alert(err.message));
}

function releasePlayerPrompt(pid) {
  const p = S.market.find(x => x.id === pid);
  if (!confirm(`Are you sure you want to release ${p?.name || 'this player'}? They will become a free agent and their career merchandise sales will be audited.`)) return;
  post('/api/world4/transfer/release', ref({
    club: S.selectedClub,
    playerId: pid
  })).then(res => {
    if (res.state) S = res.state;
    triggerLiveBudgetUpdate(`${svgIcon('clipboard', 14)}  Player Released: ${p?.name || 'Player'} (Wage bill reduced)`, 'salary');
    openPlayerReleaseReport(res.result || res);
    refresh();
  }).catch(err => alert(err.message));
}

function executeYouthDrills() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (!c) return;
  if ((c.cash || 0) < 0.2) return alert('Insufficient funds! Youth drills cost ₹0.2M.');

  const btn = document.getElementById('btnRunYouthDrills');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span>${svgIcon('lightning', 14)} Running intensive youth drills...</span>`;
  }

  post('/api/world4/youth/train', ref({
    club: S.selectedClub,
    regime: activeYouthRegime
  })).then(res => {
    if (res.state) S = res.state;
    playSfx('applause');
    playSfx('deal');
    const r = res.result;
    alert(`${svgIcon('star', 14)}  YOUTH TRAINING COMPLETE!\n\nRegime: ${activeYouthRegime.toUpperCase()}\n${r?.message || 'Prodigies gained XP and attribute boosts!'}`);
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(err.message || 'Failed to complete youth training.');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `${svgIcon('runner', 14)}  RUN TARGETED DRILLS (₹0.2M)`;
    }
  });

function executeScoutMission() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const btn = document.getElementById('btnDispatchScout');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<span>⏳ Scouts exploring regions & compiling dossiers...</span>`;
  }

  post('/api/world4/scout/dispatch', ref({
    club: S.selectedClub,
    mission: { focus: activeScoutFocus }
  })).then(res => {
    playSfx('deal');
    if (res.state) S = res.state;
    currentScoutReports = res.result?.reports || [];
    triggerLiveBudgetUpdate(`${svgIcon('search', 14)}  Scout Mission Dispatched (-₹1.5M)`, 'transfer');
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(`Scout mission failed: ${err.message}`);
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = `${svgIcon('search', 16)} <span>LAUNCH SCOUTING EXPEDITION</span>`;
    }
  });
}

function submitCustomPlayer() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const name = document.getElementById('cp_name')?.value;
  const position = document.getElementById('cp_position')?.value;
  const age = document.getElementById('cp_age')?.value;
  const style = document.getElementById('cp_style')?.value;
  const rating = document.getElementById('cp_rating')?.value;

  const btn = document.getElementById('btnCreatePlayer');
  if (btn) btn.disabled = true;

  post('/api/world4/player/create', ref({
    club: S.selectedClub,
    player: { name, position, age, style, rating, nationality: c.country }
  })).then(res => {
    playSfx('applause');
    playSfx('deal');
    alert(`${svgIcon('party', 14)}  Academy Success! ${res.result?.player?.name} has graduated and signed a first-team contract with ${c.name}!`);
    if (res.state) S = res.state;
    triggerLiveBudgetUpdate(`${svgIcon('academy', 14)}  Academy Graduate Signed: ${res.result?.player?.name || 'Youth Player'}`, 'salary');
    renderScoutingAndAcademy(document.getElementById('gameContent'));
  }).catch(err => {
    alert(`Academy graduation error: ${err.message}`);
    if (btn) btn.disabled = false;
  });
}

let mgrMarketFilter = {
  tier: 'all',
  style: 'all',
  search: ''
};

function renderManagerMarket(container) {
  const c = S.clubs.find(x => x.name === S.selectedClub);

  fetch('/api/world4/managers?' + (session.roomCode ? 'room=' + session.roomCode : 'soloId=' + session.soloId))
    .then(res => res.json())
    .then(managersList => {
      const allAvailable = (managersList || []).filter(m => m.available !== false && (m.status === 'available' || !m.status));

      // Calculate counts
      const countTotal = allAvailable.length;
      const countDiv34 = allAvailable.filter(m => (m.salary <= 2.8 || (m.minDivision && m.minDivision >= 3))).length;
      const countDiv2 = allAvailable.filter(m => (m.salary > 2.8 && m.salary <= 7)).length;
      const countDiv1 = allAvailable.filter(m => (m.salary > 7 || m.minDivision === 1)).length;
      const countFictional = allAvailable.filter(m => m.isFictional).length;
      const countAffordable = allAvailable.filter(m => m.salary <= c.cash).length;

      // Filter managers
      const filtered = allAvailable.filter(m => {
        const minDiv = m.minDivision || (m.rating >= 90 ? 1 : m.rating >= 80 ? 2 : m.rating >= 72 ? 3 : 4);
        
        // Tier filter
        if (mgrMarketFilter.tier === 'div34' && !(m.salary <= 2.8 || minDiv >= 3)) return false;
        if (mgrMarketFilter.tier === 'div2' && !(m.salary > 2.8 && m.salary <= 7)) return false;
        if (mgrMarketFilter.tier === 'div1' && !(m.salary > 7 || minDiv === 1)) return false;
        if (mgrMarketFilter.tier === 'fictional' && !m.isFictional) return false;
        if (mgrMarketFilter.tier === 'affordable' && m.salary > c.cash) return false;

        // Style filter
        if (mgrMarketFilter.style !== 'all' && m.style !== mgrMarketFilter.style) return false;

        // Search filter
        if (mgrMarketFilter.search) {
          const q = mgrMarketFilter.search.toLowerCase();
          const matchName = (m.name || '').toLowerCase().includes(q);
          const matchTitle = (m.title || '').toLowerCase().includes(q);
          const matchStyle = (m.style || '').toLowerCase().includes(q);
          if (!matchName && !matchTitle && !matchStyle) return false;
        }

        return true;
      });

      const styleIcons = {
        'Possession': `${svgIcon('brain', 14)} `,
        'High Press': `${svgIcon('lightning', 14)} `,
        'Counter Attack': `${svgIcon('shield', 14)} `,
        'Direct Football': `${svgIcon('target', 14)} `,
        'Defensive Block': `${svgIcon('shield', 14)} ️`
      };

      container.innerHTML = `
        <div class="game-card">
          <div class="card-kicker">TACTICAL DIRECTORY & RECRUITMENT</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
            <div>
              <h2 style="font-family:var(--font-display);font-size:24px;font-weight:800;color:#fff;margin:0;">
                Manager Catalog (${allAvailable.length} Tacticians Available)
              </h2>
              <p style="color:var(--text-muted);font-size:13.5px;margin-top:4px;">
                Affordable grassroots managers for lower divisions, hungry promotion specialists, and world-class elite head coaches.
              </p>
            </div>
            ${c.manager ? `
              <div style="background:var(--bg-card-subtle);border:1px solid var(--border-subtle);padding:8px 14px;border-radius:10px;text-align:right;">
                <span style="font-size:11px;color:var(--text-dim);">CURRENT MANAGER:</span>
                <b style="font-size:13px;color:var(--accent-gold);display:block;">${esc(c.manager.name)} (${c.manager.style})</b>
              </div>
            ` : `
              <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);padding:8px 14px;border-radius:10px;text-align:right;">
                <span style="font-size:11px;color:var(--accent-gold);font-weight:700;">VACANCY: NO MANAGER HIRED</span>
                <div style="font-size:11px;color:#e2e8f0;">Club Cash: ₹${money(c.cash)}M (Division ${c.division})</div>
              </div>
            `}
          </div>

          <!-- Division Guidance Notice for Lower Leagues -->
          ${c.division >= 3 ? `
            <div style="background:rgba(0,240,255,0.06);border:1px solid rgba(0,240,255,0.2);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
              <div>
                <b style="color:var(--accent-neon);font-size:13px;">${svgIcon('shield', 14)} ️ Division ${c.division} Manager Guide:</b>
                <span style="color:#e2e8f0;font-size:12.5px;margin-left:6px;">
                  Elite managers like Pep and Ancelotti demand ₹14M+ and Division 1 football. Hire budget-friendly created specialists (from ₹0.8M) to lead ${esc(c.name)} through promotions!
                </span>
              </div>
              <button class="btn btn-primary btn-xs" onclick="mgrMarketFilter.tier='div34'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
                VIEW DIV 3 & 4 BUDGET MANAGERS
              </button>
            </div>
          ` : ''}

          <!-- Filter Navigation Tabs -->
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
            <button class="btn btn-xs ${mgrMarketFilter.tier==='all'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='all'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('star', 14)}  All (${countTotal})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div34'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div34'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('shield', 14)} ️ Div 3 & 4 Budget (₹0.8M - ₹2.8M) (${countDiv34})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div2'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div2'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('swords', 14)} ️ Div 2 Challengers (₹3M - ₹7M) (${countDiv2})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='div1'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='div1'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('trophy', 14)}  Div 1 Elite (Pep, Carlo, Klopp) (${countDiv1})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='fictional'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='fictional'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('sparkles', 14)}  Created Specialists (${countFictional})
            </button>
            <button class="btn btn-xs ${mgrMarketFilter.tier==='affordable'?'btn-primary':'btn-secondary'}" onclick="mgrMarketFilter.tier='affordable'; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
              ${svgIcon('coin', 14)}  Affordable for ${esc(c.name)} (${countAffordable})
            </button>
          </div>

          <!-- Secondary Filters: Tactical Style & Search -->
          <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
            <div style="flex:1;min-width:220px;">
              <input type="text" class="input-field" placeholder="Search manager by name, title, or style..." value="${esc(mgrMarketFilter.search)}" style="width:100%;padding:8px 12px;font-size:13px;" oninput="mgrMarketFilter.search=this.value; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
            </div>
            <div style="width:200px;">
              <select class="input-field" style="width:100%;padding:8px 12px;font-size:13px;" onchange="mgrMarketFilter.style=this.value; renderManagerMarket(document.getElementById('managerMarketContainer') || container);">
                <option value="all" ${mgrMarketFilter.style==='all'?'selected':''}>All Philosophies</option>
                <option value="Possession" ${mgrMarketFilter.style==='Possession'?'selected':''}>${svgIcon('brain', 14)}  Possession</option>
                <option value="High Press" ${mgrMarketFilter.style==='High Press'?'selected':''}>${svgIcon('lightning', 14)}  High Press</option>
                <option value="Counter Attack" ${mgrMarketFilter.style==='Counter Attack'?'selected':''}>${svgIcon('shield', 14)}  Counter Attack</option>
                <option value="Direct Football" ${mgrMarketFilter.style==='Direct Football'?'selected':''}>${svgIcon('target', 14)}  Direct Football</option>
                <option value="Defensive Block" ${mgrMarketFilter.style==='Defensive Block'?'selected':''}>${svgIcon('shield', 14)} ️ Defensive Block</option>
              </select>
            </div>
          </div>

          <!-- Manager Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:18px;">
            ${filtered.length === 0 ? `
              <div style="grid-column:1/-1;text-align:center;padding:40px;background:var(--bg-card-subtle);border-radius:14px;border:1px dashed var(--border-subtle);color:var(--text-muted);">
                No managers found matching current filters. Try selecting "All Managers" or clearing your search.
              </div>
            ` : filtered.map(m => {
              const minDiv = m.minDivision || (m.rating >= 90 ? 1 : m.rating >= 80 ? 2 : m.rating >= 72 ? 3 : 4);
              const isAffordable = c.cash >= m.salary;
              const canCoachDivision = c.division <= minDiv || m.rating < 88 || c.reputation >= 82;
              const icon = styleIcons[m.style] || `${svgIcon('tie', 14)} `;

              return `
                <div style="background:var(--bg-card-subtle);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.2s;" onmouseenter="this.style.transform='translateY(-3px)'" onmouseleave="this.style.transform='none'">
                  <div>
                    <!-- Header with Icon, Name & Rating -->
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                      <div style="display:flex;gap:12px;align-items:flex-start;">
                        <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(0,0,0,0.4));display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid rgba(255,255,255,0.1);">
                          ${icon}
                        </div>
                        <div>
                          <h3 style="font-family:var(--font-display);font-size:17px;font-weight:800;color:#fff;margin:0;">
                            ${esc(m.name)}
                          </h3>
                          <div style="font-size:12px;color:var(--accent-gold);font-weight:600;margin-top:2px;">
                            ${esc(m.title || m.style + ' Specialist')}
                          </div>
                        </div>
                      </div>
                      <div style="text-align:right;">
                        <span style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--accent-neon);">${m.rating}</span>
                        <div style="font-size:10px;color:var(--text-dim);">OVR</div>
                      </div>
                    </div>

                    <!-- Tags & Division Suitability -->
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
                      <span class="pill pill-div">${icon} ${esc(m.style)}</span>
                      ${m.isFictional ? `
                        <span class="pill" style="background:rgba(0,240,255,0.12);color:var(--accent-neon);border:1px solid rgba(0,240,255,0.3);font-size:10px;">${svgIcon('sparkles', 14)}  CREATED</span>
                      ` : `
                        <span class="pill" style="background:rgba(245,158,11,0.12);color:var(--accent-gold);border:1px solid rgba(245,158,11,0.3);font-size:10px;">${svgIcon('trophy', 14)}  REAL-WORLD</span>
                      `}
                      ${minDiv === 4 ? `
                        <span class="pill" style="background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:10px;">${svgIcon('sprout', 14)}  Div 3 & 4 Ready</span>
                      ` : minDiv === 3 ? `
                        <span class="pill" style="background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.3);font-size:10px;">${svgIcon('chart', 14)}  Div 3 Specialist</span>
                      ` : minDiv === 2 ? `
                        <span class="pill" style="background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);font-size:10px;">${svgIcon('swords', 14)} ️ Min Div 2</span>
                      ` : `
                        <span class="pill" style="background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.3);font-size:10px;">${svgIcon('trophy', 14)}  Requires Div 1</span>
                      `}
                    </div>

                    <!-- Bio -->
                    ${m.bio ? `
                      <p style="font-size:12px;color:var(--text-muted);line-height:1.4;margin:0 0 12px 0;">
                        ${esc(m.bio)}
                      </p>
                    ` : ''}

                    <!-- Financial & Formation Details -->
                    <div style="font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;background:rgba(0,0,0,0.25);padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);">
                      <div style="display:flex;justify-content:space-between;">
                        <span>Annual Salary:</span>
                        <b style="color:#fff;font-family:var(--font-display);">₹${money(m.salary)}M / season</b>
                      </div>
                      <div style="display:flex;justify-content:space-between;">
                        <span>Formations:</span>
                        <b style="color:var(--accent-neon);">${(m.preferredFormations || ['4-3-3']).join(', ')}</b>
                      </div>
                      <!-- Affordability status -->
                      <div style="margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.08);font-size:11.5px;">
                        ${!isAffordable ? `
                          <span style="color:#f87171;font-weight:700;">${svgIcon('x', 14)}  Exceeds Treasury (Need ₹${money(m.salary - c.cash)}M more)</span>
                        ` : !canCoachDivision ? `
                          <span style="color:#fbbf24;font-weight:700;">${svgIcon('alert', 14)} ️ Demands Div ${minDiv} Football</span>
                        ` : `
                          <span style="color:#4ade80;font-weight:700;">${svgIcon('check', 14)}  Affordable for ${esc(c.name)}</span>
                        `}
                      </div>
                    </div>
                  </div>

                  <!-- Action Button -->
                  <button class="btn ${isAffordable && canCoachDivision ? 'btn-primary' : 'btn-secondary'} btn-sm" style="width:100%;" onclick="openManagerInterview('${m.id}')">
                    ${!canCoachDivision ? `${svgIcon('search', 14)}  VIEW PRESTIGE TERMS (Requires Div ${minDiv})` : `${svgIcon('tie', 14)}  INTERVIEW & SIGN (₹${money(m.salary)}M)`}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    })
    .catch(err => {
      container.innerHTML = `<p style="color:var(--danger)">Error loading managers: ${err.message}</p>`;
    });

function openManagerInterview(mid) {

function confirmHireManager(id, name, salary) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  if (c.cash < salary) {
    return alert(`Insufficient funds! Need ₹${salary}M for ${name}'s salary, but club treasury has ₹${money(c.cash)}M.`);
  }

  const area = document.getElementById('managerActionArea');
  if (area) {
    area.innerHTML = `
      <div style="width:100%;text-align:center;padding:12px;color:var(--accent-neon);font-weight:700;">
        ${svgIcon('camera', 14)}  Convening press conference and sealing head coach contract...
      </div>
    `;
  }

  post('/api/world4/manager/hire', ref({
    club: S.selectedClub,
    managerId: id
  })).then(data => {
    playSfx('flash');
    playSfx('applause');
    playSfx('stamp');

    const flash = document.createElement('div');
    flash.className = 'camera-flash-overlay active';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    alert(`Press Announcement: ${name} is officially appointed Head Coach of ${S.selectedClub}!`);
    document.getElementById('managerInterviewModal')?.remove();
    S = data;
    triggerLiveBudgetUpdate(`${svgIcon('tie', 14)}  Manager Appointed: ${name} (₹${salary}M/yr)`, 'salary');
    renderGame();
  }).catch(err => {
    alert(err.message);
    document.getElementById('managerInterviewModal')?.remove();
  });
}

function hireManagerAction(id, name, salary) {
  openManagerInterview(id);
}

function updateExpansionCostPreview() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  const diff = Math.max(0, target - currentCap);
  const cost = Math.max(1, Math.round(diff / 1000));
  const el = document.getElementById('expansionCostPreview');
  if (target <= currentCap) {
    el.innerHTML = `<span style="color:var(--text-dim)">Capacity cannot be reduced below current size.</span>`;
  } else {
    const canAfford = c.cash >= cost;
    el.innerHTML = `<span style="color:${canAfford ? 'var(--accent-gold)' : 'var(--danger)'}">
      Project Cost: ₹${cost}M (+${diff.toLocaleString()} seats) · Club Cash: ₹${money(c.cash)}M
    </span>`;
  }
}

function expandStadiumTier(addedSeats, cost) {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding by ${addedSeats.toLocaleString()} seats costs ₹${cost}M, but club only has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Expand stadium by ${addedSeats.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: currentCap + addedSeats
  })).then(data => {
    alert(`Success! Stadium capacity expanded to ${(currentCap + addedSeats).toLocaleString()} seats!`);
    S = data;
    triggerLiveBudgetUpdate(`${svgIcon('stadium', 14)} ️ Stadium Expanded: +${addedSeats.toLocaleString()} seats (-₹${cost}M)`, 'revenue');
    renderGame();
  }).catch(err => alert(err.message));
}

function submitCustomExpansion() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const currentCap = c.stadium?.capacity || 20000;
  const target = +document.getElementById('customCapInput').value;
  if (target <= currentCap) return alert('Target capacity must be greater than current capacity.');
  const diff = target - currentCap;
  const cost = Math.max(1, Math.round(diff / 1000));

  if (c.cash < cost) {
    return alert(`Insufficient club funds! Expanding to ${target.toLocaleString()} seats costs ₹${cost}M, but your club has ₹${money(c.cash)}M.`);
  }
  if (!confirm(`Authorize stadium expansion of +${diff.toLocaleString()} seats for ₹${cost}M?`)) return;

  post('/api/world4/economy', ref({
    club: S.selectedClub,
    capacity: target
  })).then(data => {
    alert(`Stadium expansion complete! Capacity is now ${target.toLocaleString()} seats!`);
    S = data;
    triggerLiveBudgetUpdate(`${svgIcon('stadium', 14)} ️ Stadium Expanded: ${target.toLocaleString()} seats (-₹${cost}M)`, 'revenue');
    renderGame();
  }).catch(err => alert(err.message));
}

function saveTicketPrice() {
  const ticket = +document.getElementById('ticketPriceInput').value;
  post('/api/world4/economy', ref({
    club: S.selectedClub,
    ticketPrice: ticket
  })).then(data => {
    alert('Ticket pricing updated successfully.');
    S = data;
    triggerLiveBudgetUpdate(`${svgIcon('tag', 14)} ️ Matchday Pricing: ₹${ticket}/ticket updated`, 'revenue');
    renderGame();
  }).catch(err => alert(err.message));
}

  fetch('/api/world4/sponsors?' + (session.roomCode ? 'room=' + session.roomCode + '&' : 'soloId=' + session.soloId + '&') + 'club=' + encodeURIComponent(S.selectedClub))

    .then(offers => {
      const container = document.getElementById('gameContent');
      container.innerHTML = `

function signSponsorDeal(offerId, name) {

    club: S.selectedClub,
    offerId

    alert(`Congratulations! ${name} is now your official club sponsor!`);
    S = data;

function generateJerseySVG(kit, clubName, sponsorName) {
  const primary = kit.home || '#0b2545';
  const secondary = kit.away || '#ffffff';
  const collar = kit.collar || '#ffffff';
  const pattern = kit.pattern || 'stripes';

  let patternSVG = '';
  if (pattern === 'stripes') {
    patternSVG = `
      <rect x="55" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="95" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
      <rect x="135" y="45" width="22" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'hoops') {
    patternSVG = `
      <rect x="35" y="65" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="105" width="140" height="20" fill="${secondary}" opacity="0.95"/>
      <rect x="35" y="145" width="140" height="20" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'sash') {
    patternSVG = `
      <polygon points="40,40 70,40 170,180 140,180" fill="${secondary}" opacity="0.95"/>
    `;
  } else if (pattern === 'halves') {
    patternSVG = `
      <rect x="105" y="45" width="70" height="150" fill="${secondary}" opacity="0.95"/>
    `;
  }

  return `
    <svg width="220" height="240" viewBox="0 0 210 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="jerseyClip">
          <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" />
        </clipPath>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
        </filter>
      </defs>

      <!-- Jersey Body Outline with Clip -->
      <g filter="url(#dropShadow)">
        <path d="M60,20 L85,42 C95,46 115,46 125,42 L150,20 L195,58 L168,96 L152,80 L152,190 L58,190 L58,80 L42,96 L15,58 Z" fill="${primary}" />
        <g clip-path="url(#jerseyClip)">
          ${patternSVG}
        </g>
      </g>

      <!-- Collar detail -->
      <path d="M85,42 C95,49 115,49 125,42 C120,56 90,56 85,42 Z" fill="${collar}" />

      <!-- Left Crest Badge -->
      <circle cx="80" cy="80" r="10" fill="#fff" opacity="0.9" />
      <text x="80" y="83" font-size="7" font-weight="bold" fill="#000" text-anchor="middle" font-family="sans-serif">${esc((clubName || 'FC').slice(0, 2).toUpperCase())}</text>

      <!-- Sponsor Logo on Chest -->
      <text x="105" y="125" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-family="sans-serif">
        ${esc((sponsorName || 'FOOTBALL').slice(0, 10).toUpperCase())}
      </text>

      <!-- Shorts Below -->
      <path d="M68,195 L142,195 L148,225 L112,225 L105,208 L98,225 L62,225 Z" fill="${kit.shorts || primary}" filter="url(#dropShadow)" />
    </svg>
  `;
}

function liveUpdateKitPreview() {
  const c = S.clubs.find(x => x.name === S.selectedClub);
  const updatedKit = {
    home: document.getElementById('kitHome').value,
    away: document.getElementById('kitAway').value,
    collar: document.getElementById('kitCollar').value,
    shorts: document.getElementById('kitShorts').value,
    pattern: document.getElementById('kitPattern').value
  };
  document.getElementById('svgKitPreview').innerHTML = generateJerseySVG(updatedKit, c.name, c.sponsor?.name);
}

function saveKitDesign(showNotification = true) {
  const kitData = {
    home: document.getElementById('kitHome')?.value || '#0b2545',
    away: document.getElementById('kitAway')?.value || '#ffffff',
    collar: document.getElementById('kitCollar')?.value || '#ffffff',
    shorts: document.getElementById('kitShorts')?.value || '#0b2545',
    pattern: document.getElementById('kitPattern')?.value || 'stripes',
    quality: +(document.getElementById('kitQualityRange')?.value || 75)
  };

  return post('/api/world4/jersey/update', ref({
    club: S.selectedClub,
    jersey: kitData
  })).then(data => {
    S = data;
    if (showNotification) {
      playSfx('stamp');
      alert('Kit template updated in official club design archive.');
      renderGame();
    }
    return data;
  }).catch(err => {
    alert(err.message);
    throw err;
  });
}

function launchKitToSupporters() {
  // First persist the current design parameters
  saveKitDesign(false)
    .then(() => {
      return post('/api/world4/jersey/launch', ref({ club: S.selectedClub }));
    })
    .then(data => {
      const res = data.result;
      if (res.verdict === 'hit') {
        playSfx('deal');
      } else {
        playSfx('crisis');
      }
      S = data.state;
      renderGame();
      openKitLaunchCelebrationModal(res);
    })
    .catch(err => alert('Kit launch failed: ' + err.message));
}

// =============================================================
const autoSaveManager = {
  config: {
    enabled: true,
    intervalSeconds: 60,
    saveOnMatch: true,
    saveOnTransfer: true,
    saveOnTactics: true,
    saveOnPageExit: true,
    showToast: true
  },
  state: {
    isSaving: false,
    lastSaved: null,
    lastSavedClub: null,
    lastReason: null,
    status: 'idle', // 'idle' | 'saving' | 'saved' | 'error'
    nextSaveCountdown: 60,
    tickerTimer: null,
    debounceTimer: null,
    revertTimer: null
  },

  init() {
    try {
      const stored = localStorage.getItem('fw_autosave_cfg');
      if (stored) {
        this.config = Object.assign(this.config, JSON.parse(stored));
      }
    } catch(e) {}

    if (session && session.savedTime) {
      this.state.lastSaved = session.savedTime;
      this.state.lastSavedClub = session.savedClub;
    }

    this.state.nextSaveCountdown = this.config.intervalSeconds;
    this.startTicker();
    this.bindWindowEvents();
    this.injectStyles();
    console.log('[AutoSaveManager] Initialized. Interval:', this.config.intervalSeconds + 's, Enabled:', this.config.enabled);
  },

  saveConfig() {
    try {
      localStorage.setItem('fw_autosave_cfg', JSON.stringify(this.config));
    } catch(e) {}
    this.updateHudBadges();
  },

  toggle(enabled) {
    this.config.enabled = !!enabled;
    this.saveConfig();
    this.state.nextSaveCountdown = this.config.intervalSeconds;
    this.updateHudBadges();
    const statusMsg = this.config.enabled ? 'Auto-Save Enabled (' + this.config.intervalSeconds + 's)' : 'Auto-Save Disabled';
    this.showToast(this.config.enabled ? 'Auto-Save Active' : 'Auto-Save Paused', statusMsg);
  },

  setInterval(seconds) {
    this.config.intervalSeconds = Number(seconds) || 60;
    this.saveConfig();
    this.state.nextSaveCountdown = this.config.intervalSeconds;
    this.updateHudBadges();
    this.showToast('Interval Updated', 'Auto-saving every ' + this.config.intervalSeconds + ' seconds');
  },

  startTicker() {
    if (this.state.tickerTimer) clearInterval(this.state.tickerTimer);
    this.state.tickerTimer = setInterval(() => {
      if (!this.config.enabled) return;
      if (!S || !S.selectedClub) return;
      if (matchSimulationInProgress || this.state.isSaving) return;

      this.state.nextSaveCountdown--;
      if (this.state.nextSaveCountdown <= 0) {
        this.state.nextSaveCountdown = this.config.intervalSeconds;
        this.performSave('periodic', { silent: true });
      } else {
        this.updateCountdownUI();
      }
    }, 1000);
  },

  bindWindowEvents() {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && this.config.enabled && this.config.saveOnPageExit && S?.selectedClub) {
        this.performSave('visibility_change', { silent: true });
      }
    });

    window.addEventListener('beforeunload', () => {
      if (this.config.enabled && this.config.saveOnPageExit && S?.selectedClub) {
        if (session) {
          session.savedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          session.savedClub = S.selectedClub;
          save();
        }
        try {
          const body = JSON.stringify(ref({ club: S.selectedClub, autoSave: true, reason: 'unload' }));
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/world4/save', new Blob([body], { type: 'application/json' }));
          }
        } catch(e) {}
      }
    });
  },

  triggerEventSave(eventKey, detail = '') {
    if (!this.config.enabled) return;
    if (!S || !S.selectedClub) return;

    if (eventKey === 'match' && !this.config.saveOnMatch) return;
    if (eventKey === 'transfer' && !this.config.saveOnTransfer) return;
    if (eventKey === 'tactics' && !this.config.saveOnTactics) return;

    if (this.state.debounceTimer) clearTimeout(this.state.debounceTimer);
    this.state.debounceTimer = setTimeout(() => {
      this.performSave(eventKey, { silent: true, detail });
    }, 700);
  },

  performSave(reason = 'manual', options = {}) {
    if (!S || !S.selectedClub) return Promise.resolve(null);
    if (this.state.isSaving) return Promise.resolve(null);

    const isSilent = options.silent !== false;
    this.state.isSaving = true;
    this.state.status = 'saving';
    this.state.lastReason = reason;
    this.updateHudBadges();

    const saveBtn = document.getElementById('hudSaveBtn');
    if (saveBtn) {
      saveBtn.innerHTML = `<span>⏳ SAVING...</span>`;
      saveBtn.style.opacity = '0.7';
    }

    return post('/api/world4/save', ref({ club: S?.selectedClub, autoSave: true, reason }))
      .then(data => {
        if (data && data.state) S = data.state;
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        this.state.lastSaved = now;
        this.state.lastSavedClub = S.selectedClub;
        this.state.status = 'saved';
        this.state.isSaving = false;
        this.state.nextSaveCountdown = this.config.intervalSeconds;

        session = {
          ...session,
          savedClub: S?.selectedClub || session?.savedClub,
          savedTime: now
        };
        save();

        try {
          localStorage.setItem('fw4_backup_' + S.selectedClub, JSON.stringify({
            club: S.selectedClub,
            time: now,
            season: S.season,
            matchday: S.matchday,
            data: data.state || S
          }));
        } catch(e) {}

        this.updateHudBadges();

        if (saveBtn) {
          saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVED!</span>`;
          saveBtn.style.opacity = '1';
          saveBtn.style.borderColor = 'var(--accent-neon)';
          saveBtn.style.color = 'var(--accent-neon)';
          setTimeout(() => {
            if (saveBtn) {
              saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVE GAME</span>`;
              saveBtn.style.borderColor = 'var(--accent-gold)';
              saveBtn.style.color = 'var(--accent-gold)';
            }
          }, 2200);
        }

        if (isSilent) {
          if (this.config.showToast) {
            const reasonLabels = {
              periodic: 'Periodic Auto-Save',
              match: 'Post-Match Auto-Save',
              transfer: 'Transfer Market Auto-Save',
              tactics: 'Tactics Auto-Save',
              season: 'Season Rollover Auto-Save',
              facility: 'Infrastructure Auto-Save',
              club_select: 'Club Career Auto-Save',
              visibility_change: 'Background Auto-Save'
            };
            const label = reasonLabels[reason] || 'Career Auto-Saved';
            this.showToast(label, `${esc(S.selectedClub)} • ${now}`);
          }
        } else {
          playSfx('stamp');
          openSaveConfirmationModal(now);
        }

        if (this.state.revertTimer) clearTimeout(this.state.revertTimer);
        this.state.revertTimer = setTimeout(() => {
          this.state.status = 'idle';
          this.updateHudBadges();
        }, 3500);

        if (typeof options.callback === 'function') options.callback(true, data);
        return data;
      })
      .catch(err => {
        console.warn('[AutoSave Warning] Server save fell back to local storage:', err);
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        this.state.lastSaved = now;
        this.state.status = 'error';
        this.state.isSaving = false;
        session = { ...session, savedClub: S?.selectedClub, savedTime: now };
        save();

        this.updateHudBadges();
        if (saveBtn) {
          saveBtn.innerHTML = `${svgIcon('save', 14)}  <span>SAVE GAME</span>`;
          saveBtn.style.opacity = '1';
        }
        if (!isSilent) {
          alert('Save error: ' + err.message + ' (Data backed up locally in session).');
        }
        if (typeof options.callback === 'function') options.callback(false, err);
      });
  },

  updateHudBadges() {
    const badge = document.getElementById('hudAutoSaveBadge');
    if (!badge) return;

    if (!this.config.enabled) {
      badge.style.background = 'rgba(255,255,255,0.05)';
      badge.style.borderColor = 'rgba(255,255,255,0.15)';
      badge.style.color = 'var(--text-muted)';
      badge.innerHTML = `
        <span style="width:7px;height:7px;border-radius:50%;background:#64748b;display:inline-block;"></span>
        <span>Auto-Save: OFF</span>
      `;
      badge.title = 'Auto-Save is Disabled (Click to configure)';
      return;
    }

    if (this.state.status === 'saving') {
      badge.style.background = 'rgba(56,189,248,0.15)';
      badge.style.borderColor = 'rgba(56,189,248,0.4)';
      badge.style.color = '#38bdf8';
      badge.innerHTML = `
        <span style="display:inline-block;animation:spinFast 1s linear infinite;line-height:1;">${svgIcon('refresh', 12, '#38bdf8')}</span>
        <span>Auto-Saving...</span>
      `;
      badge.title = 'Saving career to persistent disk...';
    } else if (this.state.status === 'saved') {
      badge.style.background = 'rgba(34,197,94,0.15)';
      badge.style.borderColor = 'rgba(34,197,94,0.5)';
      badge.style.color = '#4ade80';
      badge.innerHTML = `
        <span style="display:inline-flex;align-items:center;color:#4ade80;">${svgIcon('check', 12, '#4ade80')}</span>
        <span>Saved ${this.state.lastSaved || 'Now'}</span>
      `;
      badge.title = `Last auto-saved at ${this.state.lastSaved} (Click to open settings)`;
    } else if (this.state.status === 'error') {
      badge.style.background = 'rgba(245,158,11,0.15)';
      badge.style.borderColor = 'rgba(245,158,11,0.4)';
      badge.style.color = '#fbbf24';
      badge.innerHTML = `
        <span style="width:7px;height:7px;border-radius:50%;background:#f59e0b;display:inline-block;"></span>
        <span>Saved Locally</span>
      `;
      badge.title = 'Server unreachable; saved to browser storage';
    } else {
      badge.style.background = 'rgba(34,197,94,0.1)';
